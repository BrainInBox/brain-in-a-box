# Disposable: reproduces the windows_cancel_kills_the_whole_tree flake on fresh VMs.
# Removed before the PR is merged.
name: diag-flaky

on:
  push:
    branches: [fix/windows-cancel-test]
    paths: ['.github/workflows/diag-flaky.yml']

permissions:
  contents: read

jobs:
  loop:
    name: loop (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: confirm, mode: confirm }
          - { shard: proof-1, mode: full }
          - { shard: proof-2, mode: full }
          - { shard: proof-3, mode: full }
          - { shard: proof-4, mode: full }
          - { shard: proof-5, mode: full }
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: app/src-tauri
    env:
      RUN: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the test binary
        run: cargo test --locked --lib --no-run
      - name: Loop
        shell: pwsh
        env:
          MODE: ${{ matrix.mode }}
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = (Get-ChildItem target\debug\deps\biab_lib-*.exe | Sort-Object LastWriteTime | Select-Object -Last 1).FullName
          "exe $exe"
          $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
          "cdb present: $(Test-Path $cdb)"
          Get-MpComputerStatus -ErrorAction SilentlyContinue | Select-Object AMServiceEnabled, RealTimeProtectionEnabled, AntivirusEnabled | Format-List | Out-String
          "PSModulePath (runner): $env:PSModulePath"
          New-Item -ItemType Directory -Force logs | Out-Null
          $script:fails = 0
          function go($name, [string[]]$a) {
            $t = Get-Date
            & $exe @a *> "logs\$name.log"
            $code = $LASTEXITCODE
            "$name exit $code in $([int]((Get-Date) - $t).TotalSeconds)s"
            Select-String -Path "logs\$name.log" -Pattern 'test result|windows_cancel|windows_timeout' | ForEach-Object { '  ' + $_.Line }
            if ($code -ne 0) {
              $script:fails++
              "::group::$name output"
              Get-Content "logs\$name.log"
              "::endgroup::"
            }
          }
          # As in CI: the whole suite, once, on a VM that never ran PowerShell for these tests.
          go cold @()
          switch ($env:MODE) {
            'full' { foreach ($i in 1..12) { go "full-$i" @() } }
            'alone' { foreach ($i in 1..50) { go "alone-$i" @('sys::tests::windows_cancel_kills_the_whole_tree', '--exact', '--nocapture') } }
            'confirm' { go confirm @('diag_confirm', '--ignored', '--nocapture'); Get-Content logs\confirm.log }
          }
          "failures: $script:fails"
          if ($script:fails) { exit 1 }
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.shard }}
          path: app/src-tauri/logs
          retention-days: 7
