                          subprocess.run(["sudo", "-n", "mkdir", "-p", "/Library/Managed Preferences"], check=True)
                          subprocess.run(["sudo", "-n", "defaults", "write", plist[:-6], key, "-string", enc], check=True)
                          subprocess.run(["sudo", "-n", "killall", "cfprefsd"], capture_output=True)
                          time.sleep(2)
                          home = make_home("layers-" + tag)
                          results[tag] = dict(path=plist, key=key, **probe(tag, home))
                      except Exception as e:
                          results[tag] = {"error": repr(e)}
                      finally:
                          subprocess.run(["sudo", "-n", "rm", "-f", plist])
                          subprocess.run(["sudo", "-n", "killall", "cfprefsd"], capture_output=True)
