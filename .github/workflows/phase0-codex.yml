          def s_classify():
              dt = [f for f in default_true(True) if f != "enable_request_compression"]
              mock = Mock("classify")
              home = make_home("classify")

              def one(on_set):
                  mock.reset()
                  cage = make_cage("cls")
                  off = [f for f in dt if f not in on_set]
                  r = run(lock_args(cage, mock, off=off, on=sorted(on_set), compression_off="enable_request_compression" not in on_set),
                          home=home, cwd=cage, stdin_text=PROMPT, timeout=60, show=False)
                  inp = mock.input_digest() or {}
                  return {"rc": r.rc, "tools": mock.tools(), "endpoints": sorted(mock.endpoints()), "dev_len": sum(x["len"] for x in inp.get("input", []) if x["role"] == "developer"),
                          "unreadable": any(x["body"] is None and x["raw_len"] for x in mock.reqs), "err": [l[:200] for l in r.err.splitlines() if "ERROR" in l][:3]}

              base_off = one(set())
              base_on = one(set(dt))
              fact("classify", "baseline_all_off", base_off)
              fact("classify", "baseline_all_on", base_on)
              table = {}
              fact("classify", "enable_request_compression_solo", one({"enable_request_compression"}))
              for f in dt:
                  solo = one({f})
                  drop = one(set(dt) - {f})
                  table[f] = {"solo_adds_tools": sorted(set(solo["tools"]) - set(base_off["tools"])),
                              "solo_adds_endpoints": sorted(set(solo["endpoints"]) - set(base_off["endpoints"])),
                              "solo_dev_delta": solo["dev_len"] - base_off["dev_len"], "solo_rc": solo["rc"],
                              "drop_removes_tools": sorted(set(base_on["tools"]) - set(drop["tools"])),
                              "drop_removes_endpoints": sorted(set(base_on["endpoints"]) - set(drop["endpoints"])),
                              "drop_dev_delta": drop["dev_len"] - base_on["dev_len"], "drop_rc": drop["rc"], "unreadable": solo["unreadable"] or drop["unreadable"]}
                  print("CLASSIFY %-40s %s" % (f, json.dumps(table[f], ensure_ascii=False)), flush=True)
              (OUT / ("classify-%s.json" % OSN)).write_text(json.dumps(table, indent=1, ensure_ascii=False), encoding="utf-8")
              fact("classify", "tools_by_feature", {f: {"solo": t["solo_adds_tools"], "drop": t["drop_removes_tools"]} for f, t in table.items()
                                                    if t["solo_adds_tools"] or t["drop_removes_tools"]})
              fact("classify", "network_by_feature", {f: {"solo": t["solo_adds_endpoints"], "drop": t["drop_removes_endpoints"]} for f, t in table.items()
                                                      if t["solo_adds_endpoints"] or t["drop_removes_endpoints"]})
              fact("classify", "prompt_by_feature", {f: [t["solo_dev_delta"], t["drop_dev_delta"]] for f, t in table.items() if t["solo_dev_delta"] or t["drop_dev_delta"]})
              fact("classify", "failures", {f: [t["solo_rc"], t["drop_rc"]] for f, t in table.items() if t["solo_rc"] != 0 or t["drop_rc"] != 0})


          # ------------------------------------------------------------------ interactive (pty)
          REPLIES = [(b"\x1b[6n", b"\x1b[20;1R"), (b"\x1b[c", b"\x1b[?62;22c"), (b"\x1b[0c", b"\x1b[?62;22c"), (b"\x1b[?u", b"\x1b[?0u"),
                     (b"\x1b]10;?\x1b\\", b"\x1b]10;rgb:ffff/ffff/ffff\x1b\\"), (b"\x1b]11;?\x1b\\", b"\x1b]11;rgb:0000/0000/0000\x1b\\"),
                     (b"\x1b]10;?\x07", b"\x1b]10;rgb:ffff/ffff/ffff\x07"), (b"\x1b]11;?\x07", b"\x1b]11;rgb:0000/0000/0000\x07"),
                     (b"\x1b[18t", b"\x1b[8;40;120t"), (b"\x1b[14t", b"\x1b[4;800;1200t"), (b"\x1b[16t", b"\x1b[6;20;10t"),
                     (b"\x1b[?2026$p", b"\x1b[?2026;2$y")]
          ANSI = re.compile(r"\x1b\[[0-9;?]*[ -/]*[@-~]|\x1b\][^\x07\x1b]*(\x07|\x1b\\)|\x1b[@-Z\\-_]")


          def tui_session(home, cwd, env, mock, prompt, log_name, timeout=120):
              import fcntl, pty, select, struct, termios
              args = [CODEX, "--no-alt-screen"] if "--no-alt-screen" in (OUT / "help-top.txt").read_text(encoding="utf-8", errors="replace") else [CODEX]
              args += cflags(["openai_base_url=" + tq(mock.root + "/v1"), "chatgpt_base_url=" + tq(mock.root + "/backend-api/"),
                              "features.enable_request_compression=false", "check_for_update_on_startup=false", 'cli_auth_credentials_store="file"'])
              pid, fd = pty.fork()
              if pid == 0:
                  try:
                      fcntl.ioctl(0, termios.TIOCSWINSZ, struct.pack("HHHH", 40, 120, 0, 0))
                      os.chdir(str(cwd))
                      os.execvpe(args[0], args, env)
                  finally:
                      os._exit(127)
              buf, t0, log = b"", time.time(), []
              state = {"typed": False, "sent_at": None, "quit_at": None}

              def write(b):
                  try:
                      os.write(fd, b)
                  except OSError:
                      pass

              last_out = time.time()
              exited = None
              while time.time() - t0 < timeout:
                  r, _, _ = select.select([fd], [], [], 0.2)
                  if r:
                      try:
                          chunk = os.read(fd, 65536)
                      except OSError:
                          chunk = b""
                      if not chunk:
                          break
                      buf += chunk
                      log.append(chunk)
                      last_out = time.time()
                      for q, a in REPLIES:
                          while q in buf:
                              write(a)
                              buf = buf.replace(q, b"", 1)
                      buf = buf[-4096:]
                  now = time.time()
                  if not state["typed"] and (now - t0 > 25 or (now - t0 > 6 and now - last_out > 2.5)):
                      for ch in prompt:
                          write(ch.encode())
                          time.sleep(0.04)
                      time.sleep(0.8)
                      write(b"\r")
                      state["typed"], state["sent_at"] = True, now
                  if state["typed"] and not state["quit_at"]:
                      done = any(prompt in json.dumps(x["body"] or {}, ensure_ascii=False) for x in mock.responses())
                      if (done and now - state["sent_at"] > 8) or now - state["sent_at"] > 45:
                          write(b"\x03")
                          time.sleep(0.6)
                          write(b"\x03")
                          state["quit_at"] = now
                  if state["quit_at"] and now - state["quit_at"] > 6 and now - state["quit_at"] < 7:
                      for ch in "/quit":
                          write(ch.encode())
                          time.sleep(0.05)
                      write(b"\r")
                  try:
                      wp, status = os.waitpid(pid, os.WNOHANG)
                      if wp == pid:
                          exited = status
                          break
                  except ChildProcessError:
                      break
              if exited is None:
                  try:
                      os.kill(pid, signal.SIGKILL)
                      os.waitpid(pid, 0)
                  except Exception:
                      pass
              raw = b"".join(log)
              (OUT / log_name).write_bytes(raw)
              text = ANSI.sub("", raw.decode("utf-8", "replace"))
              (OUT / (log_name + ".txt")).write_text(text, encoding="utf-8")
              return {"exited": exited, "typed": state["typed"], "reply_on_screen": "SPIKE-REPLY" in text, "screen_tail": text[-1500:],
                      "seconds": round(time.time() - t0, 1)}


          @section
          def s_tui():
              if IS_WIN:
                  fact("tui", "skipped", "no pty driver on Windows in this probe")
                  return
              h = run(["--help"], show=False)
              (OUT / "help-top.txt").write_text(h.out, encoding="utf-8")
              mock = Mock("tui")
              vault = ROOT / "vault-tui"
              (vault / "Projets").mkdir(parents=True)
              (vault / "CLAUDE.md").write_text("VAULT-CLAUDE-MARKER\n", encoding="utf-8")
              (vault / "AGENTS.md").write_text("VAULT-AGENTS-MARKER: lis CLAUDE.md à la racine.\n", encoding="utf-8")
              subprocess.run(["git", "init", "-q", str(vault)], check=True)
              v = [("TUI", "%s %s {ev} TUI" % (shlex.quote(PY), shlex.quote(str(HOOK_PY))), None)]
              doc = hooks_doc(v, ["SessionStart", "UserPromptSubmit", "Stop"])
              home = make_home("tui", files={"hooks.json": json.dumps(doc, indent=1)})
              cfg = trust_toml(home, doc) + '\n[projects.%s]\ntrust_level = "trusted"\n\n[projects.%s]\ntrust_level = "trusted"\n' % (
                  tq(vault / "Projets"), tq(vault))
              (home / "config.toml").write_text(cfg, encoding="utf-8")
              read_hook_log()
              env = mkenv(home, {"TERM": "xterm-256color", "COLUMNS": "120", "LINES": "40"})
              t0 = time.time()
              res = tui_session(home, vault / "Projets", env, mock, "hello from the probe", "tui-session.raw")
              time.sleep(2)
              recs = read_hook_log()
              res["hooks"] = [{"event": x["event"], "source": x["stdin"].get("source") if isinstance(x["stdin"], dict) else None,
                               "transcript_path": (x["stdin"] or {}).get("transcript_path") if isinstance(x["stdin"], dict) else None,
                               "permission_mode": (x["stdin"] or {}).get("permission_mode") if isinstance(x["stdin"], dict) else None,
                               "keys": sorted(x["stdin"].keys()) if isinstance(x["stdin"], dict) else None, "parent": x["parent"][:150]} for x in recs]
              if recs:
                  (FIX / ("hook-payloads-tui-%s.jsonl" % OSN)).write_text("\n".join(json.dumps(x, ensure_ascii=False) for x in recs), encoding="utf-8")
              res["model_calls"] = len(mock.responses())
              res["endpoints"] = mock.endpoints()
              res["markers"] = [m for m in MARKER_NAMES if mock.contains(m)]
              rolls = sorted(home.glob("sessions/**/rollout-*.jsonl"))
              res["rollouts"] = [str(p.relative_to(home)) for p in rolls]
              if rolls:
                  shutil.copy(rolls[-1], FIX / ("rollout-tui-%s.jsonl" % OSN))
                  kinds = {}
                  first = None
                  for line in rolls[-1].read_text(encoding="utf-8", errors="replace").splitlines():
                      try:
                          o = json.loads(line)
                      except Exception:
                          continue
                      pl = o.get("payload") if isinstance(o.get("payload"), dict) else {}
                      k = "%s/%s" % (o.get("type"), pl.get("type"))
                      kinds[k] = kinds.get(k, 0) + 1
                      if o.get("type") == "session_meta":
                          first = {"source": pl.get("source"), "originator": pl.get("originator")}
                  res["rollout_kinds"] = kinds
                  res["session_meta"] = first
              res["procs_after"] = codex_procs()
              res["files_elsewhere"] = recent_files(t0)
              fact("tui", "session", res)
              kill_codex_procs()


          @section
          def s_sandbox():
              if os.environ.get("GITHUB_ACTIONS") != "true":
                  fact("sandbox", "skipped", "CI only")
                  return
              probe_cmd = None
              if IS_WIN:
                  probe_cmd = ["cmd", "/c", 'echo SBX-RAN & type "%s" & echo x> "%s\\sbx-write.txt" & dir "%s"' % (SECRET, OUTSIDE, OUTSIDE)]
              else:
                  probe_cmd = ["sh", "-c", "echo SBX-RAN; cat %s; echo x > %s/sbx-write && echo WRITE-OK; curl -sS -m 5 -o /dev/null -w NET-%%{http_code} https://example.com; echo" %
                               (shlex.quote(str(SECRET)), shlex.quote(str(OUTSIDE)))]
              home = make_home("sandbox", auth=False)
              res = {}
              if IS_LINUX:
                  def sysctl(k):
                      r = subprocess.run(["sysctl", "-n", k], capture_output=True, text=True)
                      return r.stdout.strip() or r.stderr.strip()
                  res["apparmor_restrict_unprivileged_userns"] = sysctl("kernel.apparmor_restrict_unprivileged_userns")
                  res["unprivileged_userns_clone"] = sysctl("kernel.unprivileged_userns_clone")
                  res["system_bwrap"] = shutil.which("bwrap")
                  res["apparmor_bwrap_profiles"] = [p for p in os.listdir("/etc/apparmor.d") if "bwrap" in p.lower()] if os.path.isdir("/etc/apparmor.d") else None
                  res["os_release"] = pathlib.Path("/etc/os-release").read_text().splitlines()[:3]
              for p in OUTSIDE.iterdir():
                  p.unlink()
              r = run(["-c", 'sandbox_mode="read-only"', "sandbox", "--"] + probe_cmd, home=home, timeout=60)
              res["default"] = {"rc": r.rc, "out": r.out[-600:], "err": r.err[-600:], "outside": sorted(p.name for p in OUTSIDE.iterdir())}
              mock = Mock("sandbox")

              def forced(tag):
                  for p in OUTSIDE.iterdir():
                      p.unlink()
                  cmd = probe_cmd[-1]
                  mock.reset([js_exec_call(cmd, "call_sb_1")])
                  h = make_home("sandbox-exec-" + tag)
                  rr = run(plain_args(mock, extra=['sandbox_mode="read-only"', 'approval_policy="never"']), home=h, cwd=WORK, stdin_text="Run", limit=1500)
                  return {"rc": rr.rc, "tool_output": [str(x["output"])[:500] for x in mock.tool_outputs()], "outside": sorted(p.name for p in OUTSIDE.iterdir())}

              res["exec_forced_default"] = forced("default")
              if IS_LINUX:
                  sw = subprocess.run(["sudo", "-n", "sysctl", "-w", "kernel.apparmor_restrict_unprivileged_userns=0"], capture_output=True, text=True)
                  res["sysctl_set"] = sw.stdout.strip() or sw.stderr.strip()
                  try:
                      for p in OUTSIDE.iterdir():
                          p.unlink()
                      r = run(["-c", 'sandbox_mode="read-only"', "sandbox", "--"] + probe_cmd, home=home, timeout=60)
                      res["userns_unrestricted"] = {"rc": r.rc, "out": r.out[-600:], "err": r.err[-600:], "outside": sorted(p.name for p in OUTSIDE.iterdir())}
                      res["exec_forced_userns_unrestricted"] = forced("unrestricted")
                  finally:
                      subprocess.run(["sudo", "-n", "sysctl", "-w", "kernel.apparmor_restrict_unprivileged_userns=1"], capture_output=True)
              fact("sandbox", "results", res)


          if __name__ == "__main__":
              for fn in SECTIONS:
                  name = fn.__name__[2:]
                  if ONLY and name not in ONLY:
                      continue
                  banner(name)
                  t0 = time.time()
                  try:
                      fn()
                  except Exception:
                      tb = traceback.format_exc()
                      print(tb, flush=True)
                      fact(name, "_crash", tb[-3000:])
                  fact(name, "_seconds", round(time.time() - t0, 1))
                  save()
              print("\nRESULTS FILE:", OUT / ("results-%s.json" % OSN))
          PYEOF

      - name: Probe Codex 0.162.1
        shell: bash
        env:
          OUT: ${{ runner.temp }}/p0-out
