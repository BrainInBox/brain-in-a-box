          def snap(roots, depth=7):
              res = {}
              for root in roots:
                  root = pathlib.Path(root)
                  if not root.exists():
                      continue
                  base = len(root.parts)
                  for dp, dns, fns in os.walk(root):
                      d = pathlib.Path(dp)
                      if len(d.parts) - base >= depth:
                          dns[:] = []
                      for f in fns:
                          p = d / f
                          try:
                              st = p.stat()
                              res[str(p)] = (st.st_size, st.st_mtime_ns)
                          except OSError:
                              pass
              return res


          def diff_snap(a, b, rel_to=None):
              def r(k):
                  if rel_to:
                      try:
                          return str(pathlib.Path(k).relative_to(rel_to))
                      except ValueError:
                          return k
                  return k
              new = [r(k) for k in b if k not in a]
              changed = [r(k) for k in b if k in a and a[k] != b[k]]
              gone = [r(k) for k in a if k not in b]
              return {"new_count": len(new), "new": sorted(new)[:80], "changed": sorted(changed)[:40], "removed": sorted(gone)[:40]}


          def watch_roots():
              roots = [HOME / ".codex", HOME / ".agents", HOME / ".cache", HOME / ".config", HOME / ".local" / "state", HOME / ".local" / "share",
                       pathlib.Path(tempfile.gettempdir())]
              if IS_MAC:
                  roots += [HOME / "Library" / "Application Support", HOME / "Library" / "Caches", HOME / "Library" / "Preferences", HOME / "Library" / "Logs"]
              if IS_WIN:
                  roots += [pathlib.Path(os.environ.get("LOCALAPPDATA", "")), pathlib.Path(os.environ.get("APPDATA", ""))]
              return [r for r in roots if str(r) and r.exists()]


          def recent_files(t0, roots=None):
              found = []
              for root in roots or watch_roots():
                  base = len(root.parts)
                  for dp, dns, fns in os.walk(root):
                      d = pathlib.Path(dp)
                      if str(d).startswith(str(ROOT)) or str(d).startswith(str(OUT)):
                          dns[:] = []
                          continue
                      if len(d.parts) - base >= 5:
                          dns[:] = []
                      for f in fns:
                          p = d / f
                          try:
                              if p.stat().st_mtime > t0:
                                  found.append(str(p))
                          except OSError:
                              pass
              rel = [x for x in found if "codex" in x.lower() or "openai" in x.lower()]
              return {"codex_or_openai": rel[:80], "other_count": len(found) - len(rel), "other_sample": [x for x in found if x not in rel][:15]}


          def grep_tree(root, needles):
              hits = {n: [] for n in needles}
              for p in pathlib.Path(root).rglob("*"):
                  if not p.is_file():
                      continue
                  try:
                      data = p.read_bytes()
                  except OSError:
                      continue
                  for n in needles:
                      if n.encode("utf-8") in data:
                          hits[n].append(str(p.relative_to(root)))
              return hits


