# Throwaway, phase 0 of the Codex plan: facts about the Codex CLI on fresh VMs, before any code.
# No secret: model and ChatGPT-backend calls go to a local mock server with fake tokens; system
# config files are written on the runner only. Removed by a commit before the branch is reviewed.
name: phase0-codex

on:
  push:
    branches: [feat/codex]
    paths: [".github/workflows/phase0-codex.yml"]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      CODEX_RELEASE: "0.162.1"
      CODEX_NON_INTERACTIVE: "1"
    steps:
      - name: Install Codex 0.162.1 (official script, macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://chatgpt.com/codex/install.sh -o "$RUNNER_TEMP/install.sh" \
            || curl -fsSL https://github.com/openai/codex/releases/latest/download/install.sh -o "$RUNNER_TEMP/install.sh"
          sh "$RUNNER_TEMP/install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://api.github.com/repos/openai/codex/releases?per_page=8" | grep '"tag_name"' || true

      - name: Install Codex 0.162.1 (official script, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy ByPass -c "irm https://chatgpt.com/codex/install.ps1 | iex"
          Join-Path $env:LOCALAPPDATA 'Programs\OpenAI\Codex\bin' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: strace (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: command -v strace || { sudo apt-get update -q && sudo apt-get install -y -q strace; }

      - name: Write the probe (1/2)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/probe.py" <<'PYEOF'
          import base64, datetime, hashlib, json, os, pathlib, re, shlex, shutil, signal, subprocess, sys, tempfile, threading, time, traceback
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          IS_WIN = os.name == "nt"
          IS_MAC = sys.platform == "darwin"
          IS_LINUX = sys.platform.startswith("linux")
          OSN = "windows" if IS_WIN else ("macos" if IS_MAC else "linux")
          OUT = pathlib.Path(os.environ["OUT"]).resolve()
          FIX = OUT / "fixtures"
          FIX.mkdir(parents=True, exist_ok=True)
          ROOT = pathlib.Path(os.path.realpath(os.environ.get("RUNNER_TEMP") or tempfile.gettempdir())) / ("p0-" + os.environ.get("P0_TAG", "main"))
          shutil.rmtree(ROOT, ignore_errors=True)
          ROOT.mkdir(parents=True)
          CODEX = shutil.which("codex")
          PY = sys.executable
          ONLY = set(sys.argv[1:])
          HOME = pathlib.Path.home()
          RESULTS = {"os": OSN, "python": sys.version.split()[0], "codex_path": CODEX}
          print("codex =", CODEX, "| python =", PY, "| ROOT =", ROOT, flush=True)


          def banner(t):
              print("\n" + "#" * 78 + "\n### " + t + "\n" + "#" * 78, flush=True)


          def fact(sec, key, value):
              RESULTS.setdefault(sec, {})[key] = value
              s = json.dumps(value, ensure_ascii=False)
              print("FACT %s.%s = %s" % (sec, key, s if len(s) < 2500 else s[:2500] + " ...(%d chars)" % len(s)), flush=True)


          def save():
              (OUT / ("results-%s.json" % OSN)).write_text(json.dumps(RESULTS, indent=1, ensure_ascii=False), encoding="utf-8")


          SECTIONS = []


          def section(fn):
              SECTIONS.append(fn)
              return fn


          # ------------------------------------------------------------------ processes
          BASE_ENV = {k: v for k, v in os.environ.items()
                      if k.upper() not in ("OPENAI_API_KEY", "CODEX_API_KEY", "CODEX_HOME", "CODEX_ACCESS_TOKEN", "OPENAI_BASE_URL", "RUST_LOG")}


          def mkenv(home=None, extra=None, drop=()):
              env = dict(BASE_ENV)
              for k in drop:
                  env.pop(k, None)
              if home is not None:
                  env["CODEX_HOME"] = str(home)
              env.update(extra or {})
              return env


          def kill_tree(p):
              if IS_WIN:
                  subprocess.run(["taskkill", "/PID", str(p.pid), "/T", "/F"], capture_output=True)
              else:
                  try:
                      os.killpg(p.pid, signal.SIGKILL)
                  except Exception:
                      p.kill()
              try:
                  p.wait(timeout=10)
              except Exception:
                  pass


          class Res:
              def __init__(self, rc, out, err, dt):
                  self.rc, self.out, self.err, self.dt = rc, out, err, dt
                  self.events = []
                  for line in out.splitlines():
                      try:
                          self.events.append(json.loads(line))
                      except Exception:
                          pass

              def thread_id(self):
                  for e in self.events:
                      if e.get("type") == "thread.started":
                          return e.get("thread_id")
                  return None

              def types(self):
                  t = []
                  for e in self.events:
                      x = e.get("type")
                      if x in ("item.completed", "item.started", "item.updated"):
                          x += ":" + str((e.get("item") or {}).get("type"))
                      t.append(x)
                  return t

              def last_message(self):
                  msg = None
                  for e in self.events:
                      it = e.get("item") or {}
                      if e.get("type") == "item.completed" and it.get("type") == "agent_message":
                          msg = it.get("text")
                  return msg


          N = [0]


          def run(args, home=None, extra=None, cwd=None, stdin_text=None, timeout=120, show=True, limit=5000, prefix=None, env=None, exe=None):
              cmd = (prefix or []) + [exe or CODEX] + list(args)
              N[0] += 1
              fo, fe = ROOT / ("run%03d.out" % N[0]), ROOT / ("run%03d.err" % N[0])
              print("\n$ [%d] codex %s%s" % (N[0], " ".join(shlex.quote(a) for a in args)[:1800],
                                            ("   [CODEX_HOME=%s]" % home) if home else ""), flush=True)
              kw = {"creationflags": subprocess.CREATE_NEW_PROCESS_GROUP} if IS_WIN else {"start_new_session": True}
              t0 = time.time()
              with open(fo, "wb") as so, open(fe, "wb") as se:
                  p = subprocess.Popen(cmd, env=env or mkenv(home, extra), cwd=str(cwd) if cwd else None, stdout=so, stderr=se,
                                       stdin=subprocess.PIPE if stdin_text is not None else subprocess.DEVNULL, **kw)
                  if stdin_text is not None:
                      def feed():
                          try:
                              p.stdin.write(stdin_text.encode("utf-8"))
                              p.stdin.close()
                          except Exception as e:
                              print("stdin write error:", e)
                      threading.Thread(target=feed, daemon=True).start()
                  try:
                      rc = p.wait(timeout=timeout)
                  except subprocess.TimeoutExpired:
                      rc = "timeout"
                      kill_tree(p)
              out = fo.read_text(encoding="utf-8", errors="replace")
              err = fe.read_text(encoding="utf-8", errors="replace")
              r = Res(rc, out, err, time.time() - t0)
              if show:
                  print("[exit %s in %.1fs]\n--- stdout\n%s\n--- stderr\n%s" % (rc, r.dt, out[-limit:], err[-limit:]), flush=True)
              return r


          def codex_procs():
              try:
                  if IS_WIN:
                      out = subprocess.run(["tasklist", "/FO", "CSV", "/NH"], capture_output=True, text=True, timeout=30).stdout
                      return [l for l in out.splitlines() if "codex" in l.lower()]
                  out = subprocess.run(["ps", "-axo", "pid,ppid,etime,command"], capture_output=True, text=True, timeout=30).stdout
                  return [l.strip()[:300] for l in out.splitlines() if "codex" in l.lower() and "probe.py" not in l and " ps -axo" not in l]
              except Exception as e:
                  return ["error %s" % e]


          def kill_codex_procs():
              if os.environ.get("GITHUB_ACTIONS") != "true":
                  return
              if IS_WIN:
                  subprocess.run(["taskkill", "/F", "/T", "/IM", "codex.exe"], capture_output=True)
                  subprocess.run(["taskkill", "/F", "/T", "/IM", "codex-code-mode-host.exe"], capture_output=True)
              else:
                  subprocess.run(["pkill", "-9", "-f", "codex"], capture_output=True)


          # ------------------------------------------------------------------ servers
          def read_body(h):
              if (h.headers.get("Transfer-Encoding") or "").lower() == "chunked":
                  data = b""
                  while True:
                      size = int(h.rfile.readline().strip().split(b";")[0] or b"0", 16)
                      if size == 0:
                          h.rfile.readline()
                          break
                      data += h.rfile.read(size)
                      h.rfile.readline()
                  return data
              n = int(h.headers.get("Content-Length") or 0)
              return h.rfile.read(n) if n else b""


          def is_responses(path):
              return path.split("?")[0].rstrip("/").endswith("/responses")


          class Mock:
              def __init__(self, name, trap=False):
                  self.name, self.trap, self.reqs, self.calls, self.lock = name, trap, [], [], threading.Lock()
                  mock = self

                  class H(BaseHTTPRequestHandler):
                      protocol_version = "HTTP/1.1"

                      def log_message(self, *a):
                          pass

                      def _rec(self, body, raw_len=0):
                          auth = self.headers.get("Authorization", "")
                          kind = None
                          if auth:
                              kind = "fake-chatgpt" if "fake-access-token" in auth else ("dummy-key" if "sk-dummy" in auth else "other(len=%d)" % len(auth))
                          r = {"method": self.command, "path": self.path, "auth": kind, "ua": self.headers.get("User-Agent"),
                               "enc": self.headers.get("Content-Encoding"), "body": body, "raw_len": raw_len, "t": time.time()}
                          with mock.lock:
                              mock.reqs.append(r)
                          return r

                      def _empty(self, code):
                          self.send_response(code)
                          self.send_header("Content-Length", "0")
                          self.end_headers()

                      def do_GET(self):
                          self._rec(None)
                          if not mock.trap and is_responses(self.path):
                              return self._empty(426)  # no websocket here: fall back to HTTPS at once
                          self._empty(404)

                      do_DELETE = do_GET
                      do_PUT = do_GET

                      def do_POST(self):
                          raw = read_body(self)
                          try:
                              body = json.loads(raw.decode("utf-8"))
                          except Exception:
                              body = None
                          self._rec(body, len(raw))
                          if mock.trap or not is_responses(self.path) or not isinstance(body, dict):
                              return self._empty(404)
                          fmt = ((body.get("text") or {}).get("format") or {})
                          reply = '{"verdict":"ok","n":1}' if fmt.get("type") == "json_schema" else "SPIKE-REPLY"
                          with mock.lock:
                              item = mock.calls.pop(0) if mock.calls else None
                          rid = "resp_p0_%d" % len(mock.reqs)
                          if item is None:
                              item = {"type": "message", "role": "assistant", "id": "msg_" + rid, "content": [{"type": "output_text", "text": reply}]}
                          evs = [{"type": "response.created", "response": {"id": rid}},
                                 {"type": "response.output_item.done", "item": item},
                                 {"type": "response.completed", "response": {"id": rid, "usage": {"input_tokens": 11, "input_tokens_details": None,
                                                                                                  "output_tokens": 3, "output_tokens_details": None, "total_tokens": 14}}}]
                          data = "".join("event: %s\ndata: %s\n\n" % (e["type"], json.dumps(e)) for e in evs).encode()
                          self.send_response(200)
                          self.send_header("Content-Type", "text/event-stream")
                          self.send_header("Content-Length", str(len(data)))
                          self.end_headers()
                          self.wfile.write(data)

                  self.srv = ThreadingHTTPServer(("127.0.0.1", 0), H)
                  threading.Thread(target=self.srv.serve_forever, daemon=True).start()
                  self.root = "http://127.0.0.1:%d" % self.srv.server_address[1]

              def reset(self, calls=()):
                  with self.lock:
                      self.reqs.clear()
                      self.calls[:] = list(calls)

              def responses(self):
                  return [r for r in self.reqs if r["method"] == "POST" and is_responses(r["path"])]

              def endpoints(self):
                  c = {}
                  for r in self.reqs:
                      k = "%s %s" % (r["method"], r["path"].split("?")[0])
                      c[k] = c.get(k, 0) + 1
                  return c

              def contains(self, marker):
                  return any(marker in json.dumps(r["body"], ensure_ascii=False) for r in self.reqs if r["body"] is not None)

              def tools(self):
                  s = set()
                  for r in self.responses():
                      if isinstance(r["body"], dict):
                          s |= set(flat_tools(r["body"]))
                  return sorted(s)

              def tool_outputs(self):
                  outs = []
                  for r in self.responses():
                      for it in (r["body"] or {}).get("input") or []:
                          if isinstance(it, dict) and str(it.get("type", "")).endswith("_output"):
                              outs.append({"type": it.get("type"), "call_id": it.get("call_id"), "output": it.get("output")})
                  uniq, seen = [], set()
                  for o in outs:
                      k = json.dumps(o, sort_keys=True)
                      if k not in seen:
                          seen.add(k)
                          uniq.append(o)
                  return uniq

              def user_texts(self):
                  rr = self.responses()
                  if not rr or not isinstance(rr[-1]["body"], dict):
                      return []
                  res = []
                  for it in rr[-1]["body"].get("input") or []:
                      if isinstance(it, dict) and it.get("role") == "user":
                          res.append("\n".join(c.get("text", "") for c in it.get("content") or [] if isinstance(c, dict)))
                  return res

              def input_digest(self):
                  rr = self.responses()
                  if not rr or not isinstance(rr[0]["body"], dict):
                      return None
                  b = rr[0]["body"]
                  d = {"instructions_len": len(b.get("instructions") or ""), "instructions_head": (b.get("instructions") or "")[:120], "input": []}
                  for it in b.get("input") or []:
                      if not isinstance(it, dict):
                          continue
                      txt = "\n".join(c.get("text", "") for c in it.get("content") or [] if isinstance(c, dict))
                      d["input"].append({"role": it.get("role") or it.get("type"), "len": len(txt), "head": txt[:160]})
                  d["model"] = b.get("model")
                  d["reasoning"] = b.get("reasoning")
                  return d


          def flat_tools(body):
              names = set()

              def add(t, ns=None):
                  if not isinstance(t, dict):
                      return
                  n = t.get("name") or t.get("type") or "?"
                  full = ns + "." + n if ns else n
                  if t.get("tools"):
                      for x in t["tools"]:
                          add(x, full)
                      return
                  names.add(full)
                  if n == "exec":
                      for m in re.findall(r"^### `([A-Za-z0-9_\-]+)`", t.get("description") or "", re.M):
                          names.add(full + ">" + m)

              for t in body.get("tools") or []:
                  add(t)
              for it in body.get("input") or []:
                  if isinstance(it, dict) and it.get("type") == "additional_tools":
                      for t in it.get("tools") or []:
                          add(t)
              return sorted(names)


          class Proxy:
              def __init__(self):
                  self.seen = []
                  px = self

                  class H(BaseHTTPRequestHandler):
                      protocol_version = "HTTP/1.1"

                      def log_message(self, *a):
                          pass

                      def _deny(self):
                          px.seen.append("%s %s" % (self.command, self.path))
                          self.send_response(403)
                          self.send_header("Content-Length", "0")
                          self.send_header("Connection", "close")
                          self.end_headers()
                          self.close_connection = True

                      do_CONNECT = do_GET = do_POST = do_HEAD = do_PUT = do_DELETE = _deny

                  self.srv = ThreadingHTTPServer(("127.0.0.1", 0), H)
                  threading.Thread(target=self.srv.serve_forever, daemon=True).start()
                  self.url = "http://127.0.0.1:%d" % self.srv.server_address[1]

              def env(self):
                  e = {"HTTPS_PROXY": self.url, "HTTP_PROXY": self.url, "ALL_PROXY": self.url, "NO_PROXY": "127.0.0.1,localhost"}
                  if not IS_WIN:
                      e.update({k.lower(): v for k, v in e.items()})
                  return e

              def hosts(self):
                  return sorted(set(self.seen))


          # ------------------------------------------------------------------ fixtures on disk
          def b64(o):
              return base64.urlsafe_b64encode(json.dumps(o).encode()).decode().rstrip("=")


          IDT = b64({"alg": "none", "typ": "JWT"}) + "." + b64({"email": "p0@example.com", "https://api.openai.com/auth": {
              "chatgpt_plan_type": "plus", "chatgpt_account_id": "acct-fake", "chatgpt_user_id": "user-fake"}}) + ".c2lnbmF0dXJl"


          def fake_auth():
              return {"auth_mode": "chatgpt", "OPENAI_API_KEY": None,
                      "tokens": {"id_token": IDT, "access_token": "fake-access-token", "refresh_token": "fake-refresh-token", "account_id": "acct-fake"},
                      "last_refresh": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.%fZ")}


          def make_home(name, auth=True, config="", files=None):
              h = ROOT / "homes" / name
              shutil.rmtree(h, ignore_errors=True)
              h.mkdir(parents=True)
              if auth:
                  (h / "auth.json").write_text(json.dumps(fake_auth()), encoding="utf-8")
              if config:
                  (h / "config.toml").write_text(config, encoding="utf-8")
              for rel, txt in (files or {}).items():
                  p = h / rel
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(txt, encoding="utf-8")
              return h


          SCHEMA = json.dumps({"type": "object", "properties": {"verdict": {"type": "string", "enum": ["ok", "ko"]}, "n": {"type": "integer"}},
                               "required": ["verdict", "n"], "additionalProperties": False})
          CAGES = [0]


          def make_cage(tag):
              CAGES[0] += 1
              c = ROOT / "cages" / ("%03d-%s" % (CAGES[0], tag))
              c.mkdir(parents=True)
              (c / "schema.json").write_text(SCHEMA, encoding="utf-8")
              (c / "system.md").write_text("You are a strict JSON judge. INSTR-FILE-MARKER\n", encoding="utf-8")
              return c


          WORK = ROOT / "work"
          WORK.mkdir()
          SECRET = WORK / "secret-note.txt"
          SECRET.write_text("a file the model could read P0-SECRET-CONTENT\n", encoding="utf-8")
          OUTSIDE = ROOT / "outside"
          OUTSIDE.mkdir()
          MARKERS = ROOT / "markers"
          MARKERS.mkdir()
          MARKER_PY = ROOT / "marker.py"
          MARKER_PY.write_text("import pathlib, sys\npathlib.Path(%r, sys.argv[1]).write_text('x')\nsys.exit(1)\n" % str(MARKERS), encoding="utf-8")


          def marker_cmd(name):
              if IS_WIN:
                  return '& "%s" "%s" %s' % (PY, MARKER_PY, name)
              return "%s %s %s" % (shlex.quote(PY), shlex.quote(str(MARKER_PY)), name)


          def markers():
              return sorted(p.name for p in MARKERS.iterdir())


          def clear_markers():
              for p in MARKERS.iterdir():
                  p.unlink()


          def tq(s):
              return json.dumps(str(s))


          # ------------------------------------------------------------------ lockdown argv
          KNOWN_OFF = ["shell_tool", "unified_exec", "view_image", "multi_agent", "multi_agent_v2", "apps", "plugins", "memories", "skill_search",
                       "image_generation", "goals", "tool_suggest", "browser_use", "computer_use", "sleep_tool", "hooks", "code_mode",
                       "code_mode_host", "in_app_browser"]
          NONFEAT = ['web_search="disabled"', 'approval_policy="never"', "agents.enabled=false", "tools.experimental_request_user_input.enabled=false",
                     "tools.update_plan.enabled=false", "skills.include_instructions=false", "skills.bundled.enabled=false", "project_doc_max_bytes=0",
                     "include_environment_context=false", "include_permissions_instructions=false", "include_apps_instructions=false",
                     "include_collaboration_mode_instructions=false", 'model_provider="openai"', 'cli_auth_credentials_store="file"',
                     "check_for_update_on_startup=false", "analytics.enabled=false", "feedback.enabled=false", 'history.persistence="none"',
                     'model_reasoning_effort="low"']


          def cflags(items):
              out = []
              for o in items:
                  out += ["-c", o]
              return out


          def lock_args(cage, mock, off=None, on=(), extra=(), ephemeral=True, base_url=None, chatgpt_url=None, compression_off=True, prompt="-"):
              off = KNOWN_OFF if off is None else off
              a = ["exec", "--json", "--skip-git-repo-check", "--ignore-user-config", "--ignore-rules", "-s", "read-only", "-C", str(cage),
                   "--output-schema", str(cage / "schema.json"), "-o", str(cage / "answer.json")]
              if ephemeral:
                  a.append("--ephemeral")
              feats = ["features.%s=false" % f for f in off if f not in on] + ["features.%s=true" % f for f in on]
              if compression_off and "enable_request_compression" not in on:
                  feats.append("features.enable_request_compression=false")
              a += cflags(feats + NONFEAT)
              a += cflags(["model_instructions_file=" + tq(cage / "system.md"),
                           "openai_base_url=" + tq(mock.root + "/v1" if base_url is None else base_url),
                           "chatgpt_base_url=" + tq(mock.root + "/backend-api/" if chatgpt_url is None else chatgpt_url)])
              a += cflags(extra)
              a.append(prompt)
              return a


          def plain_args(mock, extra=(), ephemeral=True, cwd=None, skip_git=True, bypass=False):
              a = ["exec", "--json"] + (["--skip-git-repo-check"] if skip_git else []) + (["--ephemeral"] if ephemeral else [])
              if bypass:
                  a.append("--dangerously-bypass-hook-trust")
              if cwd:
                  a += ["-C", str(cwd)]
              a += cflags(["openai_base_url=" + tq(mock.root + "/v1"), "chatgpt_base_url=" + tq(mock.root + "/backend-api/"),
                           "features.enable_request_compression=false", "check_for_update_on_startup=false", "analytics.enabled=false",
                           'cli_auth_credentials_store="file"'] + list(extra))
              a.append("-")
              return a


          MARKER_NAMES = ["GLOBAL-AGENTS-MARKER", "PROJECT-AGENTS-MARKER", "SKILL-DESCRIPTION-MARKER", "HOME-AGENTS-SKILL-MARKER", "USER-CONFIG-MARKER",
                          "SYSTEM-DEV-MARKER", "REQ-DEV-MARKER", "MDM-DEV-MARKER", "INSTR-FILE-MARKER", "HOOK-CONTEXT", "You are Codex",
                          "VAULT-AGENTS-MARKER", "VAULT-CLAUDE-MARKER", "OVERRIDE-MARKER"]


          def summary(mock, res, proxy=None):
              d = {"rc": res.rc, "dt": round(res.dt, 1), "thread": res.thread_id(), "types": res.types(), "n_model_calls": len(mock.responses()),
                   "tools": mock.tools(), "endpoints": mock.endpoints(), "last_message": res.last_message(),
                   "markers": [m for m in MARKER_NAMES if mock.contains(m)], "auth_kinds": sorted(set(str(r["auth"]) for r in mock.reqs)),
                   "unreadable_bodies": [r["path"] + " enc=" + str(r["enc"]) for r in mock.reqs if r["method"] == "POST" and r["body"] is None and r["raw_len"]],
                   "stderr_errors": [l[:300] for l in res.err.splitlines() if " ERROR " in l or " WARN " in l or "error" in l.lower()][:25]}
              if proxy is not None:
                  d["proxy"] = proxy.hosts()
              return d


          def hostile_home(name, trap_root):
