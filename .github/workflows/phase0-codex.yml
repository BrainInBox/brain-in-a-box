          # ------------------------------------------------------------------ hooks
          HOOK_LOG = ROOT / "hooks.log"
          HOOK_SRC = r'''import json, os, subprocess, sys
          event, variant = sys.argv[1], sys.argv[2]
          raw = sys.stdin.buffer.read().decode("utf-8", "replace")
          try:
              data = json.loads(raw)
          except Exception:
              data = {"_unparsed": raw[:500]}
          def parent():
              ppid = os.getppid()
              try:
                  if sys.platform.startswith("linux"):
                      return open("/proc/%d/cmdline" % ppid, "rb").read().replace(b"\0", b" ").decode("utf-8", "replace")
                  if sys.platform == "darwin":
                      return subprocess.run(["ps", "-o", "command=", "-p", str(ppid)], capture_output=True, text=True).stdout.strip()
                  return subprocess.run(["powershell", "-NoProfile", "-Command", "(Get-CimInstance Win32_Process -Filter 'ProcessId=%d').CommandLine" % ppid],
                                        capture_output=True, text=True, timeout=30).stdout.strip()
              except Exception as e:
                  return "error %s" % e
          names = sorted(os.environ)
          rec = {"event": event, "variant": variant, "stdin": data, "parent": parent(), "cwd": os.getcwd(), "argv": sys.argv,
                 "env_names": names, "rust_log": os.environ.get("RUST_LOG"), "codex_vars": {k: os.environ[k] for k in names if k.startswith("CODEX") and "KEY" not in k and "TOKEN" not in k}}
          with open(LOG, "a", encoding="utf-8") as f:
              f.write(json.dumps(rec, ensure_ascii=False) + "\n")
          if event in ("SessionStart", "UserPromptSubmit"):
              ctx = "HOOK-CONTEXT-%s-%s é—✓" % (event, variant)
              sys.stdout.buffer.write(json.dumps({"hookSpecificOutput": {"hookEventName": event, "additionalContext": ctx}}, ensure_ascii=False).encode("utf-8"))
          '''
          HOOK_DIR = ROOT / "hooks"
          HOOK_DIR.mkdir()
          HOOK_PY = HOOK_DIR / "hook.py"
          HOOK_PY.write_text("LOG = %r\n" % str(HOOK_LOG) + HOOK_SRC, encoding="utf-8")
          SPACE_DIR = ROOT / "dir with space"
          SPACE_DIR.mkdir()
          HOOK_SP = SPACE_DIR / "hook.py"
          HOOK_SP.write_text("LOG = %r\n" % str(HOOK_LOG) + HOOK_SRC, encoding="utf-8")
          EVENTS = ["SessionStart", "UserPromptSubmit", "Stop"]
          LABEL = {"SessionStart": "session_start", "UserPromptSubmit": "user_prompt_submit", "Stop": "stop", "PreToolUse": "pre_tool_use"}


          def py_with_space():
              target = ROOT / "py space"
              if target.exists():
                  return target / os.path.basename(PY)
              try:
                  if IS_WIN:
                      subprocess.run(["cmd", "/c", "mklink", "/J", str(target), os.path.dirname(PY)], check=True, capture_output=True)
                  else:
                      target.mkdir()
                      os.symlink(PY, target / os.path.basename(PY))
                      return target / os.path.basename(PY)
              except Exception as e:
                  print("py_with_space failed:", e)
                  return None
              return target / os.path.basename(PY)


          def hook_variants():
              pysp = py_with_space()
              if IS_WIN:
                  v = [("W0", 'echo W0-{ev}>> "%s"' % (ROOT / "w0-marker.txt"), "commandWindows"),
                       ("W1", '%s %s {ev} W1' % (PY, HOOK_PY), "commandWindows"),
                       ("W2", '"%s" "%s" {ev} W2' % (PY, HOOK_PY), "commandWindows"),
                       ("W3", 'python.exe %s {ev} W3' % HOOK_PY, "commandWindows"),
                       ("W5", '& "%s" "%s" {ev} W5' % (PY, HOOK_PY), "commandWindows"),
                       ("W5s", '& "%s" "%s" {ev} W5s' % (PY, HOOK_PY), "command_windows")]
                  if pysp:
                      v.append(("W4", '& "%s" "%s" {ev} W4' % (pysp, HOOK_SP), "commandWindows"))
                  return v
              v = [("U0", "echo U0-{ev} >> %s" % shlex.quote(str(ROOT / "u0-marker.txt")), None),
                   ("U1", "%s %s {ev} U1" % (shlex.quote(PY), shlex.quote(str(HOOK_PY))), None),
                   ("U2", '"%s" "%s" {ev} U2' % (PY, HOOK_PY), None)]
              if pysp:
                  v.append(("U4", "%s %s {ev} U4" % (shlex.quote(str(pysp)), shlex.quote(str(HOOK_SP))), None))
              return v


          def hooks_doc(variants, events=EVENTS):
              doc = {"hooks": {}}
              for ev in events:
                  groups = []
                  for tag, tmpl, key in variants:
                      h = {"type": "command", "command": tmpl.format(ev=ev) if not IS_WIN else "echo unix-only", "timeout": 30}
                      if key:
                          h[key] = tmpl.format(ev=ev)
                      groups.append({"hooks": [h]})
                  doc["hooks"][ev] = groups
              return doc


          def trust_toml(home, doc):
              lines = []
              src = str(pathlib.Path(home) / "hooks.json")
              for ev, groups in doc["hooks"].items():
                  for gi, g in enumerate(groups):
                      h = g["hooks"][0]
                      selected = (h.get("commandWindows") or h.get("command_windows") or h["command"]) if IS_WIN else h["command"]
                      ident = {"event_name": LABEL[ev], "hooks": [{"type": "command", "command": selected, "timeout": h["timeout"], "async": False}]}
                      hsh = "sha256:" + hashlib.sha256(json.dumps(ident, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()).hexdigest()
                      lines.append("[hooks.state.%s]\ntrusted_hash = %s\n" % (json.dumps("%s:%s:%d:0" % (src, LABEL[ev], gi)), json.dumps(hsh)))
              return "\n".join(lines)


          def read_hook_log():
              if not HOOK_LOG.exists():
                  return []
              recs = [json.loads(l) for l in HOOK_LOG.read_text(encoding="utf-8").splitlines() if l.strip()]
              HOOK_LOG.unlink()
              return recs


          def hook_run(tag, variants, trust=False, bypass=True, extra_env=None, events=EVENTS):
              mock = Mock("hooks-" + tag)
              doc = hooks_doc(variants, events)
              home = make_home("hooks-" + tag, files={"hooks.json": json.dumps(doc, indent=1)})
              if trust:
                  (home / "config.toml").write_text(trust_toml(home, doc), encoding="utf-8")
              for f in ("w0-marker.txt", "u0-marker.txt"):
                  if (ROOT / f).exists():
                      (ROOT / f).unlink()
              read_hook_log()
              env = {"RUST_LOG": "codex_hooks=trace,codex_core::hook_runtime=trace,warn"}
              env.update(extra_env or {})
              r = run(plain_args(mock, ephemeral=False, bypass=bypass), home=home, cwd=WORK, stdin_text="Reply please", extra=env, limit=3000, timeout=150)
              recs = read_hook_log()
              ran = {}
              for rec in recs:
                  ran.setdefault(rec["variant"], []).append(rec["event"])
              for f in ("w0-marker.txt", "u0-marker.txt"):
                  if (ROOT / f).exists():
                      ran.setdefault(f[:2].upper(), []).extend(x.strip() for x in (ROOT / f).read_text(errors="replace").splitlines())
              ctx = {}
              for tagv, _, _ in variants:
                  for ev in ("SessionStart", "UserPromptSubmit"):
                      exact = "HOOK-CONTEXT-%s-%s é—✓" % (ev, tagv)
                      ctx["%s/%s" % (tagv, ev)] = "exact" if mock.contains(exact) else ("mangled" if mock.contains("HOOK-CONTEXT-%s-%s" % (ev, tagv)) else "absent")
              hook_lines = [l[:400] for l in r.err.splitlines() if "hook" in l.lower()][:60]
              parents = sorted(set("%s: %s" % (x["variant"], x["parent"][:200]) for x in recs))
              rolls = sorted(home.glob("sessions/**/rollout-*.jsonl"))
              if rolls:
                  shutil.copy(rolls[0], FIX / ("rollout-exec-hooks-%s-%s.jsonl" % (tag, OSN)))
              if recs:
                  (FIX / ("hook-payloads-%s-%s.jsonl" % (tag, OSN))).write_text("\n".join(json.dumps(x, ensure_ascii=False) for x in recs), encoding="utf-8")
              return {"rc": r.rc, "ran": ran, "context": ctx, "parents": parents, "stderr_hook_lines": hook_lines, "types": r.types(),
                      "rust_log_seen_by_hook": sorted(set(str(x.get("rust_log")) for x in recs)),
                      "payload_keys": {x["event"]: sorted((x["stdin"] or {}).keys()) for x in recs if isinstance(x.get("stdin"), dict)},
                      "payload_sample": {x["event"]: {k: x["stdin"].get(k) for k in ("hook_event_name", "source", "transcript_path", "permission_mode", "model", "cwd", "session_id")}
                                         for x in recs if isinstance(x.get("stdin"), dict)}}


