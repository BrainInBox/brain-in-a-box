                          "mcp_list": {"rc": m.rc, "out": m.out[:400], "err": m.err[:300]},
                          "stderr_tail": r.err[-700:], "types": r.types()[:10]}

              for tag, fname, text in cases:
                  home = make_home("layers-" + tag)
                  path = os.path.join(sysdir, fname)
