name: app-release

# The app as people download it: a preview on GitHub Releases, unsigned until the signing secrets exist.
#
# - pull_request touching the app: builds it and leaves the installers as an artifact of the
#   run. Nothing is published; the token reads only and no secret is used. A fork's pull
#   request builds and checks the same way but leaves no installer behind: it would sit in
#   this repository's Actions tab under the app's own name.
# - push to master touching the app, or a run by hand on master: builds without any cache
#   (the default branch's caches can be written by any of its jobs), then a job of its own,
#   the only one allowed to write, attests the installers (gh attestation verify) and
#   publishes a pre-release tagged app-v<version>-preview.<run number> with them and SHA256SUMS,
#   and deletes the app previews beyond the 5 newest. A tag that already exists is never moved.
#   A run by hand on another branch only builds.
# - the version is MAJOR.MINOR of app/src-tauri/tauri.conf.json and the run number, given to Tauri
#   before the build: each build is newer than the one before, so Windows' installer updates the
#   app in place, and the version installed says which preview it is.
# - the same files, named without their version, also go to the release app-latest, the only tag
#   ever moved: the site's buttons point at them, and keep working when api.github.com answers no.
#   They are the very files of the preview (same SHA-256, so the same attestation).
# - signing: Windows (SignPath) and Apple (Developer ID, notarization) only sign once the
#   repository has their secrets, and only the preview that is published. Without them nothing
#   changes: the app stays unsigned, as today. The app compiles without any secret (every build.rs
#   and proc-macro of its dependencies runs then); only the bundling, which compiles nothing, reads
#   Apple's. The release says "non signée" only for a system whose files are not signed; the site
#   (site/index.html) says it too, in its own words, to change by hand the day a system is signed.
#
# Actions are pinned to a commit (a tag can be moved), and engine/tests/test_release_workflow.py
# holds all of the above, since the publishing part only ever runs after the merge.
#
# macOS: one universal DMG (Apple Silicon and Intel), ad-hoc signed: unsigned by Apple, macOS
# offers "Open Anyway" for it, while an app with no signature at all reads as "damaged". Its window
# shows the arrow to Applications (tauri.macos.conf.json): Finder lays it out, which Tauri skips on
# a CI unless TAURI_BUNDLER_DMG_IGNORE_CI; if Finder fails twice, the DMG goes out plain.
# Windows: built once the Tauri config declares an NSIS installer ("nsis" or "all" in
# bundle.targets of tauri.windows.conf.json, or of tauri.conf.json), see
# .github/ci/app-release-plan.py. Until then the matrix is macOS only and nothing else changes.
# Linux: an AppImage (runs without installing, for the user alone) and a .deb, built on Ubuntu
# 22.04 so that both run on 22.04 and later, once tauri.linux.conf.json declares them. The tools
# an AppImage is made with are fetched pinned and checked (.github/ci/appimage-tools.sh).

on:
  pull_request:
    branches: [master]
    paths:
      - "app/**"
      # The app reads Codex's gate in its own copy of it before any kit is on disk (agents.rs).
      - "engine/hooks/_agents.py"
      - ".github/workflows/release.yml"
      - ".github/ci/app-release-plan.py"
  push:
    branches: [master]
    paths:
      - "app/**"
      - "engine/hooks/_agents.py"
      - ".github/workflows/release.yml"
      - ".github/ci/app-release-plan.py"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its build; master's builds each get their turn.
concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: What to build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      label: ${{ steps.plan.outputs.label }}
      publish: ${{ steps.plan.outputs.publish }}
      upload: ${{ steps.plan.outputs.upload }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - id: plan
        env:
          PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 -I .github/ci/app-release-plan.py | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: plan
    runs-on: ${{ matrix.os }}
    # Windows signing waits for two SignPath requests (up to 30 min each: a release-signing policy
    # waits for a person's approval), after a build without any cache.
    timeout-minutes: ${{ matrix.platform == 'windows' && needs.plan.outputs.publish == 'true' && vars.SIGNPATH_ORGANIZATION_ID != '' && 150 || 60 }}
    # SignPath's action reads the job and downloads the unsigned artifact with the job's token.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TAURI_CLI_VERSION: "2.11.5"
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
      PLATFORM: ${{ matrix.platform }}
      LABEL: ${{ needs.plan.outputs.label }}
      VERSION: ${{ needs.plan.outputs.version }}
      APPLE_SIGNING_IDENTITY: "-"
      # Only the DMG reads it: Finder lays out its window (background, places) on the runner too.
      TAURI_BUNDLER_DMG_IGNORE_CI: "true"
      # true or false, never the secret: whether the published Windows preview is signed (SignPath),
      # whether the published DMG is (Developer ID).
      SIGNPATH: ${{ needs.plan.outputs.publish == 'true' && secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
      DEVELOPER_ID: ${{ needs.plan.outputs.publish == 'true' && secrets.APPLE_CERTIFICATE != '' }}
    # Whether each system's files are signed, for the release notes (one name per system: the
    # matrix's outputs are put together).
    outputs:
      macos_signed: ${{ steps.signed.outputs.macos }}
      windows_signed: ${{ steps.signed.outputs.windows }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # WebKitGTK and GTK to build against (Ubuntu's own archive), and the AppImage tools and runtime,
      # pinned (the runtime through LDAI_RUNTIME_FILE, for the build step).
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libssl-dev libxdo-dev patchelf file
          bash .github/ci/appimage-tools.sh

      - name: Rust targets
        run: |
          if [ "$TARGET" = universal-apple-darwin ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          else
            rustup target add "$TARGET"
          fi
          rustc --version

      # Caches speed up pull requests only. The build that publishes starts clean: whatever a
      # job of master put in a cache (a cargo-tauri, a target/) would end up in the preview.
      - name: Tauri CLI, cached
        id: tauri-cli
        if: needs.plan.outputs.publish != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.os == 'Windows' && '~/.cargo/bin/cargo-tauri.exe' || '~/.cargo/bin/cargo-tauri' }}
          key: tauri-cli-${{ env.TAURI_CLI_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Tauri CLI, pinned as in app/README.md
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked

      - name: Cargo cache
        if: needs.plan.outputs.publish != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/src-tauri/target
          key: app-release-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: app-release-${{ runner.os }}-${{ matrix.target }}-

      # The app compiled, not bundled, without any secret in its environment: every build.rs and
      # proc-macro of its dependencies runs here.
      - name: Build (${{ matrix.target }})
        working-directory: app/src-tauri
        run: cargo tauri build --ci --no-bundle --target "$TARGET" --config "{\"version\":\"$VERSION\"}" -- --locked

      # A bundle left in the cache never passes for this build's. bundle_dmg.sh sometimes
      # finds hdiutil busy on a runner: one more try, and a last one without Finder's layout of the
      # DMG's window (it would only lose its background). Bundling compiles nothing.
      # Developer ID and notarization: only for the preview that is published, once the secrets
      # exist (Tauri signs, notarizes and staples). Without them the variables are dropped and the
      # app is ad-hoc signed as before.
      - name: Bundle (${{ matrix.bundles }})
        working-directory: app/src-tauri
        env:
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && needs.plan.outputs.publish == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && needs.plan.outputs.publish == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && needs.plan.outputs.publish == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && needs.plan.outputs.publish == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && needs.plan.outputs.publish == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          # Tauri reads a variable that is set, even empty: an empty certificate would fail the build.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ] && [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ] \
              || { echo "::error::APPLE_CERTIFICATE without APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID"; exit 1; }
            # The identity comes from the certificate.
            unset APPLE_SIGNING_IDENTITY
            echo "Developer ID signing and notarization"
          fi
          bundle() {
            rm -rf "target/$TARGET/release/bundle"
            cargo tauri bundle --ci --target "$TARGET" --bundles "$BUNDLES" --config "{\"version\":\"$VERSION\"}"
          }
          bundle || { echo "::warning::bundling failed once, trying again"; bundle; } || {
            [ "$RUNNER_OS" = macOS ] || exit 1
            echo "::warning::the DMG once more, without Finder's layout: no background, no arrow"
            TAURI_BUNDLER_DMG_IGNORE_CI=false bundle
          }

      - name: The DMG verifies, mounts, holds Brain in a Box.app for both architectures, and runs
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          shopt -s nullglob
          dmgs=(app/src-tauri/target/"$TARGET"/release/bundle/dmg/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] || { echo "::error::expected one DMG, found ${#dmgs[@]}"; exit 1; }
          mkdir -p dist
          dmg="dist/Brain-in-a-Box_${LABEL}_macos-universal.dmg"
          cp "${dmgs[0]}" "$dmg"

          hdiutil verify "$dmg"
          mnt="$RUNNER_TEMP/dmg"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mnt" "$dmg"
          trap 'hdiutil detach "$mnt" -force >/dev/null 2>&1 || true' EXIT
          ls -la "$mnt"

          app="$mnt/Brain in a Box.app"
          [ -d "$app" ] || { echo "::error::Brain in a Box.app is not in the DMG"; exit 1; }
          [ -L "$mnt/Applications" ] || { echo "::error::no Applications shortcut to drag the app onto"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          # The window Finder opens: its background (the arrow to Applications) and the icons' places.
          if [ -f "$mnt/.background/dmg-background.tiff" ] && [ -f "$mnt/.DS_Store" ]; then
            echo "window laid out, with its background"
          else
            echo "::warning::the DMG opens without its background (no arrow to Applications)"
          fi
          # Signed by Apple's Developer ID: notarized, the ticket stapled, accepted by Gatekeeper.
          if [ "$DEVELOPER_ID" = true ]; then
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          fi

          bin="$app/Contents/MacOS/brain-in-a-box"
          archs=$(lipo -archs "$bin")
          echo "architectures: $archs"
          for a in arm64 x86_64; do
            case " $archs " in *" $a "*) ;; *) echo "::error::no $a in the app"; exit 1 ;; esac
          done

          # --diagnose reads the machine and prints JSON: each slice must start and answer.
          check='import json, sys; d = json.load(sys.stdin); assert d["arch"] == sys.argv[1], d["arch"]; print(sys.argv[1], "ok:", d["os"], len(d["checks"]), "checks")'
          native=$(uname -m)
          "$bin" --diagnose | python3 -I -c "$check" "$native"
          if [ "$native" = x86_64 ]; then
            echo "::notice::Intel runner: the arm64 slice was checked with lipo only"
          elif arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 "$bin" --diagnose | python3 -I -c "$check" x86_64
          else
            echo "::notice::no Rosetta on this runner: the x86_64 slice was checked with lipo only"
          fi

      # The .deb installs with apt (its dependencies from Ubuntu's archive), the AppImage starts with
      # the pinned runtime and runs without installing (unpacked: a runner may lack FUSE); each
      # answers --diagnose.
      - name: The .deb installs and runs, the AppImage runs
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          shopt -s nullglob
          debs=(app/src-tauri/target/"$TARGET"/release/bundle/deb/*.deb)
          images=(app/src-tauri/target/"$TARGET"/release/bundle/appimage/*.AppImage)
          [ "${#debs[@]}" -eq 1 ] || { echo "::error::expected one .deb, found ${#debs[@]}"; exit 1; }
          [ "${#images[@]}" -eq 1 ] || { echo "::error::expected one AppImage, found ${#images[@]}"; exit 1; }
          mkdir -p dist
          deb="dist/Brain-in-a-Box_${LABEL}_linux-amd64.deb"
          image="dist/Brain-in-a-Box_${LABEL}_linux-x86_64.AppImage"
          cp "${debs[0]}" "$deb"
          cp "${images[0]}" "$image"
          chmod 755 "$image"

          dpkg-deb -I "$deb"
          [ "$(dpkg-deb -f "$deb" Package)" = brain-in-a-box ] || { echo "::error::not the brain-in-a-box package"; exit 1; }
          [ "$(dpkg-deb -f "$deb" Architecture)" = amd64 ] || { echo "::error::not an amd64 package"; exit 1; }
          # tauri-bundler writes the entries without a leading ./ (read whole: grep -q would cut dpkg-deb's pipe)
          contents=$(dpkg-deb -c "$deb")
          grep -Eq ' (\./)?usr/bin/brain-in-a-box$' <<< "$contents" || { echo "::error::no /usr/bin/brain-in-a-box in the .deb"; exit 1; }
          [ "$(head -c 4 "$image" | od -An -tx1 | tr -d ' ')" = 7f454c46 ] || { echo "::error::the AppImage is not an ELF program"; exit 1; }
          [ "$(dd if="$image" bs=1 skip=8 count=3 2>/dev/null | od -An -tx1 | tr -d ' ')" = 414902 ] \
            || { echo "::error::not a type 2 AppImage"; exit 1; }
          bash .github/ci/appimage-tools.sh check "$image"

          check='import json, sys; d = json.load(sys.stdin); ids = [c["id"] for c in d["checks"]]; assert "paquets" in ids and "linux" in ids, ids; print(sys.argv[1], "ok:", d["os"], len(ids), "checks")'
          sudo apt-get install -y -q "./$deb"
          /usr/bin/brain-in-a-box --diagnose | python3 -I -c "$check" deb
          APPIMAGE_EXTRACT_AND_RUN=1 "./$image" --diagnose | python3 -I -c "$check" AppImage
          sudo apt-get remove -y -q brain-in-a-box

      # Windows signing, SignPath (signpath.org): only for the preview that is published, once the
      # repository has the secret SIGNPATH_API_TOKEN and the variable SIGNPATH_ORGANIZATION_ID.
      # Smart App Control checks the app as well as its installer: the app is signed first, then put
      # in the installer again (tauri bundle), then the installer is signed. SignPath's GitHub
      # connector takes each file from an artifact of this run and checks it was built here.
      # Not signed yet: NSIS's plugins (nsDialogs, System, nsis_tauri_utils), which the installer
      # unpacks in %TEMP% and loads, and uninstall.exe, which makensis writes inside the installer.
      # Tauri signs them only through bundle.windows.signCommand; until they are, Smart App Control
      # may still block the installer.
      # Tauri marks the app with the kind of bundle it is in (for its updater) while it bundles: the
      # mark is written before signing, so that bundling then leaves the signed app as it is.
      - name: "Windows signing 1/3: the app, marked for its NSIS bundle"
        if: runner.os == 'Windows' && env.SIGNPATH == 'true'
        run: |
          exe="app/src-tauri/target/$TARGET/release/brain-in-a-box.exe"
          python -I -c 'import sys; p = sys.argv[1]; b = open(p, "rb").read(); old = b"__TAURI_BUNDLE_TYPE_VAR_UNK"; assert old in b, "no bundle mark in the app"; open(p, "wb").write(b.replace(old, b"__TAURI_BUNDLE_TYPE_VAR_NSS", 1))' "$exe"
          mkdir -p signpath/app
          cp "$exe" signpath/app/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: unsigned-app
        if: runner.os == 'Windows' && env.SIGNPATH == 'true'
        with:
          name: signpath-app
          path: signpath/app/
          if-no-files-found: error
          retention-days: 1

      - uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        if: runner.os == 'Windows' && env.SIGNPATH == 'true'
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'brain-in-a-box' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signpath/app-signed

      - name: "Windows signing 2/3: the signed app, bundled again"
        if: runner.os == 'Windows' && env.SIGNPATH == 'true'
        working-directory: app/src-tauri
        run: |
          cp ../../signpath/app-signed/brain-in-a-box.exe "target/$TARGET/release/brain-in-a-box.exe"
          rm -rf "target/$TARGET/release/bundle"
          cargo tauri bundle --ci --target "$TARGET" --bundles nsis --config "{\"version\":\"$VERSION\"}"

      - name: The Windows installer is there
        if: runner.os == 'Windows'
        run: |
          shopt -s nullglob
          exes=(app/src-tauri/target/"$TARGET"/release/bundle/nsis/*-setup.exe)
          [ "${#exes[@]}" -eq 1 ] || { echo "::error::expected one NSIS installer, found ${#exes[@]}"; exit 1; }
          mkdir -p dist
          exe="dist/Brain-in-a-Box_${LABEL}_windows-x64-setup.exe"
          cp "${exes[0]}" "$exe"
          [ "$(head -c 2 "$exe")" = MZ ] || { echo "::error::$exe is not a Windows program"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: unsigned-installer
        if: runner.os == 'Windows' && env.SIGNPATH == 'true'
        with:
          name: signpath-installer
          path: dist/*_windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 1

      - uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        if: runner.os == 'Windows' && env.SIGNPATH == 'true'
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'brain-in-a-box' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signpath/installer-signed

      - name: "Windows signing 3/3: the signed installer, and both signatures valid"
        if: runner.os == 'Windows' && env.SIGNPATH == 'true'
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter *_windows-x64-setup.exe
          Copy-Item (Join-Path signpath/installer-signed $exe.Name) $exe.FullName -Force
          foreach ($f in @($exe.FullName, "app/src-tauri/target/$env:TARGET/release/brain-in-a-box.exe")) {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne 'Valid') { throw "${f}: signature $($sig.Status)" }
            "{0}: {1}" -f $f, $sig.SignerCertificate.Subject
          }

      # true or false for this system, never a secret: what the release notes say of it.
      - name: Signed or not
        id: signed
        run: |
          case "$PLATFORM" in
            macos) echo "macos=$DEVELOPER_ID" ;;
            windows) echo "windows=$SIGNPATH" ;;
          esac >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          sha256() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi; }
          {
            echo "### $PLATFORM: $LABEL"
            echo
            echo '| File | Size | SHA-256 |'
            echo '|---|---|---|'
            for f in dist/*; do
              size=$(wc -c < "$f" | tr -d ' ')
              sum=$(sha256 "$f" | cut -d' ' -f1)
              echo "| \`$(basename "$f")\` | $((size / 1024)) KiB | \`$sum\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.plan.outputs.upload == 'true'
        with:
          name: app-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish the preview
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write # the attestation's signing certificate (Sigstore)
      attestations: write
    # One publication at a time: two runs never prune each other's release.
    concurrency:
      group: app-release-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: app-v${{ needs.plan.outputs.label }}
      VERSION: ${{ needs.plan.outputs.version }}
      LABEL: ${{ needs.plan.outputs.label }}
      MACOS_SIGNED: ${{ needs.build.outputs.macos_signed }}
      WINDOWS_SIGNED: ${{ needs.build.outputs.windows_signed }}
    steps:
      # No checkout: this job runs no code of the repository, only gh on the files built above.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: app-*
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sums=$(sha256sum -- *)
          printf '%s\n' "$sums" > SHA256SUMS
          cat SHA256SUMS

      # Signed proof, kept by GitHub outside the release, that each file was built by this
      # workflow from this commit of master: a file swapped in the release afterwards, with
      # its SHA256SUMS line, fails gh attestation verify.
      - name: Attest the installers
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      # In the app's words (tu). "Non signée" only for a system whose files are not signed.
      - name: Release notes
        run: |
          short=${GITHUB_SHA:0:7}
          dmg=$(cd dist && ls -- *.dmg)
          exe=$(cd dist && ls -- *-setup.exe 2>/dev/null) || exe=""
          unsigned=""
          [ "$MACOS_SIGNED" = true ] || unsigned="Mac"
          [ -z "$exe" ] || [ "$WINDOWS_SIGNED" = true ] || unsigned="${unsigned:+$unsigned et }Windows"
          printf '%s' "App Brain in a Box $VERSION — préversion ${LABEL##*.}${unsigned:+ (non signée sur $unsigned)}" > "$RUNNER_TEMP/title"
          {
            echo "Préversion de l'app Brain in a Box, construite automatiquement depuis \`master\` (commit [$short]($GITHUB_SERVER_URL/$GH_REPO/commit/$GITHUB_SHA)). Elle peut changer ou disparaître : seules les 5 dernières préversions sont gardées."
            if [ -n "$unsigned" ]; then
              echo
              echo "Pas encore signée sur $unsigned : la première fois, ton ordinateur te met en garde. C'est prévu, voici quoi faire."
            fi
            echo
            echo "**Mac** (macOS 13 ou plus récent, puces Apple et Intel)"
            echo
            echo "1. Télécharge \`$dmg\`, ouvre-le et glisse **Brain in a Box** dans **Applications**."
            if [ "$MACOS_SIGNED" = true ]; then
              echo "2. Ouvre Brain in a Box depuis Applications."
            else
              echo "2. Ouvre l'app. macOS l'arrête, car elle n'est pas encore signée par Apple : clique sur **Terminé** (Done ; **Annuler** sur macOS 13 et 14), surtout pas sur « Placer dans la corbeille »."
              echo "3. Va dans **Réglages Système › Confidentialité et sécurité** (System Settings › Privacy & Security), descends jusqu'à « Sécurité » et clique sur **Ouvrir quand même** (Open Anyway) à côté de Brain in a Box, puis confirme. Les fois suivantes, elle s'ouvre normalement."
            fi
            if [ -n "$exe" ]; then
              echo
              echo "**Windows** (10 ou 11, 64 bits)"
              echo
              echo "1. Télécharge \`$exe\` et ouvre-le."
              echo "2. Si Windows affiche « Windows a protégé votre ordinateur » (Windows protected your PC), clique sur **Informations complémentaires** (More info), puis **Exécuter quand même** (Run anyway)."
            fi
            if image=$(cd dist && ls -- *.AppImage 2>/dev/null) && deb=$(cd dist && ls -- *.deb 2>/dev/null); then
              echo
              echo "**Linux** (Ubuntu 22.04 ou plus récent, Debian 12, processeur Intel ou AMD 64 bits)"
              echo
              echo "- **AppImage**, sans installation : télécharge \`$image\`, rends-la exécutable (clic droit > Propriétés > « Exécutable comme un programme », ou \`chmod +x\`), puis double-clique dessus. Rien d'autre à installer sur Ubuntu 22.04 ou 24.04 ; ailleurs, si elle ne démarre pas : \`sudo apt install fuse3\`."
              echo "- **.deb** : \`sudo apt install ./$deb\`, puis ouvre Brain in a Box depuis le menu des applications."
              echo
              echo "Pendant l'installation, l'app demande ton mot de passe (fenêtre du système) pour installer git, curl ou Obsidian s'ils manquent."
            fi
            echo
            echo "Vérifier un téléchargement : \`shasum -a 256 <fichier>\` (Mac), \`certutil -hashfile <fichier> SHA256\` (Windows) ou \`sha256sum <fichier>\` (Linux) doit donner la ligne du fichier dans \`SHA256SUMS\`. Vérifier qu'il a bien été construit ici, depuis \`master\` : \`gh attestation verify <fichier> -R $GH_REPO --signer-workflow $GH_REPO/.github/workflows/release.yml --source-ref refs/heads/master\`."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/title"; echo; echo; cat "$RUNNER_TEMP/notes.md"

      - name: Publish the pre-release (a tag is never moved)
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "::error::tag $TAG already exists: a preview tag is never moved or reused"
            exit 1
          fi
          # A draft left by an attempt that failed half-way is replaced.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$(cat "$RUNNER_TEMP/title")" \
            --notes-file "$RUNNER_TEMP/notes.md"
          echo "Published: $GITHUB_SERVER_URL/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      # The site's buttons: releases/download/app-latest/Brain-in-a-Box_<system>, the files just
      # published under names without their version. Every new file goes up first under a temporary
      # name; then each takes the place of the old one: the links mix two previews, or answer 404,
      # only for the seconds of the renames (each tried again). Then the step checks what the site
      # downloads: each link answers, and the SHA256SUMS it serves is this preview's. A pre-release,
      # so that it is never GitHub's "Latest" (the kit's releases are).
      - name: The stable links (app-latest)
        run: |
          mkdir latest next
          for f in dist/Brain-in-a-Box_"$LABEL"_*; do
            cp "$f" "latest/Brain-in-a-Box_${f#dist/Brain-in-a-Box_"$LABEL"_}"
          done
          (cd latest && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          base="$GITHUB_SERVER_URL/$GH_REPO/releases/download/app-latest"
          notes="Les fichiers de la dernière préversion, [$TAG]($GITHUB_SERVER_URL/$GH_REPO/releases/tag/$TAG), sous des noms sans numéro de version : le site y renvoie. Mêmes fichiers, même empreinte SHA-256, même attestation : voir les instructions de $TAG."
          title="App Brain in a Box : dernière préversion (${LABEL##*.})"
          if gh release view app-latest --json tagName >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/app-latest" -f sha="$GITHUB_SHA" -F force=true --silent
            gh release edit app-latest --prerelease --title "$title" --notes "$notes"
            id=$(gh api "repos/$GH_REPO/releases/tags/app-latest" --jq .id)
            asset() { gh api "repos/$GH_REPO/releases/$id/assets" --paginate --jq ".[] | select(.name == \"$1\") | .id"; }
            for f in latest/*; do
              cp "$f" "next/next-${f#latest/}"
            done
            gh release upload app-latest next/* --clobber
            for f in latest/*; do
              name=${f#latest/}
              new=$(asset "next-$name")
              [ -n "$new" ] || { echo "::error::next-$name did not go up"; exit 1; }
              old=$(asset "$name")
              [ -z "$old" ] || gh api -X DELETE "repos/$GH_REPO/releases/assets/$old" --silent
              for try in 1 2 3; do
                gh api -X PATCH "repos/$GH_REPO/releases/assets/$new" -f name="$name" --silent && break
                [ "$try" != 3 ] || { echo "::error::$name: the new file could not take its name"; exit 1; }
                sleep 10
              done
            done
          else
            gh release create app-latest latest/* --target "$GITHUB_SHA" --prerelease --title "$title" --notes "$notes"
          fi
          for f in latest/*; do
            curl -fsS --retry 5 --retry-all-errors --retry-delay 10 -o /dev/null -I "$base/${f#latest/}" \
              || { echo "::error::$base/${f#latest/} does not answer"; exit 1; }
          done
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 "$base/SHA256SUMS" | cmp - latest/SHA256SUMS \
            || { echo "::error::app-latest does not serve this preview's SHA256SUMS"; exit 1; }
          echo "Stable links: $GITHUB_SERVER_URL/$GH_REPO/releases/tag/app-latest" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the 5 newest app previews
        run: |
          gh release list --limit 200 --json tagName,createdAt,isPrerelease,isDraft \
            --jq '[.[] | select(.isPrerelease and (.isDraft | not) and (.tagName | test("^app-v[0-9]+\\.[0-9]+\\.[0-9]+-preview\\.[0-9]+$")))]
                  | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while IFS= read -r old; do
            echo "deleting $old"
            gh release delete "$old" --cleanup-tag --yes
          done
