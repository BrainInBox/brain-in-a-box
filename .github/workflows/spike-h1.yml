# Jetable (preuve H1 de la spec guide v2) : jamais sur master.
name: spike-h1
on:
  push:
    branches: [spike/guide-v2-hermes]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write   # le pouls des jobs Windows (le premier passage a perdu ses runners sans journal)

env:
  # Hermes v0.22.5 (tag du 23/10/2026), et les empreintes de ses installateurs à ce commit.
  H1_HERMES_COMMIT: bf0203a794a07aac3ff764972ab9087baa4e4f4e
  H1_INSTALL_PS1_SHA256: 8d491a8b9b19934bb8d027b11962c394551798e969d244b68d4ab95295b970e2
  H1_INSTALL_SH_SHA256: 99cb3691d55019c6973a7acb775a915648666cc24e483ca827a1cdbb3531a674

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            defender: static
            uninstall: bounded
            mutations: true
          - os: windows-2025
            defender: armed
            uninstall: full
            mutations: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 170
    env:
      H1_OS: ${{ matrix.os }}
      H1_DEFENDER: ${{ matrix.defender }}
      H1_UNINSTALL: ${{ matrix.uninstall }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check tiktoken==0.8.0 pyyaml==6.0.2
      - name: parse
        run: |
          foreach ($f in Get-ChildItem spike\h1\*.ps1) {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$e)
            if ($e) { $e | ForEach-Object { Write-Host "$($f.Name): $_ ($($_.Extent.StartLineNumber))" }; exit 1 }
          }
      - name: pouls
        env:
          HB_TOKEN: ${{ github.token }}
        run: Start-Process powershell.exe -WindowStyle Hidden -ArgumentList @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "$pwd\spike\h1\heartbeat.ps1")
      - name: setup
        timeout-minutes: 15
        run: .\spike\h1\h1_windows.ps1 -Phase setup
      - name: install
        timeout-minutes: 55
        run: .\spike\h1\h1_windows.ps1 -Phase install
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: "h1-${{ matrix.os }}", path: "${{ runner.temp }}/h1out", retention-days: 14, overwrite: true }
      - name: defender
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: .\spike\h1\h1_windows.ps1 -Phase defender
      - name: pathfix
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: .\spike\h1\h1_windows.ps1 -Phase pathfix
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: "h1-${{ matrix.os }}", path: "${{ runner.temp }}/h1out", retention-days: 14, overwrite: true }
      - name: probe
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: .\spike\h1\h1_windows.ps1 -Phase probe
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: "h1-${{ matrix.os }}", path: "${{ runner.temp }}/h1out", retention-days: 14, overwrite: true }
      - name: mutations
        if: ${{ !cancelled() && matrix.mutations }}
        timeout-minutes: 50
        run: .\spike\h1\h1_windows.ps1 -Phase mutations
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && matrix.mutations }}
        with: { name: "h1-${{ matrix.os }}", path: "${{ runner.temp }}/h1out", retention-days: 14, overwrite: true }
      - name: uninstall
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: .\spike\h1\h1_windows.ps1 -Phase uninstall
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: "h1-${{ matrix.os }}", path: "${{ runner.temp }}/h1out", retention-days: 14, overwrite: true }

  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --disable-pip-version-check tiktoken==0.8.0 pyyaml==6.0.2
      - name: H1
        run: bash spike/h1/h1_macos.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h1-macos
          path: ${{ runner.temp }}/h1out
          retention-days: 14
