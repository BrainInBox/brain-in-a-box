# Jetable (preuve H1 de la spec guide v2) : jamais sur master.
name: spike-h1
on:
  push:
    branches: [spike/guide-v2-hermes]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Hermes v0.22.5 (tag du 23/10/2026), et les empreintes de ses installateurs à ce commit.
  H1_HERMES_COMMIT: bf0203a794a07aac3ff764972ab9087baa4e4f4e
  H1_INSTALL_PS1_SHA256: 8d491a8b9b19934bb8d027b11962c394551798e969d244b68d4ab95295b970e2
  H1_INSTALL_SH_SHA256: 99cb3691d55019c6973a7acb775a915648666cc24e483ca827a1cdbb3531a674

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check tiktoken==0.8.0
      - name: H1
        shell: powershell
        run: |
          if ("${{ matrix.os }}" -eq "windows-2025") { & .\spike\h1\h1_windows.ps1 -Mutations } else { & .\spike\h1\h1_windows.ps1 }
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h1-${{ matrix.os }}
          path: ${{ runner.temp }}/h1out
          retention-days: 14

  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --disable-pip-version-check tiktoken==0.8.0
      - name: H1
        run: bash spike/h1/h1_macos.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h1-macos
          path: ${{ runner.temp }}/h1out
          retention-days: 14
