name: spike-winget

# Spike only, never merged (kept in refs/keep/spike-winget-secours): install.ps1's way around a broken
# winget, measured where test.yml cannot: under Windows PowerShell 5.1, as a standard user, on ARM64.
on:
  push:
    branches: [spike/winget-secours]

permissions:
  contents: read

jobs:
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: install.ps1 parses in Windows PowerShell 5.1 and PowerShell 7
        if: runner.os == 'Windows'
        run: |
          foreach ($exe in 'powershell', 'pwsh') {
            & $exe -NoProfile -Command '$e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1).Path, [ref]$null, [ref]$e); if ($e) { $e | ForEach-Object { Write-Host $_.Extent.StartLineNumber $_.Message }; exit 1 }'
            if ($LASTEXITCODE) { exit 1 }
          }

      - name: The stand-ins harness under pwsh
        run: |
          pwsh -NoProfile -File .github/ci/install-ps1-secours.ps1
          if ($LASTEXITCODE) { throw "exit $LASTEXITCODE" }

      - name: The stand-ins harness under Windows PowerShell 5.1
        if: runner.os == 'Windows'
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .github/ci/install-ps1-secours.ps1
          if ($LASTEXITCODE) { throw "exit $LASTEXITCODE" }

  windows-winget-casse:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fresh install, no Git, no Python, winget's source broken, no console
        timeout-minutes: 30
        run: |
          . .github/ci/poste-neuf.ps1
          & .github/ci/sans-git.ps1 -Preuve "$env:RUNNER_TEMP\sans-git.json"
          . .github/ci/winget-casse.ps1
          $null | powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File install.ps1 *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\install.txt"
          if ($LASTEXITCODE) { throw "install.ps1 exited $LASTEXITCODE" }

      - name: Python and Git from their official installers, Git's history and Bash there, the log says which way
        if: ${{ !cancelled() }}
        run: |
          $H = $env:USERPROFILE
          $out = Get-Content "$env:RUNNER_TEMP\install.txt" -Raw
          $log = Get-Content "$H\.brain-in-a-box\install.log" -Raw
          $log
          # winget: Python's install, its source updated once, one more try; Git and Obsidian not asked again.
          $calls = @(Get-Content "$env:RUNNER_TEMP\winget-casse\appels.txt")
          $py = 'install -e --id Python.Python.3.12 --source winget --silent --accept-package-agreements --accept-source-agreements --scope user'
          if (($calls -join '|') -cne "$py|source update --name winget|$py") { throw "winget was asked: $($calls -join ' | ')" }
          # Python 3.14.8 for this user, the hooks on it.
          $hook = (@((Get-Content "$H\.claude\settings.json" -Raw | ConvertFrom-Json).hooks.UserPromptSubmit.hooks)[0]).command
          if ($hook -ne "$env:LOCALAPPDATA\Programs\Python\Python314\python.exe") { throw "the hooks run $hook" }
          $v = & $hook -c "import sys; print(sys.version.split()[0])"
          if ($v -ne '3.14.8') { throw "Python $v" }
          # Git 2.56.0.2, put there after the runner's was taken away; a new process finds it.
          $proof = Get-Content "$env:RUNNER_TEMP\sans-git.json" -Raw | ConvertFrom-Json
          $git = @("$env:ProgramFiles\Git\cmd\git.exe", "$env:LOCALAPPDATA\Programs\Git\cmd\git.exe") | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $git) { throw 'no git.exe where Find-Git looks' }
          if ((Get-Item -LiteralPath (Split-Path -Parent $git)).CreationTimeUtc -lt [DateTimeOffset]::FromUnixTimeSeconds($proof.fin_epoch).UtcDateTime) { throw "$git was there before" }
          $gv = & $git --version
          if ($gv -ne 'git version 2.56.0.windows.2') { throw "git: $gv" }
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not (Get-Command git -CommandType Application -ErrorAction SilentlyContinue)) { throw 'a new process does not find git' }
          # What its absence cost on 2026-10-22: the vault's history, Git Bash for Claude Code, gbrain.
          $root = @(& $git -C "$H\Documents\Brain" rev-list --max-parents=0 HEAD)
          if ($root.Count -ne 1 -or (& $git -C "$H\Documents\Brain" log -1 --format=%s $root[0]) -ne 'brain init') { throw 'the vault has no history' }
          if (-not (Test-Path -LiteralPath (Join-Path (Split-Path -Parent (Split-Path -Parent $git)) 'bin\bash.exe'))) { throw 'no Git Bash next to git' }
          if ((Get-Content "$H\.brain-search\engine").Trim() -ne 'gbrain') { throw "the memory is $(Get-Content "$H\.brain-search\engine"), not gbrain" }
          # The log and the screen say which way worked; nothing of the installers left behind.
          foreach ($l in "> installeur officiel : Python 3.14.8 (x64) https://www.python.org/ftp/python/3.14.8/python-3.14.8-amd64.exe`r`ninstalleur officiel : code 0",
                         "> Python : $hook (installeur officiel)",
                         "> winget : sa source est en panne, Git non installe par winget",
                         "> installeur officiel : Git 2.56.0.2 (x64) https://github.com/git-for-windows/git/releases/download/v2.56.0.windows.2/Git-2.56.0.2-64-bit.exe`r`ninstalleur officiel : code 0",
                         "> winget : sa source est en panne, Obsidian non installe par winget") {
            if (-not $log.Contains($l)) { throw "install.log does not say: $l" }
          }
          if ($log -notmatch '(?m)^> Git : .+\\git\.exe \(installeur officiel\)\r?$') { throw 'install.log does not say Git came from its official installer' }
          foreach ($l in "winget : sa source ne s'ouvre pas, je la mets a jour", 'Python 3.14.8 : installeur officiel', 'Git 2.56.0.2 : installeur officiel',
                         '[OK] git (', '[!]  Obsidian non installe (optionnel') {
            if (-not $out.Contains($l)) { throw "the install did not say: $l" }
          }
          if ($out.Contains('Git absent')) { throw 'the install said Git absent' }
          if (Get-ChildItem -LiteralPath "$H\.brain-in-a-box" -Directory -Filter 'installeur-*') { throw 'an installer folder was left behind' }

      - name: "install.ps1 when winget cannot: its functions against stand-ins (pwsh)"
        if: ${{ !cancelled() }}
        run: |
          pwsh -NoProfile -File .github/ci/install-ps1-secours.ps1
          if ($LASTEXITCODE) { throw "install-ps1-secours.ps1 exited $LASTEXITCODE" }

  standard-user:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: The official installers as a standard user (not an administrator)
        run: |
          $chars = [char[]]'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $pw = (-join (1..20 | ForEach-Object { $chars[[Security.Cryptography.RandomNumberGenerator]::GetInt32($chars.Length)] })) + 'aA1!'
          net user biabstd $pw /add | Out-Null
          if ($LASTEXITCODE) { throw 'net user failed' }
          $work = 'C:\biab-spike'
          New-Item -ItemType Directory $work -Force | Out-Null
          Copy-Item install.ps1, .github/ci/spike-run.ps1 $work
          icacls $work /grant 'biabstd:(OI)(CI)F' | Out-Null
          $cred = New-Object Management.Automation.PSCredential('biabstd', (ConvertTo-SecureString $pw -AsPlainText -Force))
          $p = Start-Process powershell.exe -Credential $cred -LoadUserProfile -Wait -PassThru -WorkingDirectory $work `
            -ArgumentList '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', "$work\spike-run.ps1", '-Out', "$work\out.json"
          "exit $($p.ExitCode)"
          Get-Content "$work\out.json" -Raw

  arm64:
    runs-on: windows-11-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: The runner's Git away, then the official installers (ARM64)
        run: |
          try { & .github/ci/sans-git.ps1 -Preuve "$env:RUNNER_TEMP\sans-git.json" } catch { "sans-git: $($_.Exception.Message)" }
          powershell -NoProfile -ExecutionPolicy Bypass -File .github/ci/spike-run.ps1 -Out "$env:RUNNER_TEMP\out.json"
          Get-Content "$env:RUNNER_TEMP\out.json" -Raw
