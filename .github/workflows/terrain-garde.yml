name: terrain-garde

# The repair agent (docs/terrain-agent.md) merges its pull requests only when every check is
# green. This check is red when one of them touches what the agent never merges alone
# (.github/CODEOWNERS) or deletes or changes a line of a test: the maintainer reviews those.
# pull_request_target: master's copy of this file, of the script and of CODEOWNERS judges the
# pull request, which cannot rewrite them; its code is never checked out or run here.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  garde:
    name: terrain-garde
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: The agent's pull request stays out of what the maintainer reviews
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: bash .github/ci/terrain-garde.sh
