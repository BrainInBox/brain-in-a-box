name: terrain

# The kit as a user gets it, every night, on GitHub VMs nobody keeps (macOS, Windows and Linux):
# a fresh install with its real nightly, an upgrade (Windows from v0.2.0, macOS from #27; Linux, where no
# earlier version ran, a reinstallation over an install its user changed), seven nights of the night
# check in time travel, the real Claude on a synthetic corpus (engine/tests/terrain.py), and the desktop app
# downloaded, installed and clicked through in its real window on all three systems, a capture of every
# screen (terrain_app.py).
# Each job leaves a table in its summary and a JSON artifact; the scheduled run keeps one
# issue labelled "terrain" up to date, read by the repair agent (docs/terrain-agent.md).
#
# The repository is public. No event a stranger triggers starts this workflow (no
# pull_request, no issue_comment), and a run started by hand tests a commit of this
# repository's branches only, never a fork's (job ref). The Claude token goes to one step of
# a job of its own, on a VM where nothing else of the kit ran, and only when master's
# workflow tests master. It lives in the environment "terrain-claude" (Settings >
# Environments: deployment branches = master only, secret CLAUDE_CODE_OAUTH_TOKEN there,
# not as a repository secret): a workflow changed on a branch never gets it. The issue gets
# fixed identifiers only, never a reason, a note or a log.

on:
  schedule:
    # 01:17 UTC: far from 04:00 runner time, when the BrainNightly an install registers would run.
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit of this repository to test (default: the branch the run is started on)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# One queue per event and ref: a run waiting for another is never cancelled by a third.
concurrency:
  group: terrain-${{ github.event_name }}-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

env:
  TERRAIN_REF: ${{ inputs.ref || github.ref_name }}

jobs:
  ref:
    name: The commit to test (on a branch of this repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # The workflow's own commit, every branch and tag: the guard is never the tested ref's code.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: sha
        run: bash .github/ci/terrain-ref.sh "$TERRAIN_REF"

  macos:
    name: macOS (${{ matrix.parcours }})
    needs: ref
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        parcours: [neuf, montee]
    env:
      PARCOURS: ${{ matrix.parcours }}
      TERRAIN_SHA: ${{ needs.ref.outputs.sha }}
    steps:
      - name: Where the results go
        run: echo "TERRAIN_JSON=$RUNNER_TEMP/terrain-macos-$PARCOURS.json" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ref.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # --- fresh install: Claude Code first, as the README asks, then clone + install.sh
      - name: Claude Code (Anthropic's official installer)
        if: matrix.parcours == 'neuf'
        continue-on-error: true
        timeout-minutes: 10
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Fresh install (clone, ./install.sh with no terminal and no Voyage key)
        id: installeur
        if: matrix.parcours == 'neuf'
        timeout-minutes: 30
        run: |
          git clone --quiet "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$HOME/brain-in-a-box"
          cd "$HOME/brain-in-a-box" || exit 1
          [ "$(git rev-parse HEAD)" = "$TERRAIN_SHA" ] || git -c advice.detachedHead=false checkout -q "$TERRAIN_SHA"
          ./install.sh </dev/null

      - name: Installer outcome, in the results
        if: ${{ !cancelled() && matrix.parcours == 'neuf' }}
        env:
          OUTCOME: ${{ steps.installeur.outcome }}
        run: python3 -I engine/tests/terrain.py etape installeur --resultat "$OUTCOME" --parcours "$PARCOURS" --vm --json "$TERRAIN_JSON"

      - name: "Scenario: the install did what it says, its nightly included"
        if: ${{ !cancelled() && matrix.parcours == 'neuf' }}
        timeout-minutes: 45
        run: python3 -I engine/tests/terrain.py installation --parcours "$PARCOURS" --vm --json "$TERRAIN_JSON"

      # --- upgrade: the previous version first, then the tested version over it
      # macOS starts from #27 (ca8382a), not v0.2.0: v0.2.0's installer inits gbrain with ZeroEntropy,
      # which gbrain retired on 2026-09-24 (v0.56.2.0), so no Mac installs v0.2.0 any more
      # (docs/terrain-bugs.md). #27 is the first version a Mac still installs.
      - name: "Previous version install, as it was (macOS: #27, gbrain at the tested pin)"
        id: v020
        if: matrix.parcours == 'montee'
        timeout-minutes: 30
        run: |
          git clone --quiet "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$HOME/brain-in-a-box"
          cd "$HOME/brain-in-a-box" || exit 1
          git -c advice.detachedHead=false checkout -q ca8382a
          # The old installer cloned gbrain's master of its week: the release the tested version pins stands for it.
          pin=$(python3 -I -c 'import json, re, sys; s = json.load(open(sys.argv[1]))["sha"]; assert re.fullmatch("[0-9a-f]{40}", s); print(s)' "$GITHUB_WORKSPACE/engine/gbrain-pin.json")
          mkdir -p "$HOME/DEV/gbrain"
          git -C "$HOME/DEV/gbrain" init -q
          git -C "$HOME/DEV/gbrain" fetch -q --depth 1 https://github.com/garrytan/gbrain.git "$pin"
          git -C "$HOME/DEV/gbrain" -c advice.detachedHead=false checkout -q FETCH_HEAD
          # A user's terminal has Bun on its PATH by then (gbrain is a `#!/usr/bin/env bun` script).
          export PATH="$HOME/.bun/bin:$PATH"
          ./install.sh < /dev/null

      - name: v0.2.0 installer outcome, in the results
        if: ${{ !cancelled() && matrix.parcours == 'montee' }}
        env:
          OUTCOME: ${{ steps.v020.outcome }}
        run: python3 -I engine/tests/terrain.py etape installeur-v0.2.0 --resultat "$OUTCOME" --parcours "$PARCOURS" --vm --json "$TERRAIN_JSON"

      - name: "Scenario: what a user changed on v0.2.0"
        if: ${{ !cancelled() && matrix.parcours == 'montee' }}
        timeout-minutes: 10
        run: python3 -I engine/tests/terrain.py montee-avant --parcours "$PARCOURS" --vm --json "$TERRAIN_JSON"

      - name: Upgrade (the tested version, ./install.sh again)
        id: upgrade
        if: ${{ !cancelled() && matrix.parcours == 'montee' }}
        timeout-minutes: 30
        run: |
          cd "$HOME/brain-in-a-box" || exit 1
          git -c advice.detachedHead=false checkout -q "$TERRAIN_SHA"
          ./install.sh </dev/null

      - name: Upgrade outcome, in the results
        if: ${{ !cancelled() && matrix.parcours == 'montee' }}
        env:
          OUTCOME: ${{ steps.upgrade.outcome }}
        run: python3 -I engine/tests/terrain.py etape installeur-montee --resultat "$OUTCOME" --parcours "$PARCOURS" --vm --json "$TERRAIN_JSON"

      - name: "Scenario: nothing of the user lost, all the new there"
        if: ${{ !cancelled() && matrix.parcours == 'montee' }}
        timeout-minutes: 20
        run: python3 -I engine/tests/terrain.py montee --parcours "$PARCOURS" --vm --json "$TERRAIN_JSON"

      # --- from here on, the real nightly of this machine stays out of the way
      - name: The launchd jobs are unloaded for the rest of the job
        if: ${{ !cancelled() }}
        run: |
          for job in gbrain-nightly brain-reflection gbrain-lint; do
            launchctl bootout "gui/$(id -u)/com.$(id -un).$job" 2>/dev/null || true
          done

      - name: "Scenario: seven nights of the night check, then J+20"
        if: ${{ !cancelled() && matrix.parcours == 'neuf' }}
        timeout-minutes: 20
        run: python3 -I engine/tests/terrain.py nuits --parcours "$PARCOURS" --vm --json "$TERRAIN_JSON"

      - name: Summary
        if: always()
        run: python3 -I engine/tests/terrain.py rapport "$TERRAIN_JSON" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-macos-${{ matrix.parcours }}
          path: ${{ env.TERRAIN_JSON }}
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows (${{ matrix.parcours }})
    needs: ref
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        parcours: [neuf, montee]
    env:
      PARCOURS: ${{ matrix.parcours }}
      TERRAIN_SHA: ${{ needs.ref.outputs.sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Where the results go
        run: |
          "TERRAIN_JSON=$env:RUNNER_TEMP\terrain-windows-$env:PARCOURS.json" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ref.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # --- fresh install: the one-liner a user pastes (the scheduled night: from GitHub itself),
      # on a PC as users have it: no Python but the Store stub, so Python comes from winget.
      - name: Fresh install (irm | iex), no Python but the Store stub
        id: installeur
        if: matrix.parcours == 'neuf'
        timeout-minutes: 45
        run: |
          . .github/ci/poste-neuf.ps1
          pwsh -NoProfile -ExecutionPolicy Bypass -File .github/ci/terrain-install.ps1

      # The task registers at 04:00 runner time and catches up a missed night: disabled
      # right away, the installation scenario enables it for the one run it starts itself.
      - name: The real nightly stays out of the way (tasks disabled)
        if: ${{ !cancelled() && matrix.parcours == 'neuf' }}
        run: Get-ScheduledTask -TaskName 'Brain*' -ErrorAction SilentlyContinue | Disable-ScheduledTask | Out-Null

      # Each step re-reads the Machine PATH, which poste-neuf.ps1 emptied of the runner's Python:
      # the harness gets it back through GITHUB_PATH (the kit itself runs on winget's Python).
      - name: Python for the harness (the runner's, not the one the install set up)
        if: ${{ !cancelled() && matrix.parcours == 'neuf' }}
        run: |
          $tc = Get-ChildItem "$env:RUNNER_TOOL_CACHE\Python\*\x64\python.exe" -ErrorAction SilentlyContinue |
            Sort-Object { [version]($_.Directory.Parent.Name -replace '[^0-9.].*$', '') } | Select-Object -Last 1
          if (-not $tc) { throw 'no Python in the runner tool cache for the harness' }
          Split-Path $tc.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "harness Python: $($tc.FullName)"

      - name: Installer outcome, in the results
        if: ${{ !cancelled() && matrix.parcours == 'neuf' }}
        env:
          OUTCOME: ${{ steps.installeur.outcome }}
        run: python -I engine/tests/terrain.py etape installeur --resultat $env:OUTCOME --parcours $env:PARCOURS --vm --json $env:TERRAIN_JSON

      - name: "Scenario: the install did what it says, its nightly included"
        if: ${{ !cancelled() && matrix.parcours == 'neuf' }}
        timeout-minutes: 45
        run: python -I engine/tests/terrain.py installation --parcours $env:PARCOURS --vm --json $env:TERRAIN_JSON

      # --- upgrade: v0.2.0 (from a clone, as it was installed), then the one-liner over it
      - name: v0.2.0 install, as it was
        id: v020
        if: matrix.parcours == 'montee'
        timeout-minutes: 30
        run: |
          $old = Join-Path $env:RUNNER_TEMP 'v020'
          git archive --format=zip --prefix=brain-in-a-box-0.2.0/ -o "$old.zip" v0.2.0
          if ($LASTEXITCODE) { exit 1 }
          Expand-Archive "$old.zip" $old
          powershell -NoProfile -ExecutionPolicy Bypass -File "$old\brain-in-a-box-0.2.0\install.ps1"
          if ($LASTEXITCODE) { exit 1 }

      - name: The real nightly stays out of the way (v0.2.0 tasks disabled)
        if: ${{ !cancelled() && matrix.parcours == 'montee' }}
        run: Get-ScheduledTask -TaskName 'Brain*' -ErrorAction SilentlyContinue | Disable-ScheduledTask | Out-Null

      - name: v0.2.0 installer outcome, in the results
        if: ${{ !cancelled() && matrix.parcours == 'montee' }}
        env:
          OUTCOME: ${{ steps.v020.outcome }}
        run: python -I engine/tests/terrain.py etape installeur-v0.2.0 --resultat $env:OUTCOME --parcours $env:PARCOURS --vm --json $env:TERRAIN_JSON

      - name: "Scenario: what a user changed on v0.2.0"
        if: ${{ !cancelled() && matrix.parcours == 'montee' }}
        timeout-minutes: 10
        run: python -I engine/tests/terrain.py montee-avant --parcours $env:PARCOURS --vm --json $env:TERRAIN_JSON

      - name: Upgrade (irm | iex over v0.2.0)
        id: upgrade
        if: ${{ !cancelled() && matrix.parcours == 'montee' }}
        timeout-minutes: 45
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .github/ci/terrain-install.ps1

      - name: The real nightly stays out of the way (new tasks disabled)
        if: ${{ !cancelled() && matrix.parcours == 'montee' }}
        run: Get-ScheduledTask -TaskName 'Brain*' -ErrorAction SilentlyContinue | Disable-ScheduledTask | Out-Null

      - name: Upgrade outcome, in the results
        if: ${{ !cancelled() && matrix.parcours == 'montee' }}
        env:
          OUTCOME: ${{ steps.upgrade.outcome }}
        run: python -I engine/tests/terrain.py etape installeur-montee --resultat $env:OUTCOME --parcours $env:PARCOURS --vm --json $env:TERRAIN_JSON

      - name: "Scenario: nothing of the user lost, all the new there"
        if: ${{ !cancelled() && matrix.parcours == 'montee' }}
        timeout-minutes: 20
        run: python -I engine/tests/terrain.py montee --parcours $env:PARCOURS --vm --json $env:TERRAIN_JSON

      - name: "Scenario: seven nights of the night check, then J+20"
        if: ${{ !cancelled() && matrix.parcours == 'neuf' }}
        timeout-minutes: 20
        run: python -I engine/tests/terrain.py nuits --parcours $env:PARCOURS --vm --json $env:TERRAIN_JSON

      - name: Summary
        if: always()
        run: python -I engine/tests/terrain.py rapport $env:TERRAIN_JSON | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-windows-${{ matrix.parcours }}
          path: ${{ env.TERRAIN_JSON }}
          if-no-files-found: warn
          retention-days: 14

  # Linux (ubuntu-latest: Ubuntu 24.04). neuf: clone, then ./install.sh in a real terminal
  # (.github/ci/terminal.py), its questions answered as a user would: no Voyage key, lingering yes
  # (through sudo, as the runner has no desktop session), Obsidian yes (its official .deb, checked
  # against the pinned SHA-256); then the nightly started by systemd --user, and seven nights.
  # reinstallation: no earlier version of the kit installs on Linux, so the tested version is
  # installed without a terminal (no session, no question: cron, as in a container or a WSL
  # without systemd), changed by its user, then installed again over it.
  linux:
    name: Linux (${{ matrix.parcours }})
    needs: ref
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        parcours: [neuf, reinstallation]
    env:
      PARCOURS: ${{ matrix.parcours }}
      TERRAIN_SHA: ${{ needs.ref.outputs.sha }}
    steps:
      - name: Where the results go
        run: echo "TERRAIN_JSON=$RUNNER_TEMP/terrain-linux-$PARCOURS.json" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ref.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # As on a server a script reaches: no session for the user's systemd (a runner may keep one
      # lingering), and cron, which every Ubuntu has.
      - name: No session for the user's systemd, cron there
        run: |
          if [ -e "/var/lib/systemd/linger/$USER" ]; then sudo loginctl disable-linger "$USER"; fi
          if XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user show-environment >/dev/null 2>&1; then
            sudo systemctl stop "user@$(id -u).service"
          fi
          if XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user show-environment >/dev/null 2>&1; then
            echo "::error::the user's systemd still answers"; exit 1
          fi
          command -v crontab >/dev/null || sudo apt-get install -y cron

      # --- fresh install, in a terminal: a question nobody expected stops it, an expected one never asked fails it
      - name: Fresh install (clone, ./install.sh in a terminal; no Voyage key, lingering yes, Obsidian yes)
        id: installeur
        if: matrix.parcours == 'neuf'
        timeout-minutes: 40
        run: |
          git clone --quiet "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$HOME/brain-in-a-box"
          cd "$HOME/brain-in-a-box" || exit 1
          [ "$(git rev-parse HEAD)" = "$TERRAIN_SHA" ] || git -c advice.detachedHead=false checkout -q "$TERRAIN_SHA"
          python3 -I "$GITHUB_WORKSPACE/.github/ci/terminal.py" --answer 'Voyage key:=' --answer 'logged out=y' \
            --answer 'Obsidian=y' -- ./install.sh

      - name: Installer outcome, in the results
        if: ${{ !cancelled() && matrix.parcours == 'neuf' }}
        env:
          OUTCOME: ${{ steps.installeur.outcome }}
        run: python3 -I engine/tests/terrain.py etape installeur --resultat "$OUTCOME" --parcours "$PARCOURS" --vm --json "$TERRAIN_JSON"

      - name: "Scenario: the install did what it says, its nightly included (started by systemd --user)"
        if: ${{ !cancelled() && matrix.parcours == 'neuf' }}
        timeout-minutes: 45
        run: python3 -I engine/tests/terrain.py installation --parcours "$PARCOURS" --vm --json "$TERRAIN_JSON"

      # --- reinstallation: the tested version, changed by its user, installed again
      - name: First install (the tested version, ./install.sh with no terminal)
        id: premier
        if: matrix.parcours == 'reinstallation'
        timeout-minutes: 30
        run: |
          git clone --quiet "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$HOME/brain-in-a-box"
          cd "$HOME/brain-in-a-box" || exit 1
          [ "$(git rev-parse HEAD)" = "$TERRAIN_SHA" ] || git -c advice.detachedHead=false checkout -q "$TERRAIN_SHA"
          ./install.sh </dev/null

      - name: First installer outcome, in the results
        if: ${{ !cancelled() && matrix.parcours == 'reinstallation' }}
        env:
          OUTCOME: ${{ steps.premier.outcome }}
        run: python3 -I engine/tests/terrain.py etape installeur --resultat "$OUTCOME" --parcours "$PARCOURS" --vm --json "$TERRAIN_JSON"

      - name: "Scenario: what a user changed on it"
        if: ${{ !cancelled() && matrix.parcours == 'reinstallation' }}
        timeout-minutes: 10
        run: python3 -I engine/tests/terrain.py montee-avant --parcours "$PARCOURS" --vm --json "$TERRAIN_JSON"

      - name: Reinstall over it (./install.sh again, no terminal)
        id: upgrade
        if: ${{ !cancelled() && matrix.parcours == 'reinstallation' }}
        timeout-minutes: 30
        run: |
          cd "$HOME/brain-in-a-box" || exit 1
          ./install.sh </dev/null

      - name: Reinstall outcome, in the results
        if: ${{ !cancelled() && matrix.parcours == 'reinstallation' }}
        env:
          OUTCOME: ${{ steps.upgrade.outcome }}
        run: python3 -I engine/tests/terrain.py etape installeur-montee --resultat "$OUTCOME" --parcours "$PARCOURS" --vm --json "$TERRAIN_JSON"

      - name: "Scenario: nothing of the user lost, all the new there"
        if: ${{ !cancelled() && matrix.parcours == 'reinstallation' }}
        timeout-minutes: 20
        run: python3 -I engine/tests/terrain.py montee --parcours "$PARCOURS" --vm --json "$TERRAIN_JSON"

      # --- from here on, the real nightly of this machine stays out of the way
      - name: The scheduled jobs are stopped for the rest of the job
        if: ${{ !cancelled() }}
        run: |
          XDG_RUNTIME_DIR="/run/user/$(id -u)"; export XDG_RUNTIME_DIR
          if [ -S "$XDG_RUNTIME_DIR/bus" ]; then systemctl --user stop gbrain-nightly.timer brain-reflection.timer gbrain-lint.timer || true; fi
          crontab -r 2>/dev/null || true

      - name: "Scenario: seven nights of the night check, then J+20"
        if: ${{ !cancelled() && matrix.parcours == 'neuf' }}
        timeout-minutes: 20
        run: python3 -I engine/tests/terrain.py nuits --parcours "$PARCOURS" --vm --json "$TERRAIN_JSON"

      - name: Summary
        if: always()
        run: python3 -I engine/tests/terrain.py rapport "$TERRAIN_JSON" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-linux-${{ matrix.parcours }}
          path: ${{ env.TERRAIN_JSON }}
          if-no-files-found: warn
          retention-days: 14

  # The real Claude on a VM of its own: only Anthropic's installer ran there before, never the
  # kit's installers nor gbrain (third-party, updated every week), and the scenario runs the
  # repository's scripts, not installed launchers. A run of another ref or workflow than
  # master's own says "skipped: token kept for master" and never gets the token.
  claude:
    name: Real Claude (${{ matrix.os }})
    needs: ref
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    environment: ${{ github.ref == 'refs/heads/master' && (inputs.ref || 'master') == 'master' && 'terrain-claude' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-latest
            python: python3
          - os: windows
            runner: windows-latest
            python: python
    env:
      PARCOURS: claude
      TERRAIN_OS: ${{ matrix.os }}
      TERRAIN_SHA: ${{ needs.ref.outputs.sha }}
      TERRAIN_JETON: ${{ github.ref == 'refs/heads/master' && (inputs.ref || 'master') == 'master' && 'master' || 'reserve' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Where the results go
        run: echo "TERRAIN_JSON=$RUNNER_TEMP/terrain-$TERRAIN_OS-claude.json" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ref.outputs.sha }}
          persist-credentials: false

      - name: Claude Code (Anthropic's official installer), and nothing else
        continue-on-error: true
        timeout-minutes: 10
        run: |
          if [ "$TERRAIN_OS" = windows ]; then
            pwsh -NoProfile -Command 'irm https://claude.ai/install.ps1 | iex'
          else
            curl -fsSL https://claude.ai/install.sh | bash
          fi

      - name: "Scenario: the real Claude (skipped without the token, or off master)"
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ env.TERRAIN_JETON == 'master' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: ${{ matrix.python }} -I engine/tests/terrain.py vrai-claude --parcours "$PARCOURS" --vm --json "$TERRAIN_JSON"

      - name: Summary
        if: always()
        run: ${{ matrix.python }} -I engine/tests/terrain.py rapport "$TERRAIN_JSON" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-${{ matrix.os }}-claude
          path: ${{ env.TERRAIN_JSON }}
          if-no-files-found: warn
          retention-days: 14

  # The desktop app as a user gets it, clicked through in its real window (terrain_app.py): on
  # master and the scheduled night, the newest app preview, downloaded, its SHA256SUMS and its
  # attestation checked; on a branch (no preview of it exists), the app built from the tested
  # commit as release.yml builds it. Nothing of the kit is installed before: the app does it all.
  # No Claude token here: the robot clicks « Plus tard » at the login, and the app and what it
  # starts get a fresh user's environment (GH_TOKEN, read-only, only lists the releases and
  # checks the attestation). The captures are public: the VM's screen only.
  app-macos:
    name: The app, clicked through (macOS)
    needs: ref
    runs-on: macos-latest
    timeout-minutes: 185
    permissions:
      contents: read
      attestations: read
    env:
      PARCOURS: app
      TERRAIN_SHA: ${{ needs.ref.outputs.sha }}
    steps:
      - name: Where the results and the captures go
        run: |
          echo "TERRAIN_JSON=$RUNNER_TEMP/terrain-macos-app.json" >> "$GITHUB_ENV"
          echo "TERRAIN_CAPTURES=$RUNNER_TEMP/captures-macos-app" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ref.outputs.sha }}
          persist-credentials: false

      - name: Where the app comes from (master downloads the preview, a branch builds)
        id: source
        run: python3 -I engine/tests/terrain_app.py source --ref "$TERRAIN_REF" | tee -a "$GITHUB_OUTPUT"

      # A branch's build only, from caches of the terrain's own (release.yml restores none of
      # them), saved right after the build: nothing the app and what it starts later (Claude
      # Code, Bun, gbrain and their dependencies, run as this user) ever gets into a cache.
      # Never saved on master, whose caches every branch restores. (Keys the old post-job save
      # wrote, after the app had run, are never read again.)
      - name: Tauri CLI, cached (branch build)
        id: tauri-cli
        if: steps.source.outputs.source == 'build'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: terrain-tauri-cli-2.11.5-${{ runner.os }}-${{ runner.arch }}

      - name: Cargo cache (branch build)
        id: cargo
        if: steps.source.outputs.source == 'build'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/src-tauri/target
          key: terrain-build-${{ runner.os }}-universal-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: terrain-build-${{ runner.os }}-universal-

      # The command of release.yml: one universal DMG, ad-hoc signed.
      - name: Build the app from the tested commit (branch)
        if: steps.source.outputs.source == 'build'
        timeout-minutes: 40
        working-directory: app/src-tauri
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_CLI_VERSION: "2.11.5"
          TARGET: universal-apple-darwin
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          command -v cargo-tauri >/dev/null || cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked
          build() {
            rm -rf "target/$TARGET/release/bundle"
            cargo tauri build --ci --target "$TARGET" --bundles dmg -- --locked
          }
          build || { echo "::warning::bundling failed once, trying again"; build; }
          shopt -s nullglob
          dmgs=(target/"$TARGET"/release/bundle/dmg/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] || { echo "::error::expected one DMG, found ${#dmgs[@]}"; exit 1; }
          version=$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))["version"])' tauri.conf.json)
          mkdir -p "$RUNNER_TEMP/app"
          dmg="$RUNNER_TEMP/app/Brain-in-a-Box_${version}-terrain.${TERRAIN_SHA:0:7}_macos-universal.dmg"
          cp "${dmgs[0]}" "$dmg"
          echo "APP_FICHIER=$dmg" >> "$GITHUB_ENV"

      - name: Tauri CLI saved, before anything of the app runs (branch build)
        if: steps.source.outputs.source == 'build' && github.ref != 'refs/heads/master' && steps.tauri-cli.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: ${{ steps.tauri-cli.outputs.cache-primary-key }}

      - name: Cargo cache saved, before anything of the app runs (branch build)
        if: steps.source.outputs.source == 'build' && github.ref != 'refs/heads/master' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/src-tauri/target
          key: ${{ steps.cargo.outputs.cache-primary-key }}

      # A Mac as users get it: no Apple command line tools (the image has Xcode and the tools, set
      # aside here, never deleted): the app's step « Outils Apple » opens Apple's window and the
      # robot clicks it through. The harness keeps Homebrew's python3 and git, none of /usr/bin's.
      - name: No Apple command line tools, before the app
        timeout-minutes: 5
        run: |
          aside="$RUNNER_TEMP/outils-apple"
          sudo mkdir -p "$aside"
          for d in /Applications/Xcode*.app /Library/Developer/CommandLineTools; do
            if [ -e "$d" ]; then sudo mv "$d" "$aside/"; fi
          done
          { pkgutil --pkgs | grep -i 'CLTools' || true; } | while read -r pkg; do sudo pkgutil --forget "$pkg" >/dev/null; done
          sudo xcode-select --reset || true
          dev=$(env -u DEVELOPER_DIR xcode-select -p 2>/dev/null || true)
          if [ -n "$dev" ] && [ -f "$dev/usr/bin/git" ]; then
            echo "::error::the command line tools are still there ($dev)"; exit 1
          fi
          for tool in python3 git; do
            where=$(command -v "$tool")
            case "$where" in /usr/bin/*|"") echo "::error::no $tool for the harness but /usr/bin's"; exit 1 ;; esac
            echo "$tool for the harness: $where"
          done

      - name: "Scenario: the app installed and clicked through to the brain, then opened again"
        if: ${{ !cancelled() }}
        timeout-minutes: 130
        env:
          SOURCE: ${{ steps.source.outputs.source }}
          GH_TOKEN: ${{ steps.source.outputs.source == 'release' && github.token || '' }}
        run: |
          python3 -I engine/tests/terrain.py app --parcours "$PARCOURS" --vm --json "$TERRAIN_JSON" \
            --source "$SOURCE" --fichier "${APP_FICHIER:-}" --captures "$TERRAIN_CAPTURES" --delai-min 125

      - name: Summary
        if: always()
        run: python3 -I engine/tests/terrain.py rapport "$TERRAIN_JSON" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-macos-app
          path: ${{ env.TERRAIN_JSON }}
          if-no-files-found: warn
          retention-days: 14

      # Not "terrain-*": the report job downloads those, and needs the JSON only.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-macos-app
          path: ${{ env.TERRAIN_CAPTURES }}
          if-no-files-found: warn
          retention-days: 14

  # The same on a PC: the NSIS setup.exe (master: the newest preview, checked; a branch: built as
  # release.yml builds it), its pages clicked through, then the app's window, read and clicked
  # through UI Automation (engine/tests/pilote_windows.cs, compiled on the VM by Windows' own .NET
  # Framework: nothing downloaded for it). The PC has no Python but the Store's stub, as users'
  # PCs (poste-neuf.ps1): the app has to bring it. No Claude token here either.
  app-windows:
    name: The app, clicked through (Windows)
    needs: ref
    runs-on: windows-latest
    timeout-minutes: 185
    permissions:
      contents: read
      attestations: read
    env:
      PARCOURS: app
      TERRAIN_SHA: ${{ needs.ref.outputs.sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Where the results and the captures go
        run: |
          "TERRAIN_JSON=$env:RUNNER_TEMP\terrain-windows-app.json" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TERRAIN_CAPTURES=$env:RUNNER_TEMP\captures-windows-app" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ref.outputs.sha }}
          persist-credentials: false

      - name: Where the app comes from (master downloads the preview, a branch builds)
        id: source
        run: |
          $out = python -I engine/tests/terrain_app.py source --ref "$env:TERRAIN_REF"
          if ($LASTEXITCODE) { exit 1 }
          $out
          $out | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # A branch's build only, from caches of the terrain's own (release.yml restores none of
      # them), saved right after the build: nothing the app and what it starts later (Claude
      # Code, Bun, gbrain and their dependencies, run as this user) ever gets into a cache.
      # Never saved on master, whose caches every branch restores. (Keys the old post-job save
      # wrote, after the app had run, are never read again.)
      - name: Tauri CLI, cached (branch build)
        id: tauri-cli
        if: steps.source.outputs.source == 'build'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: terrain-tauri-cli-2.11.5-${{ runner.os }}-${{ runner.arch }}

      - name: Cargo cache (branch build)
        id: cargo
        if: steps.source.outputs.source == 'build'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/src-tauri/target
          key: terrain-build-${{ runner.os }}-x86_64-pc-windows-msvc-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: terrain-build-${{ runner.os }}-x86_64-pc-windows-msvc-

      # The command of release.yml: one NSIS installer, for the user alone.
      - name: Build the app from the tested commit (branch)
        if: steps.source.outputs.source == 'build'
        timeout-minutes: 45
        working-directory: app/src-tauri
        env:
          TAURI_CLI_VERSION: "2.11.5"
          TARGET: x86_64-pc-windows-msvc
        run: |
          rustup target add $env:TARGET
          if (-not (Get-Command cargo-tauri -ErrorAction SilentlyContinue)) {
            cargo install tauri-cli --version "=$env:TAURI_CLI_VERSION" --locked
            if ($LASTEXITCODE) { exit 1 }
          }
          $bundle = "target\$env:TARGET\release\bundle"
          foreach ($try in 1, 2) {
            Remove-Item -Recurse -Force $bundle -ErrorAction SilentlyContinue
            cargo tauri build --ci --target $env:TARGET --bundles nsis -- --locked
            if (-not $LASTEXITCODE) { break }
            if ($try -eq 2) { exit 1 }
            "::warning::bundling failed once, trying again"
          }
          $exes = @(Get-ChildItem "$bundle\nsis\*-setup.exe")
          if ($exes.Count -ne 1) { "::error::expected one NSIS installer, found $($exes.Count)"; exit 1 }
          $version = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory "$env:RUNNER_TEMP\app" -Force | Out-Null
          $exe = "$env:RUNNER_TEMP\app\Brain-in-a-Box_$version-terrain.$($env:TERRAIN_SHA.Substring(0, 7))_windows-x64-setup.exe"
          Copy-Item $exes[0].FullName $exe
          "APP_FICHIER=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Tauri CLI saved, before anything of the app runs (branch build)
        if: steps.source.outputs.source == 'build' && github.ref != 'refs/heads/master' && steps.tauri-cli.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: ${{ steps.tauri-cli.outputs.cache-primary-key }}

      - name: Cargo cache saved, before anything of the app runs (branch build)
        if: steps.source.outputs.source == 'build' && github.ref != 'refs/heads/master' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/src-tauri/target
          key: ${{ steps.cargo.outputs.cache-primary-key }}

      # A PC as users have it: no Python but the Microsoft Store's stub (.github/ci/poste-neuf.ps1,
      # the description the other Windows jobs use). The robot puts the stub's folder first on the
      # app's PATH, as the Store's is on every PC.
      - name: No Python but the Store stub, before the app
        run: |
          . .github/ci/poste-neuf.ps1
          if (-not (Test-Path "$stub\python.exe")) { throw 'no Store stub' }
          "TERRAIN_STUB=$stub" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # The app gets a session's environment, built from the registry: winget, which brings
          # Python, must be on the user's PATH there, as Windows puts WindowsApps for every user.
          $w = Get-Command winget -ErrorAction SilentlyContinue
          "winget: $(if ($w) { $w.Source } else { 'absent' })"
          $apps = "$env:LOCALAPPDATA\Microsoft\WindowsApps"
          $user = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ((Test-Path "$apps\winget.exe") -and "$user" -notlike '*\Microsoft\WindowsApps*') {
            [Environment]::SetEnvironmentVariable('Path', ("$user;$apps").TrimStart(';'), 'User')
            "WindowsApps was not on the user's PATH: added, as on every PC"
          }
          "py launcher: $(if (Test-Path "$env:WINDIR\py.exe") { 'there (the stub py.cmd comes first on the PATH)' } else { 'absent' })"

      # Each step re-reads the Machine PATH, which poste-neuf.ps1 emptied of the runner's Python:
      # the harness gets it back through GITHUB_PATH; the app gets a session's environment, without it.
      - name: Python for the harness (the runner's, not the one the app sets up)
        run: |
          $tc = Get-ChildItem "$env:RUNNER_TOOL_CACHE\Python\*\x64\python.exe" -ErrorAction SilentlyContinue |
            Sort-Object { [version]($_.Directory.Parent.Name -replace '[^0-9.].*$', '') } | Select-Object -Last 1
          if (-not $tc) { throw 'no Python in the runner tool cache for the harness' }
          Split-Path $tc.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "harness Python: $($tc.FullName)"

      - name: "Scenario: the app installed and clicked through to the brain, then opened again"
        if: ${{ !cancelled() }}
        timeout-minutes: 130
        env:
          SOURCE: ${{ steps.source.outputs.source }}
          GH_TOKEN: ${{ steps.source.outputs.source == 'release' && github.token || '' }}
        run: |
          python -I engine/tests/terrain.py app --parcours $env:PARCOURS --vm --json $env:TERRAIN_JSON `
            "--source=$env:SOURCE" "--fichier=$env:APP_FICHIER" --captures $env:TERRAIN_CAPTURES "--stub=$env:TERRAIN_STUB" `
            --delai-min 125

      - name: Summary
        if: always()
        run: python -I engine/tests/terrain.py rapport $env:TERRAIN_JSON | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-windows-app
          path: ${{ env.TERRAIN_JSON }}
          if-no-files-found: warn
          retention-days: 14

      # Not "terrain-*": the report job downloads those, and needs the JSON only.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-windows-app
          path: ${{ env.TERRAIN_CAPTURES }}
          if-no-files-found: warn
          retention-days: 14

  # The same on Ubuntu 24.04: the AppImage (master: the newest preview, checked; a branch: built as
  # release.yml builds it, here on 24.04), run from ~/Applications as a user runs it, on a desktop
  # of the job's own: Xvfb, a window manager (openbox), the user's session bus and systemd. The
  # window is read through AT-SPI and clicked with the mouse (xdotool). The VM is first made an
  # Ubuntu desktop as it comes, without git nor curl (terrain_app.py, PiloteLinux.poste_neuf): the
  # app's « Outils de base » step installs them, as root through pkexec, after the system's password
  # window. That window needs a person: a polkit rule for this user stands in for the password
  # typed there (the only stand-in), and the journal shows what ran as root.
  app-linux:
    name: The app, clicked through (Linux)
    needs: ref
    runs-on: ubuntu-latest
    timeout-minutes: 185
    permissions:
      contents: read
      attestations: read
    env:
      PARCOURS: app
      TERRAIN_SHA: ${{ needs.ref.outputs.sha }}
    steps:
      - name: Where the results and the captures go
        run: |
          echo "TERRAIN_JSON=$RUNNER_TEMP/terrain-linux-app.json" >> "$GITHUB_ENV"
          echo "TERRAIN_CAPTURES=$RUNNER_TEMP/captures-linux-app" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ref.outputs.sha }}
          persist-credentials: false

      - name: Where the app comes from (master downloads the preview, a branch builds)
        id: source
        run: python3 -I engine/tests/terrain_app.py source --ref "$TERRAIN_REF" | tee -a "$GITHUB_OUTPUT"

      # A branch's build only, from caches of the terrain's own (release.yml restores none of
      # them), saved right after the build: nothing the app and what it starts later ever gets
      # into a cache. Never saved on master, whose caches every branch restores.
      - name: Tauri CLI, cached (branch build)
        id: tauri-cli
        if: steps.source.outputs.source == 'build'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: terrain-tauri-cli-2.11.5-${{ runner.os }}-${{ runner.arch }}

      - name: Cargo cache (branch build)
        id: cargo
        if: steps.source.outputs.source == 'build'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/src-tauri/target
          key: terrain-build-${{ runner.os }}-x86_64-unknown-linux-gnu-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: terrain-build-${{ runner.os }}-x86_64-unknown-linux-gnu-

      # The command of release.yml, its AppImage only (what this job installs); its tools pinned.
      - name: Build the app from the tested commit (branch)
        if: steps.source.outputs.source == 'build'
        timeout-minutes: 40
        working-directory: app/src-tauri
        env:
          TAURI_CLI_VERSION: "2.11.5"
          TARGET: x86_64-unknown-linux-gnu
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libssl-dev libxdo-dev patchelf file
          bash "$GITHUB_WORKSPACE/.github/ci/appimage-tools.sh"
          command -v cargo-tauri >/dev/null || cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked
          build() {
            rm -rf "target/$TARGET/release/bundle"
            cargo tauri build --ci --target "$TARGET" --bundles appimage -- --locked
          }
          build || { echo "::warning::bundling failed once, trying again"; build; }
          shopt -s nullglob
          images=(target/"$TARGET"/release/bundle/appimage/*.AppImage)
          [ "${#images[@]}" -eq 1 ] || { echo "::error::expected one AppImage, found ${#images[@]}"; exit 1; }
          version=$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))["version"])' tauri.conf.json)
          mkdir -p "$RUNNER_TEMP/app"
          image="$RUNNER_TEMP/app/Brain-in-a-Box_${version}-terrain.${TERRAIN_SHA:0:7}_linux-x86_64.AppImage"
          cp "${images[0]}" "$image"
          echo "APP_FICHIER=$image" >> "$GITHUB_ENV"

      - name: Tauri CLI saved, before anything of the app runs (branch build)
        if: steps.source.outputs.source == 'build' && github.ref != 'refs/heads/master' && steps.tauri-cli.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: ${{ steps.tauri-cli.outputs.cache-primary-key }}

      - name: Cargo cache saved, before anything of the app runs (branch build)
        if: steps.source.outputs.source == 'build' && github.ref != 'refs/heads/master' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/src-tauri/target
          key: ${{ steps.cargo.outputs.cache-primary-key }}

      # The desktop: an X server (Xvfb) and a window manager (openbox), the user's systemd and
      # session bus (the accessibility bus answers there, and install.sh finds systemd there), the
      # robot's eyes and hands (AT-SPI's Python bindings, xdotool, xwininfo, ImageMagick), and
      # pkexec with the rule that stands in for the password typed in the system's window.
      - name: A desktop for the app
        timeout-minutes: 5
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb openbox xdotool x11-utils imagemagick at-spi2-core python3-gi \
            gir1.2-atspi-2.0 dbus-user-session pkexec
          printf '%s\n' 'polkit.addRule(function (action, subject) {' \
            "  if (action.id == \"org.freedesktop.policykit.exec\" && subject.user == \"$USER\") { return polkit.Result.YES; }" \
            '});' | sudo tee /etc/polkit-1/rules.d/49-terrain-mot-de-passe.rules
          run="/run/user/$(id -u)"
          if [ ! -S "$run/bus" ]; then sudo loginctl enable-linger "$USER"; fi
          for _ in $(seq 1 30); do [ -S "$run/bus" ] && break; sleep 1; done
          [ -S "$run/bus" ] || { echo "::error::no session bus for $USER"; exit 1; }
          XDG_RUNTIME_DIR="$run" systemctl --user show-environment >/dev/null || { echo "::error::the user's systemd does not answer"; exit 1; }
          setsid nohup Xvfb :99 -screen 0 1280x900x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 < /dev/null &
          for _ in $(seq 1 30); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 1; done
          DISPLAY=:99 DBUS_SESSION_BUS_ADDRESS="unix:path=$run/bus" setsid nohup openbox > "$RUNNER_TEMP/openbox.log" 2>&1 < /dev/null &
          sleep 2
          pgrep -x openbox >/dev/null || { echo "::error::no window manager"; cat "$RUNNER_TEMP/openbox.log"; exit 1; }
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          pkexec --version

      - name: "Scenario: the app installed and clicked through to the brain, then opened again"
        if: ${{ !cancelled() }}
        timeout-minutes: 130
        env:
          SOURCE: ${{ steps.source.outputs.source }}
          GH_TOKEN: ${{ steps.source.outputs.source == 'release' && github.token || '' }}
        run: |
          python3 -I engine/tests/terrain.py app --parcours "$PARCOURS" --vm --json "$TERRAIN_JSON" \
            --source "$SOURCE" --fichier "${APP_FICHIER:-}" --captures "$TERRAIN_CAPTURES" --delai-min 125

      - name: Summary
        if: always()
        run: python3 -I engine/tests/terrain.py rapport "$TERRAIN_JSON" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-linux-app
          path: ${{ env.TERRAIN_JSON }}
          if-no-files-found: warn
          retention-days: 14

      # Not "terrain-*": the report job downloads those, and needs the JSON only.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-linux-app
          path: ${{ env.TERRAIN_CAPTURES }}
          if-no-files-found: warn
          retention-days: 14

  rapport:
    name: Report (one issue "terrain")
    needs: [ref, macos, windows, linux, claude, app-macos, app-windows, app-linux]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      ATTENDUS: macos-neuf,macos-montee,windows-neuf,windows-montee,linux-neuf,linux-reinstallation,macos-claude,windows-claude,macos-app,windows-app,linux-app
      # A job that did not succeed is a failure even when its rows say nothing (terrain.py JOBS).
      JOBS: ref=${{ needs.ref.result }},macos=${{ needs.macos.result }},windows=${{ needs.windows.result }},linux=${{ needs.linux.result }},claude=${{ needs.claude.result }},app-macos=${{ needs.app-macos.result }},app-windows=${{ needs.app-windows.result }},app-linux=${{ needs.app-linux.result }}
    steps:
      # The workflow's own commit: the code that writes the issue is the one this file came with.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # A job that died uploads nothing: the report then says which one.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: terrain-*
          path: ${{ runner.temp }}/terrain
          merge-multiple: true

      - name: The night in one table
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/terrain"
          shopt -s nullglob
          python3 -I engine/tests/terrain.py rapport "$RUNNER_TEMP"/terrain/*.json --attendus "$ATTENDUS" --jobs "$JOBS" >> "$GITHUB_STEP_SUMMARY"

      # Scheduled runs only: a run started by hand on a branch never speaks for master.
      # Green again: the issue is closed, with the run's link; the next failure opens a new one.
      - name: Open, or comment, the issue "terrain"; close it when green again
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          shopt -s nullglob
          day=$(date -u +%Y-%m-%d)
          body="$RUNNER_TEMP/issue.md"
          python3 -I engine/tests/terrain.py issue "$RUNNER_TEMP"/terrain/*.json --attendus "$ATTENDUS" \
            --jobs "$JOBS" --run-url "$RUN_URL" --date "$day" > "$body"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label terrain --state open --author app/github-actions \
            --json number --jq '.[0].number // empty')
          if [ -s "$body" ]; then
            gh label create terrain --repo "$GITHUB_REPOSITORY" --color B60205 \
              --description "Tests de terrain de nuit (VM)" 2>/dev/null || true
            if [ -n "$open" ]; then
              gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --label terrain \
                --title "Terrain : des tests de nuit échouent" --body-file "$body"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" --reason completed --comment "vert le $day ($RUN_URL)"
          fi
