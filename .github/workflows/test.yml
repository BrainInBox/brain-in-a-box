name: tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  hooks:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run test-hooks.sh (hooks + gbrain self-update + YAML frontmatter validation)
        run: bash test-hooks.sh

      - name: Unit tests (engine/tests; the 7-day gbrain update against a local repository and fake Bun)
        run: python3 -I -m unittest discover -s engine/tests -v

      # Each script is parsed by the shell its shebang names: the zsh scripts
      # used to be checked with bash, and new scripts were easy to forget.
      - name: Syntax-check every script with its own shell
        run: |
          for f in *.sh engine/nightly/*.sh engine/bin/* skills/*/scripts/*.sh; do
            sh=$(head -1 "$f" | sed -E 's@^#! *@@; s@^/usr/bin/env +@@; s@^.*/@@; s@ .*@@')
            echo "$sh -n $f" && "$sh" -n "$f"
          done

      - name: Compile the Python hooks, search, Windows nightly, unit tests and CI helpers
        run: python3 -m py_compile engine/*.py engine/hooks/*.py engine/search/*.py engine/nightly/*.py engine/tests/*.py .github/ci/*.py

      - name: launchd templates are well-formed plists
        run: for f in engine/nightly/*.plist.template; do plutil -lint "$f"; done

  # The installer app, on a Mac and on Windows: diagnosis, install steps, Voyage key check,
  # command runner. (Real downloads are #[ignore] tests, run by hand.)
  app:
    name: app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Rust tests
        run: cargo test --locked
      - name: Clippy, warnings are errors
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: The window's script parses
        run: node --check ../src/app.js

      - name: Without its window, the app examines the PC and says so in JSON
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          $out = (& .\target\debug\brain-in-a-box.exe --diagnose) -join "`n"
          if ($LASTEXITCODE) { throw "--diagnose exited $LASTEXITCODE" }
          $out
          $d = $out | ConvertFrom-Json
          if ($d.os -notlike 'Windows 1*') { throw "os: $($d.os)" }
          $ids = @($d.checks | ForEach-Object { $_.id })
          foreach ($id in 'windows', 'disk', 'network', 'python', 'git', 'bun', 'claude', 'obsidian', 'brain_vault', 'voyage') {
            if ($ids -notcontains $id) { throw "no check $id in $($ids -join ', ')" }
          }
          if ($ids -contains 'clt') { throw 'Apple tools checked on Windows' }
          if (-not $d.can_install) { throw 'a fresh runner cannot install' }
          foreach ($step in @($d.todo)) { if ($step -notin 'claude', 'brain') { throw "unknown step $step" } }
          if ($d.ram_gb -le 0 -or $d.disk_free_gb -le 0) { throw "memory $($d.ram_gb), free $($d.disk_free_gb)" }

  # The app's own install path on a real Windows, without its window: Claude Code, then the
  # brain (install.ps1 from this commit, no console, no question) on a PC with only the Store's
  # python stub. Afterwards the app's diagnosis must find nothing left to install.
  app-windows-install:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Build the app
        working-directory: app/src-tauri
        run: cargo build --locked

      - name: Claude Code, then the brain, through the app's steps
        run: |
          git archive --format=zip --prefix=brain-in-a-box-master/ -o "$env:RUNNER_TEMP\biab.zip" HEAD
          . .github/ci/poste-neuf.ps1
          $env:BIAB_ARCHIVE = "$env:RUNNER_TEMP\biab.zip"
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          foreach ($step in 'claude', 'brain') {
            & app\src-tauri\target\debug\brain-in-a-box.exe --run-step $step *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\step-$step.txt"
            if ($LASTEXITCODE) { throw "the $step step failed" }
          }
          # install.ps1's sections reached the window as progress lines, in order.
          $seen = @(Select-String -Path "$env:RUNNER_TEMP\step-brain.txt" -Pattern '\((\d+) sur 13\)' | ForEach-Object { [int]$_.Matches[0].Groups[1].Value })
          if ($seen.Count -lt 10) { throw "only $($seen.Count) sections announced: $seen" }
          if (($seen -join ',') -ne (($seen | Sort-Object) -join ',')) { throw "sections out of order: $seen" }

      - name: The app now finds everything installed
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          $d = ((& app\src-tauri\target\debug\brain-in-a-box.exe --diagnose) -join "`n") | ConvertFrom-Json
          $d.checks | Format-Table id, status, detail -AutoSize | Out-String -Width 200
          if (@($d.todo).Count) { throw "still to install: $($d.todo -join ', ')" }
          foreach ($id in 'python', 'git', 'bun', 'claude', 'obsidian', 'brain_vault', 'brain_hooks', 'brain_skills', 'brain_memory') {
            $c = $d.checks | Where-Object id -eq $id
            if ($c.status -ne 'ok') { throw "$id is $($c.status): $($c.detail)" }
          }
          # Run again, the step has nothing to do.
          $again = (& app\src-tauri\target\debug\brain-in-a-box.exe --run-step brain) -join "`n"; $again
          if ($LASTEXITCODE -or $again -notmatch 'Ton cerveau est d\S+ install') { throw 'a second run did something' }

  # A real install on a real Windows, the way a user runs it: no Python but the
  # Microsoft Store stub (what broke installs in the field), so Python comes from winget.
  # The memory is gbrain, as on macOS, at the release engine/gbrain-pin.json pins: this job
  # is what makes that pin a tested one. No secret here: the Voyage path runs against
  # .github/ci/fake_voyage.py, and the rejected-key path against the real API with a bad key.
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: install.ps1 parses in Windows PowerShell 5.1 and PowerShell 7
        run: |
          foreach ($exe in 'powershell', 'pwsh') {
            & $exe -NoProfile -Command '$e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1).Path, [ref]$null, [ref]$e); if ($e) { $e | ForEach-Object { Write-Host $_.Extent.StartLineNumber $_.Message }; exit 1 }'
            if ($LASTEXITCODE) { exit 1 }
          }

      - name: install.ps1 is pure ASCII (5.1 reads a BOM-less script as ANSI)
        run: |
          $bad = Select-String -Path install.ps1 -Pattern '[^\x00-\x7F]'
          if ($bad) { $bad; exit 1 }

      - name: Fresh install, only the Store python stub on the PATH, a Voyage key Voyage refuses
        run: |
          . .github/ci/poste-neuf.ps1
          $env:VOYAGE_API_KEY = 'pa-ci-refused-not-a-secret'
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\install-1.txt"
          if ($LASTEXITCODE) { exit 1 }
          $out = Get-Content "$env:RUNNER_TEMP\install-1.txt" -Raw
          if ($out -notmatch "Voyage n'a pas accepte cette cle") { throw 'a refused key was not reported' }
          foreach ($f in "$env:RUNNER_TEMP\install-1.txt", "$env:USERPROFILE\.brain-in-a-box\install.log", "$env:USERPROFILE\.gbrain\config.json") {
            if (Select-String -Path $f -SimpleMatch 'pa-ci-refused' -Quiet) { throw "the key leaked into $f" }
          }

      - name: The install did what it says
        run: |
          $H = $env:USERPROFILE
          $s = Get-Content "$H\.claude\settings.json" -Raw
          if ($s -match 'stub') { throw 'hooks wired to the Store stub' }
          if ($s -notmatch 'AppData\\\\Local\\\\Programs\\\\Python') { throw 'hooks not wired to the Python winget installed' }
          $j = $s | ConvertFrom-Json
          $cd = @(@($j.hooks.UserPromptSubmit.hooks) | Where-Object { "$($_.args)" -like '*correction-detector.py*' })
          if ($cd.Count -ne 1) { throw "correction-detector wired $($cd.Count) times" }
          if ($cd[0].command -notlike '*python.exe') { throw "hook is not in exec form: $($cd[0].command)" }
          $uc = @(@($j.hooks.SessionStart.hooks) | Where-Object { "$($_.args)" -like '*gbrain-update-check.py*' })
          if ($uc.Count -ne 1) { throw "gbrain-update-check wired $($uc.Count) times under SessionStart" }
          if ($uc[0].command -notlike '*python.exe') { throw "SessionStart hook is not in exec form: $($uc[0].command)" }
          $cs = @(@($j.hooks.SessionStart.hooks) | Where-Object { "$($_.args)" -like '*controle-sessionstart.py*' })
          if ($cs.Count -ne 1) { throw "controle-sessionstart wired $($cs.Count) times under SessionStart" }
          if ($cs[0].command -notlike '*python.exe') { throw "controle-sessionstart is not in exec form: $($cs[0].command)" }
          if (-not (Test-Path "$H\.claude\hooks\brain\gbrain_update.py")) { throw 'gbrain_update.py not installed next to the hooks' }
          if (-not (Test-Path "$H\.claude\hooks\brain\controle.py")) { throw 'controle.py not installed next to the hooks' }
          foreach ($f in 'controle.cmd', 'controle') {
            if (-not (Test-Path "$H\.local\bin\$f")) { throw "$f not installed in ~\.local\bin" }
          }
          if (-not (Test-Path "$H\Documents\Brain\Profile")) { throw 'vault skeleton missing' }
          if (-not (Test-Path "$H\Documents\Brain\.git")) { throw 'vault is not a git repo' }
          # Git for Windows' autocrlf would turn LF notes into CRLF whenever the night check undoes a fix.
          if ((git -C "$H\Documents\Brain" config core.autocrlf) -ne 'false') { throw 'the vault repo rewrites line ends' }
          Get-ScheduledTask -TaskName BrainNightly, BrainReflection | Format-Table TaskName, State
          if (Get-ScheduledTask -TaskName BrainSearchReindex -ErrorAction SilentlyContinue) { throw 'the old BrainSearchReindex task is still there' }
          if (-not (Get-ScheduledTask -TaskName BrainNightly).Settings.StartWhenAvailable) { throw 'a missed nightly would not catch up' }
          if (-not (Test-Path "$H\.local\bin\claude.exe")) { throw 'Claude Code not installed' }
          $m = @(Select-String -Path "$H\.claude\CLAUDE.md" -SimpleMatch '<!-- brain-in-a-box -->').Count
          if ($m -ne 1) { throw "CLAUDE.md marker found $m times" }
          foreach ($sk in Get-ChildItem skills -Directory) {
            if (-not (Test-Path "$H\.claude\skills\$($sk.Name)\SKILL.md")) { throw "skill $($sk.Name) not installed" }
          }

      - name: Unit tests (engine/tests) with the Python the installer set up
        run: |
          $py = (@((Get-Content "$env:USERPROFILE\.claude\settings.json" -Raw | ConvertFrom-Json).hooks.UserPromptSubmit.hooks)[0]).command
          & $py -I -m unittest discover -s engine/tests -v
          if ($LASTEXITCODE) { throw "unit tests failed (exit $LASTEXITCODE)" }

      - name: gbrain is the memory (keyword brain, no key)
        run: |
          $H = $env:USERPROFILE
          $gb = "$H\.bun\bin\gbrain.exe"
          if (-not (Test-Path $gb)) { throw 'gbrain.exe not linked' }
          if ((Get-Content "$H\.brain-search\engine").Trim() -ne 'gbrain') { throw "engine: $(Get-Content "$H\.brain-search\engine")" }
          if (-not (Test-Path "$H\.gbrain\brain.pglite")) { throw 'no brain.pglite' }
          $want = (Get-Content engine\gbrain-pin.json -Raw | ConvertFrom-Json).sha
          $head = (git -C "$H\DEV\gbrain" rev-parse HEAD).Trim()
          if ($head -ne $want) { throw "gbrain at $head, engine/gbrain-pin.json pins $want" }
          & $gb --version
          $cfg = Get-Content "$H\.gbrain\config.json" -Raw | ConvertFrom-Json
          if (-not $cfg.embedding_disabled) { throw 'a brain without a key should be keyword-only' }
          $src = (& $gb sources list) -join "`n"; $src
          if ($src -notmatch '(?m)^\s+vault\s') { throw 'the vault is not a gbrain source' }
          # gbrain skips README.md files; Profile/lessons.md is a page.
          $q = (& "$H\.local\bin\gbq.cmd" query "captured corrections") -join "`n"; $q
          if ($LASTEXITCODE) { throw "gbq.cmd query exited $LASTEXITCODE" }
          if ($q -notmatch '(?i)profile/lessons' -or $q -match '#chunk') { throw 'gbq.cmd query was not answered by gbrain' }
          # The onboarding's re-index, verbatim.
          & "$H\.local\bin\gbq.cmd" sync --repo "$H\Documents\Brain" --no-pull --no-embed; if ($LASTEXITCODE) { throw 'gbq.cmd sync failed' }
          & "$H\.local\bin\gbq.cmd" embed --stale --max-usd 0.10; if ($LASTEXITCODE) { throw 'gbq.cmd embed failed on a keyword brain' }

      - name: A hook runs the way Claude Code spawns it (exec form)
        run: |
          $j = Get-Content "$env:USERPROFILE\.claude\settings.json" -Raw | ConvertFrom-Json
          $h = @($j.hooks.UserPromptSubmit.hooks)[0]
          '{"prompt": "hello", "session_id": "ci", "transcript_path": ""}' | & $h.command @($h.args)
          if ($LASTEXITCODE) { throw "correction-detector exited $LASTEXITCODE" }

      - name: gbq and controle work from Git Bash (Claude Code's Bash tool), onboarding commands included
        shell: bash
        run: |
          out=$(~/.local/bin/gbq query "captured corrections") && echo "$out" && echo "$out" | grep -qi 'profile/lessons'
          ~/.local/bin/gbq sync --repo ~/Documents/Brain --no-pull --no-embed
          ~/.local/bin/gbq embed --stale --max-usd 0.10
          # What the /controle skill runs; statut only reads the state, the check itself runs below.
          out=$(~/.local/bin/controle --help) && echo "$out" | grep -q 'annuler'
          ~/.local/bin/controle statut

      - name: The 7-day gbrain update, dry run against the real GitHub (reads, decides, changes nothing)
        run: |
          $H = $env:USERPROFILE
          $py = (@((Get-Content "$H\.claude\settings.json" -Raw | ConvertFrom-Json).hooks.UserPromptSubmit.hooks)[0]).command
          $head = (git -C "$H\DEV\gbrain" rev-parse HEAD).Trim()
          # Compared before and after rather than expected absent: a job that runs across 04:00
          # also gets the real BrainNightly, which writes them (2026-10-14).
          $files = 'update-state.json', 'last-update.json', 'update.lock'
          $snap = { $files | ForEach-Object { $p = "$H\.gbrain\$_"; if (Test-Path $p) { "$_ $((Get-FileHash $p).Hash) $((Get-Item $p).LastWriteTimeUtc.Ticks)" } else { "$_ -" } } }
          $before = (& $snap) -join "`n"
          # Its own lines carry accents: only their ASCII parts are matched.
          $out = (& $py -I "$H\.claude\hooks\brain\gbrain_update.py" --a-blanc 2>&1) -join "`n"; $out
          if ($LASTEXITCODE) { throw "gbrain_update.py --a-blanc exited $LASTEXITCODE" }
          if ($out -notmatch 'tags v\* en amont : [1-9]') { throw 'the list of gbrain releases was not read' }
          if ($out -notmatch 'cision : ') { throw 'no decision printed' }
          if ((git -C "$H\DEV\gbrain" rev-parse HEAD).Trim() -ne $head) { throw 'a dry run moved gbrain' }
          $after = (& $snap) -join "`n"
          if ($after -ne $before) { throw "a dry run wrote in ~/.gbrain:`n$before`n->`n$after" }

      - name: The nightly task commits the day's notes and indexes them (S4U, as registered)
        run: |
          $H = $env:USERPROFILE
          $utf8 = New-Object Text.UTF8Encoding $false
          [IO.File]::WriteAllText("$H\Documents\Brain\Journal\lighthouse.md", "# The lighthouse`n`nThe lighthouse keeper logs every storm and repairs the lamp lens before winter.`n", $utf8)
          # The update step runs for real (list, registry, state) but paused: whether a release is
          # 7 days old today depends on upstream, and installing one is covered by engine/tests.
          $until = (Get-Date).ToUniversalTime().AddDays(2).ToString("s") + "Z"
          [IO.File]::WriteAllText("$H\.gbrain\update-state.json", "{`"pause_jusqua`": `"$until`"}", $utf8)
          Start-ScheduledTask -TaskName BrainNightly
          $sw = [Diagnostics.Stopwatch]::StartNew()
          Start-Sleep -Seconds 3
          while ((Get-ScheduledTask -TaskName BrainNightly).State -eq 'Running' -and $sw.Elapsed.TotalSeconds -lt 900) { Start-Sleep -Seconds 3 }
          $info = Get-ScheduledTaskInfo -TaskName BrainNightly
          Get-Content "$H\.gbrain\nightly.log"
          if ($info.LastTaskResult -ne 0) { throw "BrainNightly LastTaskResult $($info.LastTaskResult)" }
          $log = Get-Content "$H\.gbrain\nightly.log" -Raw
          foreach ($want in '[gbrain-update] exit 0', '[controle] exit 0', '[sync] exit 0', '[embed] exit 0', '[brain_search] exit 0', 'nightly done') {
            if (-not $log.Contains($want)) { throw "nightly.log lacks '$want'" }
          }
          $at = '[gbrain-update] exit', '[controle] exit', '[sync] exit' | ForEach-Object { $log.IndexOf($_) }
          if ($at[0] -gt $at[1] -or $at[1] -gt $at[2]) { throw "update, night check and sync out of order: $($at -join ', ')" }
          # The night check commits the day's notes itself ("nightly <date>"), before its fixes;
          # the vault commit after it only catches what is left.
          if ((git -C "$H\Documents\Brain" log -1 --format=%s -- Journal/lighthouse.md) -notmatch '^nightly ') { throw "today's note was not committed by the nightly" }
          $lu = Get-Content "$H\.gbrain\last-update.json" -Raw | ConvertFrom-Json
          if ($lu.status -ne 'paused' -or -not $lu.derniere_verif_ok) { throw "update step: status $($lu.status), last check $($lu.derniere_verif_ok)" }
          $q = (& "$H\.local\bin\gbq.cmd" query "lighthouse keeper storm") -join "`n"; $q
          if ($q -notmatch '(?i)lighthouse' -or $q -match '#chunk') { throw 'the note written today is not in gbrain after the nightly' }
          # The session's first line, spawned the way Claude Code does: its JSON or nothing, and never twice for one run.
          $cs = @(@((Get-Content "$H\.claude\settings.json" -Raw | ConvertFrom-Json).hooks.SessionStart.hooks) | Where-Object { "$($_.args)" -like '*controle-sessionstart.py*' })[0]
          $first = ('{"source": "startup", "session_id": "ci"}' | & $cs.command @($cs.args)) -join "`n"; $first
          if ($LASTEXITCODE) { throw "controle-sessionstart exited $LASTEXITCODE" }
          if ($first -and ($first | ConvertFrom-Json).hookSpecificOutput.hookEventName -ne 'SessionStart') { throw 'controle-sessionstart printed something else than its JSON' }
          $etat = Get-Content "$H\.brain-in-a-box\controle\etat.json" -Raw | ConvertFrom-Json
          if ($etat.rapport_reecrit -and ($etat.corrections -or $etat.a_voir) -and -not $first) { throw 'the night check wrote a report, the session would not hear of it' }
          $again = ('{"source": "startup", "session_id": "ci"}' | & $cs.command @($cs.args)) -join "`n"
          if ($again) { throw "the same line came twice: $again" }

      - name: The night check fixes a trapped vault, undoing the night puts every note back, a vault without git is left alone
        run: |
          $H = $env:USERPROFILE
          $py = (@((Get-Content "$H\.claude\settings.json" -Raw | ConvertFrom-Json).hooks.UserPromptSubmit.hooks)[0]).command
          $ctl = "$H\.local\bin\controle.cmd"
          $T = "$env:RUNNER_TEMP\controle"
          $V = "$T\Brain"
          function Snap($root) {
            Get-ChildItem -LiteralPath $root -Recurse -File -Force | Where-Object { $_.FullName -notlike "$root\.git\*" } |
              ForEach-Object { "$($_.FullName.Substring($root.Length)) $((Get-FileHash -LiteralPath $_.FullName).Hash)" } | Sort-Object
          }
          & $py -I engine\tests\vault_piege.py $V
          if ($LASTEXITCODE) { throw "vault_piege.py exited $LASTEXITCODE" }
          $before = Snap $V
          $out = (& $ctl nuit --sans-claude --brain $V --etat "$T\etat" 2>&1) -join "`n"; $out
          if ($LASTEXITCODE) { throw "controle nuit exited $LASTEXITCODE" }
          $etat = Get-Content "$T\etat\etat.json" -Raw | ConvertFrom-Json
          if ($etat.corrections -lt 5) { throw "only $($etat.corrections) fixes on the trapped vault" }
          $pw = 'hunter2-ci-' + 'canari'
          if ((Get-Content "$V\Projects\api-notes.md" -Raw).Contains($pw)) { throw 'a password was left in clear' }
          if ((git -C $V log -p --all) -match [regex]::Escape($pw)) { throw 'a password reached git history' }
          $out = (& $ctl annuler derniere-nuit --brain $V --etat "$T\etat" 2>&1) -join "`n"; $out
          if ($LASTEXITCODE) { throw "controle annuler exited $LASTEXITCODE" }
          if ((Get-Content "$V\Projects\api-notes.md" -Raw).Contains($pw)) { throw "undoing the night put a secret back" }
          # A masked secret comes back on its own, by its id, when asked for explicitly.
          $ids = @([regex]::Matches($out, 'S1-\d{6}-\d{2,3}') | ForEach-Object { $_.Value } | Sort-Object -Unique)
          if (-not $ids) { throw 'the undo did not list the masked secrets' }
          foreach ($id in $ids) {
            & $ctl annuler $id --remettre-le-secret --brain $V --etat "$T\etat"
            if ($LASTEXITCODE) { throw "controle annuler $id exited $LASTEXITCODE" }
          }
          $diff = @(Compare-Object $before (Snap $V) | ForEach-Object { $_.InputObject -replace ' [0-9A-F]{64}$', '' } | Sort-Object -Unique)
          if ("$diff" -ne '\Profile\controle.md') { throw "undoing the night left these files changed: $diff" }
          if ((Get-Content "$V\Profile\controle.md" -Raw) -notmatch '## Annul') { throw 'the report does not say the night was undone' }
          # No git, no fix: nothing in the vault changes, the cause is in etat.json.
          $N = "$T\sans-git"
          New-Item -ItemType Directory "$N\Projects" -Force | Out-Null
          Copy-Item "$V\Projects\deploy.md", "$V\Projects\api-notes.md" "$N\Projects\"
          $before = Snap $N
          & $ctl nuit --sans-claude --brain $N --etat "$T\etat-sans-git"
          if ($LASTEXITCODE) { throw "controle nuit exited $LASTEXITCODE on a vault without git" }
          if (Compare-Object $before (Snap $N)) { throw 'a vault without git was changed' }
          $etat = Get-Content "$T\etat-sans-git\etat.json" -Raw | ConvertFrom-Json
          if ($etat.cause -ne 'pas_de_git' -or $etat.corrections -ne 0) { throw "vault without git: cause $($etat.cause), $($etat.corrections) fixes" }

      - name: A second run is idempotent, and an existing user loses nothing
        run: |
          $H = $env:USERPROFILE
          # What a Windows install from before gbrain left, and what its owner changed since.
          Register-ScheduledTask -TaskName BrainSearchReindex -Action (New-ScheduledTaskAction -Execute cmd.exe -Argument '/c exit 0') -Trigger (New-ScheduledTaskTrigger -Daily -At 04:00) -User $env:USERNAME -Force | Out-Null
          Add-Content "$H\.claude\hooks\brain\session-logger.py" '# adapted on this PC'
          $sp = "$H\.claude\settings.json"
          $j = Get-Content $sp -Raw | ConvertFrom-Json
          $j | Add-Member -NotePropertyName mine -NotePropertyValue 'kept'
          $j.hooks.Stop[0].hooks = @($j.hooks.Stop[0].hooks | Where-Object { "$($_.args)" -notlike '*session-recap.py*' })
          [IO.File]::WriteAllText($sp, ($j | ConvertTo-Json -Depth 20))
          $note = [IO.File]::ReadAllText("$H\Documents\Brain\Journal\lighthouse.md")
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\install-2.txt"
          if ($LASTEXITCODE) { exit 1 }
          $bak = @(Get-ChildItem "$H\.brain-in-a-box\backups\*\brain\session-logger.py")
          if ($bak.Count -ne 1 -or -not (Select-String -Path $bak[0].FullName -SimpleMatch 'adapted on this PC' -Quiet)) { throw 'the adapted hook was not backed up' }
          if ((Get-FileHash "$H\.claude\hooks\brain\session-logger.py").Hash -ne (Get-FileHash engine\hooks\session-logger.py).Hash) { throw 'the hook was not updated' }
          if ((Get-Content "$env:RUNNER_TEMP\install-2.txt" -Raw) -notmatch 'session-logger\.py') { throw 'the replaced hook was not reported' }
          $all = @(Get-ChildItem "$H\.brain-in-a-box\backups" -Recurse -File)
          if ($all.Count -ne 1) { throw "unchanged files were backed up: $($all.FullName -join ', ')" }
          $sb = @(Get-ChildItem "$H\.claude\settings.json.bak-*" | Where-Object { Select-String -Path $_.FullName -SimpleMatch '"kept"' -Quiet })
          if (-not $sb.Count) { throw 'settings.json was rewritten without a backup' }
          if ((Get-Content $sp -Raw | ConvertFrom-Json).mine -ne 'kept') { throw 'a setting of the user was lost' }
          if (Get-ScheduledTask -TaskName BrainSearchReindex -ErrorAction SilentlyContinue) { throw 'the old BrainSearchReindex task is still there' }
          if ([IO.File]::ReadAllText("$H\Documents\Brain\Journal\lighthouse.md") -ne $note) { throw 'a note changed' }
          $q = (& "$H\.local\bin\gbq.cmd" query "lighthouse keeper storm") -join "`n"
          if ($q -notmatch '(?i)lighthouse' -or $q -match '#chunk') { throw 'gbrain lost the note on a second run' }
          $j = Get-Content "$env:USERPROFILE\.claude\settings.json" -Raw | ConvertFrom-Json
          $all = @(@($j.hooks.UserPromptSubmit.hooks) + @($j.hooks.Stop.hooks) + @($j.hooks.SessionStart.hooks))
          foreach ($h in 'correction-detector', 'session-logger', 'session-indexer', 'session-recap', 'gbrain-update-check', 'controle-sessionstart') {
            $n = @($all | Where-Object { "$($_.command) $($_.args)" -like "*$h.py*" }).Count
            if ($n -ne 1) { throw "$h wired $n times after a second run" }
          }
          $m = @(Select-String -Path "$env:USERPROFILE\.claude\CLAUDE.md" -SimpleMatch '<!-- brain-in-a-box -->').Count
          if ($m -ne 1) { throw "CLAUDE.md marker found $m times after a second run" }
          if ((Get-Content "$env:USERPROFILE\.brain-search\engine").Trim() -ne 'gbrain') { throw 'a second run left gbrain' }
          $n = @((& "$env:USERPROFILE\.bun\bin\gbrain.exe" sources list) | Select-String '^\s+vault\s').Count
          if ($n -ne 1) { throw "vault source listed $n times after a second run" }

      - name: One-liner mode (irm | iex) under the Restricted policy of a fresh PC
        run: |
          Unregister-ScheduledTask -TaskName BrainNightly, BrainReflection -Confirm:$false
          git archive --format=zip --prefix=brain-in-a-box-master/ -o "$env:RUNNER_TEMP\src.zip" HEAD
          $env:BIAB_ARCHIVE = "$env:RUNNER_TEMP\src.zip"
          $env:BRAIN_DIR = "$env:RUNNER_TEMP\Brain2"
          powershell -NoProfile -ExecutionPolicy Restricted -Command "Get-Content -Raw '$PWD\install.ps1' | Invoke-Expression"
          if ($LASTEXITCODE) { exit 1 }
          if (-not (Test-Path "$env:USERPROFILE\.brain-in-a-box\src\vault-skeleton")) { throw 'sources not unpacked' }
          if (-not (Test-Path "$env:RUNNER_TEMP\Brain2\Profile")) { throw 'vault not created in BRAIN_DIR' }
          Get-ScheduledTask -TaskName BrainNightly, BrainReflection | Format-Table TaskName, State

      - name: A Voyage key added later turns on search by meaning (fake Voyage, no secret)
        run: |
          $H = $env:USERPROFILE
          $py = (@((Get-Content "$H\.claude\settings.json" -Raw | ConvertFrom-Json).hooks.UserPromptSubmit.hooks)[0]).command
          $flog = "$env:RUNNER_TEMP\fake-voyage.log"
          Start-Process $py -ArgumentList @('-I', "$PWD\.github\ci\fake_voyage.py", '8899') -RedirectStandardOutput $flog -RedirectStandardError "$flog.err"
          Start-Sleep -Seconds 2
          # What a proxy setup looks like: gbrain, and the installer's key check, go to the stand-in.
          $cfgPath = "$H\.gbrain\config.json"
          'import json,sys; p=sys.argv[1]; d=json.load(open(p)); d["provider_base_urls"]={"voyage":"http://127.0.0.1:8899/v1"}; json.dump(d,open(p,"w"),indent=2)' | Set-Content "$env:RUNNER_TEMP\base.py" -Encoding ascii
          & $py -I "$env:RUNNER_TEMP\base.py" $cfgPath
          $env:VOYAGE_API_KEY = 'ci-fake-key-not-a-secret'
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File install.ps1 *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\install-voyage.txt"
          if ($LASTEXITCODE) { exit 1 }
          Remove-Item Env:VOYAGE_API_KEY
          $out = Get-Content "$env:RUNNER_TEMP\install-voyage.txt" -Raw
          if ($out -notmatch 'cle acceptee par Voyage') { throw 'the key check did not pass against the stand-in' }
          if ($out -notmatch 'recherche par le sens') { throw 'the brain did not move to search by meaning' }
          foreach ($f in "$env:RUNNER_TEMP\install-voyage.txt", "$H\.brain-in-a-box\install.log", "$H\.gbrain\nightly.log") {
            if (Select-String -Path $f -SimpleMatch 'ci-fake-key' -Quiet) { throw "the key leaked into $f" }
          }
          $cfg = Get-Content $cfgPath -Raw | ConvertFrom-Json
          if ($cfg.embedding_model -ne 'voyage:voyage-4') { throw "embedding_model: $($cfg.embedding_model)" }
          if ($cfg.voyage_api_key -ne 'ci-fake-key-not-a-secret') { throw 'key not stored in config.json' }
          $gb = "$H\.bun\bin\gbrain.exe"
          $rr = (& $gb config get search.reranker.model) -join ''
          if ($rr -notmatch 'rerank-3-lite') { throw "reranker: $rr" }
          $stats = (& $gb stats) -join "`n"; $stats
          $emb = [regex]::Match($stats, 'Embedded:\s+(\d+)').Groups[1].Value
          if (-not $emb -or [int]$emb -lt 3) { throw "only '$emb' chunks embedded" }
          $before = @(Select-String -Path $flog -Pattern 'embeddings n=').Count
          $q = (& "$H\.local\bin\gbq.cmd" query "storm keeper lamp") -join "`n"; $q
          if ($q -notmatch '(?i)lighthouse') { throw 'query by meaning missed the lighthouse note' }
          $after = @(Select-String -Path $flog -Pattern 'embeddings n=').Count
          Get-Content $flog
          if ($after -le $before) { throw 'the query was not embedded (no vector search)' }

      - name: Fallback - gbrain gone or impossible to install, keyword search stays
        run: |
          $H = $env:USERPROFILE
          # gbrain removed behind the installer's back: gbq answers from the keyword index.
          Rename-Item "$H\.bun\bin\gbrain.exe" gbrain.exe.off
          $q = (& "$H\.local\bin\gbq.cmd" query "lighthouse keeper storm" 2>&1) -join "`n"; $q
          if ($LASTEXITCODE -or $q -notmatch 'lighthouse.md#chunk') { throw 'no keyword fallback with gbrain missing' }
          # A re-run that cannot install gbrain (its folder is not a gbrain clone): the install still
          # succeeds, in keyword mode, and the nightly keeps the keyword index fresh.
          Rename-Item "$H\DEV\gbrain" gbrain.off
          New-Item -ItemType Directory "$H\DEV\gbrain" | Out-Null
          Set-Content "$H\DEV\gbrain\notes.txt" 'not gbrain'
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File install.ps1
          if ($LASTEXITCODE) { exit 1 }
          if ((Get-Content "$H\.brain-search\engine").Trim() -ne 'brain_search') { throw 'engine is not brain_search after a failed gbrain install' }
          & "$H\.local\bin\gbq.cmd" sync; if ($LASTEXITCODE) { throw 'gbq sync (reindex) failed in fallback mode' }
          $q = (& "$H\.local\bin\gbq.cmd" query "lighthouse keeper storm") -join "`n"; $q
          if ($LASTEXITCODE -or $q -notmatch 'lighthouse.md#chunk') { throw 'gbq.cmd query failed in fallback mode' }
          Start-ScheduledTask -TaskName BrainNightly
          Start-Sleep -Seconds 3
          $sw = [Diagnostics.Stopwatch]::StartNew()
          while ((Get-ScheduledTask -TaskName BrainNightly).State -eq 'Running' -and $sw.Elapsed.TotalSeconds -lt 300) { Start-Sleep -Seconds 2 }
          if ((Get-ScheduledTaskInfo -TaskName BrainNightly).LastTaskResult -ne 0) { throw 'nightly failed in fallback mode' }
          Get-Content "$H\.gbrain\nightly.log" -Tail 6

      # A gbrain the nightly moved past the pin stays where it is: its brain may already be
      # migrated. merge-base cannot see that on the shallow clone, the version guard does.
      - name: A re-install never moves gbrain back down to the pin
        run: |
          $H = $env:USERPROFILE
          $G = "$H\DEV\gbrain"
          Remove-Item -Recurse -Force $G
          Rename-Item "$G.off" gbrain
          $pin = Get-Content engine\gbrain-pin.json -Raw | ConvertFrom-Json
          $pv = [version]$pin.tag.TrimStart('v')
          $url = 'https://github.com/garrytan/gbrain.git'
          $newer = @(git ls-remote --tags --refs $url 'refs/tags/v*' | ForEach-Object {
              $tag = ($_ -split "`t")[1] -replace '^refs/tags/', ''
              if ($tag -match '^v(\d+\.\d+\.\d+(\.\d+)?)$') { [pscustomobject]@{ tag = $tag; v = [version]$Matches[1] } }
            } | Where-Object { $_.v -gt $pv } | Sort-Object v)
          if (-not $newer.Count) { Write-Host "::warning::no gbrain release above $($pin.tag) yet: nothing to check"; exit 0 }
          $tag = $newer[0].tag
          git -C $G -c credential.helper= fetch -q --depth 1 $url "refs/tags/${tag}:refs/tags/${tag}"
          if ($LASTEXITCODE) { throw "fetch of $tag failed" }
          git -C $G -c advice.detachedHead=false checkout -q --detach $tag
          if ($LASTEXITCODE) { throw "checkout of $tag failed" }
          $head = (git -C $G rev-parse HEAD).Trim()
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File install.ps1 *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\install-newer.txt"
          if ($LASTEXITCODE) { exit 1 }
          if ((git -C $G rev-parse HEAD).Trim() -ne $head) { throw "the installer moved gbrain from $tag back to $($pin.tag)" }
          if ((Get-Content "$env:RUNNER_TEMP\install-newer.txt" -Raw) -notmatch 'gbrain deja a jour \(v') { throw "the installer did not see gbrain is past the pin" }
