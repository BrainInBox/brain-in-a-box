name: tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  hooks:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run test-hooks.sh (hooks + gbrain self-update + YAML frontmatter validation)
        run: bash test-hooks.sh

      # Each script is parsed by the shell its shebang names: the zsh scripts
      # used to be checked with bash, and new scripts were easy to forget.
      - name: Syntax-check every script with its own shell
        run: |
          for f in *.sh engine/nightly/*.sh engine/bin/gbq; do
            sh=$(head -1 "$f" | sed -E 's@^#! *@@; s@^/usr/bin/env +@@; s@^.*/@@; s@ .*@@')
            echo "$sh -n $f" && "$sh" -n "$f"
          done

      - name: Compile the Python hooks and search
        run: python3 -m py_compile engine/hooks/*.py engine/search/*.py

      - name: launchd templates are well-formed plists
        run: for f in engine/nightly/*.plist.template; do plutil -lint "$f"; done
