name: tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Read only, whatever the repository's default is: these jobs run third-party installers.
permissions:
  contents: read

jobs:
  hooks:
    runs-on: macos-latest
    # The hooks and the whole Python suite: 9 to 10 minutes on the runner since phase 5.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # test-hooks.sh, section 16, compares install.sh with master's.
      - name: Master, for test-hooks.sh to compare install.sh with
        run: git fetch --no-tags --depth 1 origin +refs/heads/master:refs/remotes/origin/master

      - name: Run test-hooks.sh (hooks + gbrain self-update + YAML frontmatter validation)
        run: bash test-hooks.sh

      - name: Unit tests (engine/tests; the 7-day gbrain update against a local repository and fake Bun)
        run: python3 -I -m unittest discover -s engine/tests -v

      - name: install.ps1's Codex functions against stand-ins (pwsh)
        run: pwsh -NoProfile -File .github/ci/install-ps1-codex.ps1

      - name: "install.ps1 when winget cannot: its source updated, then the official installers, checked (pwsh)"
        run: pwsh -NoProfile -File .github/ci/install-ps1-secours.ps1

      - name: "install.ps1's stops say their cause, winget for all accounts on an administrator's only, Bun without Git (pwsh)"
        run: pwsh -NoProfile -File .github/ci/install-ps1-arrets.ps1

      # Each script is parsed by the shell its shebang names: the zsh scripts
      # used to be checked with bash, and new scripts were easy to forget.
      # The nightly scripts and gbq also by zsh: launchd starts the nightly with /bin/zsh,
      # systemd and cron with bash (test-hooks.sh runs the nightly under both).
      - name: Syntax-check every script with its own shell
        run: |
          for f in *.sh engine/nightly/*.sh engine/bin/* skills/*/scripts/*.sh; do
            sh=$(head -1 "$f" | sed -E 's@^#! *@@; s@^/usr/bin/env +@@; s@^.*/@@; s@ .*@@')
            echo "$sh -n $f" && "$sh" -n "$f"
          done
          for f in engine/nightly/*.sh engine/bin/gbq; do echo "zsh -n $f" && zsh -n "$f"; done

      - name: Compile the Python hooks, search, Windows nightly, unit tests and CI helpers
        run: python3 -m py_compile engine/*.py engine/hooks/*.py engine/search/*.py engine/nightly/*.py engine/tests/*.py .github/ci/*.py

      - name: launchd templates are well-formed plists
        run: for f in engine/nightly/*.plist.template; do plutil -lint "$f"; done

  # The kit on Linux (ubuntu-latest: Ubuntu 24.04), installed with no terminal, as an app or a
  # script runs it: no question, so nothing as root. A CI runner has no session for the user's
  # systemd, like a container or a WSL without systemd: the first run schedules through cron.
  # Lingering on (the command the installer printed), the second moves to systemd --user timers
  # and drops the cron lines; a third, over a hook and a timer the user changed, keeps them. The
  # nightly runs as cron starts it, then as systemd does; Obsidian's line, pasted, installs the
  # pinned .deb. No secret: a Voyage key Voyage refuses.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Syntax of every script with bash, shellcheck, the systemd units
        run: |
          for f in *.sh engine/nightly/*.sh engine/bin/* skills/*/scripts/*.sh; do
            sh=$(head -1 "$f" | sed -E 's@^#! *@@; s@^/usr/bin/env +@@; s@^.*/@@; s@ .*@@')
            if [ "$sh" = zsh ]; then echo "::error::$f needs zsh, which Linux often lacks"; exit 1; fi
            echo "$sh -n $f" && "$sh" -n "$f"
          done
          shellcheck -S warning install.sh engine/nightly/*.sh engine/bin/* .github/ci/*.sh try-it-locally.sh setup-company.sh
          # test-hooks.sh sets variables that functions taken from install.sh read.
          shellcheck -S warning -e SC2034 test-hooks.sh
          systemd-analyze verify engine/nightly/systemd/*.service engine/nightly/systemd/*.timer

      - name: Master, for test-hooks.sh to compare install.sh with
        run: git fetch --no-tags --depth 1 origin +refs/heads/master:refs/remotes/origin/master

      - name: "Run test-hooks.sh (no zsh on this runner: the nightly under bash)"
        run: bash test-hooks.sh

      - name: Unit tests (engine/tests)
        run: python3 -I -m unittest discover -s engine/tests -v

      - name: install.ps1's Codex functions against stand-ins (pwsh)
        run: pwsh -NoProfile -File .github/ci/install-ps1-codex.ps1

      - name: "install.ps1 when winget cannot: its source updated, then the official installers, checked (pwsh)"
        run: pwsh -NoProfile -File .github/ci/install-ps1-secours.ps1

      - name: "install.ps1's stops say their cause, winget for all accounts on an administrator's only, Bun without Git (pwsh)"
        run: pwsh -NoProfile -File .github/ci/install-ps1-arrets.ps1

      # As on a server a script reaches: no session for the user's systemd (a runner may keep one
      # lingering), and cron, which every Ubuntu has.
      - name: No session for the user's systemd, cron there
        run: |
          if [ -e "/var/lib/systemd/linger/$USER" ]; then sudo loginctl disable-linger "$USER"; fi
          if XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user show-environment >/dev/null 2>&1; then
            sudo systemctl stop "user@$(id -u).service"
          fi
          if XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user show-environment >/dev/null 2>&1; then
            echo "::error::the user's systemd still answers"; exit 1
          fi
          command -v crontab >/dev/null || sudo apt-get install -y cron

      - name: Fresh install, no terminal, a Voyage key Voyage refuses
        env:
          VOYAGE_API_KEY: pa-ci-refused-not-a-secret
        run: |
          ./install.sh </dev/null 2>&1 | tee "$RUNNER_TEMP/install-1.txt"
          [ "${PIPESTATUS[0]}" = 0 ] || exit 1
          grep -q "Voyage did not accept this key" "$RUNNER_TEMP/install-1.txt" || { echo "::error::a refused key was not reported"; exit 1; }
          for f in "$RUNNER_TEMP/install-1.txt" ~/.brain-in-a-box/install.log ~/.gbrain/config.json; do
            if grep -q pa-ci-refused "$f"; then echo "::error::the key leaked into $f"; exit 1; fi
          done
          grep -q "cron, as systemd does not run for your user here" "$RUNNER_TEMP/install-1.txt" \
            || { echo "::error::no cron fallback without a session for the user's systemd"; exit 1; }

      - name: The install did what it says
        run: |
          set -e
          H=$HOME
          python3 - "$H" <<'PY'
          import json, sys
          h = sys.argv[1]
          s = json.load(open(h + "/.claude/settings.json", encoding="utf-8"))
          want = {"UserPromptSubmit": ["correction-detector.py"], "SessionStart": ["gbrain-update-check.py", "controle-sessionstart.py"],
                  "Stop": ["session-logger.py", "session-indexer.py", "session-recap.py"]}
          for event, names in want.items():
              cmds = [x["command"] for g in s["hooks"][event] for x in g["hooks"]]
              for n in names:
                  assert cmds.count(h + "/.claude/hooks/brain/" + n) == 1, (event, n, cmds)
          PY
          for f in engine/hooks/*.py; do cmp "$f" "$H/.claude/hooks/brain/$(basename "$f")"; done
          for f in gbrain-nightly.sh gbrain-lint.sh gbrain-selfupdate.sh gbrain-sync-vault.py; do cmp "engine/nightly/$f" "$H/.claude/hooks/brain/$f"; done
          test -x "$H/.local/bin/gbq"
          test -x "$H/.local/bin/controle"
          test -x "$H/.local/bin/claude"
          head -1 "$H/.local/bin/gbq" | grep -qx '#!/usr/bin/env bash'
          [ "$(grep -c '<!-- brain-in-a-box -->' "$H/.claude/CLAUDE.md")" = 1 ]
          for sk in skills/*/; do test -f "$H/.claude/skills/$(basename "$sk")/SKILL.md"; done
          test -d "$H/Documents/Brain/Profile"
          test -d "$H/Documents/Brain/.git"
          [ "$(git -C "$H/DEV/gbrain" rev-parse HEAD)" = "$(python3 -c 'import json; print(json.load(open("engine/gbrain-pin.json"))["sha"])')" ]
          [ "$("$H/.bun/bin/bun" --version)" = "$(python3 -c 'import json; print(json.load(open("engine/gbrain-pin.json"))["bun"])')" ]
          crontab -l | tee "$RUNNER_TEMP/crontab-1.txt"
          [ "$(grep -c '^# >>> brain-in-a-box' "$RUNNER_TEMP/crontab-1.txt")" = 1 ]
          # shellcheck disable=SC2016  # $HOME stays as written: cron's shell expands it
          for want in '0 4 * * * /bin/bash "$HOME/.claude/hooks/brain/gbrain-nightly.sh"' \
                      '0 12,23 * * * /usr/bin/env python3 "$HOME/.claude/hooks/brain/daily-reflection.py"' \
                      '0 8 * * 1 /bin/bash "$HOME/.claude/hooks/brain/gbrain-lint.sh"'; do
            grep -qF -- "$want" "$RUNNER_TEMP/crontab-1.txt"
          done
          test ! -e "$H/.config/systemd/user/gbrain-nightly.timer"
          out=$("$H/.local/bin/gbq" query "captured corrections"); echo "$out"; echo "$out" | grep -qi 'profile/lessons'
          "$H/.local/bin/controle" --help | grep -q annuler
          "$H/.local/bin/controle" statut
          # shellcheck disable=SC2016  # the Obsidian line is matched as printed, $(...) included
          grep -q 'd=$(mktemp -d) && curl -fL -o "$d/obsidian.deb" https://github.com/obsidianmd/obsidian-releases/' "$RUNNER_TEMP/install-1.txt"
          # Nothing chosen: Claude alone, as before there was a choice, and no file says so.
          test ! -e "$H/.brain-in-a-box/agents.json"
          if grep -q 'AI agents' "$RUNNER_TEMP/install-1.txt"; then echo "::error::a line about agents with nothing chosen"; exit 1; fi

      # What the importer-memoire skill runs, on synthetic exports (engine/tests/import_fixtures.py): an
      # export read and its plan announced, no AI asked (no token on this job). Its state goes after.
      - name: importer-memoire reads an export and says what would leave, no AI asked
        run: |
          set -e
          python3 -I engine/tests/import_fixtures.py "$RUNNER_TEMP/fx"
          test -x ~/.local/bin/importer-memoire
          out=$(~/.local/bin/importer-memoire --help) && grep -q preparer <<< "$out"
          ~/.local/bin/importer-memoire preparer "$RUNNER_TEMP/fx/chatgpt-2026.zip" --json | tee "$RUNNER_TEMP/plan.jsonl"
          id=$(python3 -c 'import json, sys; d = [json.loads(l) for l in open(sys.argv[1])][-1]["plan"]; assert (d["source"], d["conversations"]) == ("chatgpt", 150), d; print(d["id"])' "$RUNNER_TEMP/plan.jsonl")
          ~/.local/bin/importer-memoire estimer "$id" --appels 1 | tee "$RUNNER_TEMP/estimate.txt"
          grep -q "Ce qui part : vers Claude seulement" "$RUNNER_TEMP/estimate.txt"
          out=$(~/.local/bin/importer-memoire preparer --fichier "$RUNNER_TEMP/fx/collage.txt") && grep -q "Réponse collée lue" <<< "$out"
          ~/.local/bin/importer-memoire statut
          rm -rf ~/.brain-in-a-box/import

      # Codex runs gbq query and gbq search without asking, outside its sandbox, from a session's folder,
      # where the session may write a bunfig.toml whose preload Bun runs before gbrain.
      - name: gbq's reads start gbrain from /, so a folder's bunfig.toml never runs (the real Bun and gbrain)
        run: |
          d=$(mktemp -d); cd "$d"
          printf 'preload = ["./x.ts"]\n' > bunfig.toml
          printf 'require("fs").writeFileSync("%s/witness", "ran\\n");\n' "$d" > x.ts
          # The control: gbrain started from this folder, Bun on the PATH as gbq puts it (gbrain is a bun script).
          out=$(PATH="$HOME/.bun/bin:$PATH" ~/.bun/bin/gbrain --version 2>&1) || true
          [ -f witness ] || { echo "$out"; echo "::error::control: gbrain started from this folder did not run its preload, so this step proves nothing"; exit 1; }
          rm witness
          for c in query search; do
            out=$(~/.local/bin/gbq "$c" "captured corrections" 2>&1); echo "$out"
            [ ! -e witness ] || { echo "::error::gbq $c ran the folder's preload"; exit 1; }
            echo "$out" | grep -qi 'lessons' || { echo "::error::gbq $c from / found nothing"; exit 1; }
          done

      - name: Codex is refused on this system (option or BIAB_AGENTS), before anything changes
        run: |
          snap() { sha256sum ~/.claude/settings.json ~/.claude/CLAUDE.md ~/.brain-in-a-box/installed.json ~/.brain-in-a-box/install.log; }
          before=$(snap)
          for agents in codex claude,codex; do
            if ./install.sh --agents "$agents" </dev/null > "$RUNNER_TEMP/refused.txt" 2>&1; then echo "::error::--agents $agents went on"; exit 1; fi
            cat "$RUNNER_TEMP/refused.txt"
            grep -q "Codex is coming soon on this system" "$RUNNER_TEMP/refused.txt"
          done
          if BIAB_AGENTS=codex ./install.sh </dev/null > "$RUNNER_TEMP/refused.txt" 2>&1; then echo "::error::BIAB_AGENTS=codex went on"; exit 1; fi
          grep -q "Codex is coming soon on this system" "$RUNNER_TEMP/refused.txt"
          test ! -e ~/.brain-in-a-box/agents.json
          [ "$(snap)" = "$before" ] || { echo "::error::a refused choice changed the install"; exit 1; }

      - name: The nightly as cron starts it (its line, cron's bare environment) commits and indexes today's note
        run: |
          printf '# The lighthouse\n\nThe keeper logs every storm and repairs the lamp lens before winter.\n' > ~/Documents/Brain/Journal/lighthouse.md
          # The update step runs for real but paused: whether a release is 7 days old today depends on upstream.
          python3 -c 'import datetime as d, json, os; json.dump({"pause_jusqua": (d.datetime.now(d.timezone.utc) + d.timedelta(days=2)).strftime("%Y-%m-%dT%H:%M:%SZ")}, open(os.path.expanduser("~/.gbrain/update-state.json"), "w"))'
          line=$(crontab -l | grep 'gbrain-nightly.sh' | cut -d' ' -f6-)
          env -i HOME="$HOME" LOGNAME="$USER" USER="$USER" SHELL=/bin/sh PATH=/usr/bin:/bin /bin/sh -c "$line"
          cat ~/.gbrain/nightly.log
          grep -q '^\[controle\] exit 0$' ~/.gbrain/nightly.log
          grep -q 'nightly done' ~/.gbrain/nightly.log
          git -C ~/Documents/Brain log -1 --format=%s -- Journal/lighthouse.md | grep -q '^nightly '
          out=$(~/.local/bin/gbq query "lighthouse keeper storm"); echo "$out"; echo "$out" | grep -qi lighthouse

      - name: Lingering on (the command the installer printed), a second run moves to systemd --user timers
        run: |
          grep -o 'loginctl enable-linger [a-z0-9_-]*' "$RUNNER_TEMP/install-1.txt" | head -1 | tee "$RUNNER_TEMP/linger.txt" || true
          sudo loginctl enable-linger "$USER"
          for _ in $(seq 1 20); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          # The steps after this one reach the user's systemd too (a CI step has no session).
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          ./install.sh </dev/null 2>&1 | tee "$RUNNER_TEMP/install-2.txt"
          [ "${PIPESTATUS[0]}" = 0 ] || exit 1
          grep -q "systemd --user timers on" "$RUNNER_TEMP/install-2.txt"
          grep -q "lingering is on" "$RUNNER_TEMP/install-2.txt"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"; export XDG_RUNTIME_DIR
          for t in gbrain-nightly brain-reflection gbrain-lint; do
            [ "$(systemctl --user is-enabled "$t.timer")" = enabled ]
            [ "$(systemctl --user is-active "$t.timer")" = active ]
            cmp "engine/nightly/systemd/$t.timer" ~/.config/systemd/user/"$t.timer"
            cmp "engine/nightly/systemd/$t.service" ~/.config/systemd/user/"$t.service"
          done
          systemctl --user list-timers --all --no-pager
          if crontab -l 2>/dev/null | grep -q 'brain-in-a-box'; then echo "::error::the cron lines are still there beside the timers"; exit 1; fi

      - name: The nightly started by systemd --user
        run: |
          before=$(grep -c 'nightly done' ~/.gbrain/nightly.log)
          systemctl --user start gbrain-nightly.service
          systemctl --user show -p Result -p ExecMainStatus gbrain-nightly.service | tee "$RUNNER_TEMP/service.txt"
          grep -qx 'Result=success' "$RUNNER_TEMP/service.txt"
          grep -qx 'ExecMainStatus=0' "$RUNNER_TEMP/service.txt"
          [ "$(grep -c 'nightly done' ~/.gbrain/nightly.log)" -gt "$before" ]
          tail -15 ~/.gbrain/nightly.log

      - name: Obsidian's line, pasted as printed, installs the pinned .deb
        run: |
          # shellcheck disable=SC2016  # the line is found as printed, $(...) included
          line=$(grep -o 'd=$(mktemp -d) && curl .*' "$RUNNER_TEMP/install-1.txt" | head -1)
          echo "$line"
          bash -c "$line"
          test -x /opt/Obsidian/obsidian
          dpkg -s obsidian | grep -q '^Version: 1.14.4'

      - name: A third run changes nothing but says so, and keeps a hook and a timer the user changed
        run: |
          H=$HOME
          echo '# adapted on this machine' >> "$H/.claude/hooks/brain/session-logger.py"
          sed -i 's/^OnCalendar=\*-\*-\* 04:00:00$/OnCalendar=*-*-* 05:30:00/' "$H/.config/systemd/user/gbrain-nightly.timer"
          python3 -c 'import json, os; p = os.path.expanduser("~/.claude/settings.json"); d = json.load(open(p)); d["mine"] = "kept"; json.dump(d, open(p, "w"), indent=2)'
          cp "$H/.brain-in-a-box/installed.json" "$RUNNER_TEMP/installed-before.json"
          note=$(sha256sum "$H/Documents/Brain/Journal/lighthouse.md")
          ./install.sh </dev/null 2>&1 | tee "$RUNNER_TEMP/install-3.txt"
          [ "${PIPESTATUS[0]}" = 0 ] || exit 1
          grep -q "Kept as you changed them: session-logger.py gbrain-nightly.timer" "$RUNNER_TEMP/install-3.txt"
          grep -q "adapted on this machine" "$H/.claude/hooks/brain/session-logger.py"
          cmp engine/hooks/session-logger.py "$H/.brain-in-a-box/pending/session-logger.py"
          grep -qx 'OnCalendar=\*-\*-\* 05:30:00' "$H/.config/systemd/user/gbrain-nightly.timer"
          cmp engine/nightly/systemd/gbrain-nightly.timer "$H/.brain-in-a-box/pending/gbrain-nightly.timer"
          cmp "$RUNNER_TEMP/installed-before.json" "$H/.brain-in-a-box/installed.json"
          test ! -d "$H/.brain-in-a-box/backups"
          [ "$(sha256sum "$H/Documents/Brain/Journal/lighthouse.md")" = "$note" ]
          [ "$(python3 -c 'import json, os; print(json.load(open(os.path.expanduser("~/.claude/settings.json"))).get("mine"))')" = kept ]
          grep -q "Obsidian already installed" "$RUNNER_TEMP/install-3.txt"
          grep -q "Claude Code already installed" "$RUNNER_TEMP/install-3.txt"
          [ "$(grep -c '<!-- brain-in-a-box -->' "$H/.claude/CLAUDE.md")" = 1 ]
          test ! -e "$H/.brain-in-a-box/agents.json"
          [ "$(systemctl --user show -p NextElapseUSecRealtime --value gbrain-nightly.timer | grep -c '05:30')" = 1 ]

      - name: The 7-day gbrain update, dry run against the real GitHub (reads, decides, changes nothing)
        run: |
          head=$(git -C ~/DEV/gbrain rev-parse HEAD)
          snap() { for f in update-state.json last-update.json update.lock; do p=~/.gbrain/$f; if [ -e "$p" ]; then echo "$f $(sha256sum < "$p")"; else echo "$f -"; fi; done; }
          before=$(snap)
          out=$(python3 -I ~/.claude/hooks/brain/gbrain_update.py --a-blanc 2>&1); echo "$out"
          echo "$out" | grep -q 'tags v\* en amont : [1-9]'
          echo "$out" | grep -q 'cision : '
          [ "$(git -C ~/DEV/gbrain rev-parse HEAD)" = "$head" ]
          [ "$(snap)" = "$before" ]

  # The app's own Windows jobs (25 minutes) run when the app, install.ps1, this workflow or its
  # helpers change, and on every push to master. A skipped job counts as passed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
      codex: ${{ steps.diff.outputs.codex }}
      winget: ${{ steps.diff.outputs.winget }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then printf 'app=true\ncodex=true\nwinget=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          # The pull request's merge commit: its first parent is master.
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          if grep -qE '^(app/|install\.ps1$|engine/hooks/_agents\.py$|\.github/workflows/test\.yml$|\.github/ci/)' <<< "$files"; then app=true; else app=false; fi
          echo "app=$app" | tee -a "$GITHUB_OUTPUT"
          if grep -qE '^(engine/hooks/(_headless(_codex|_claude)?|_agents|_codex_rollout|_controle_judge|daily-reflection|session-recap|session-logger|correction-detector|controle-sessionstart)\.py|engine/codex-features\.json|engine/tests/(codex_mock|mock_openai|codex_captures)\.py|\.github/workflows/test\.yml|install\.sh|install\.ps1|engine/codex/[^/]+|engine/CLAUDE\.global\.template\.md|engine/install_skills\.py|skills/[^/]+/SKILL\.md)$' <<< "$files"; then codex=true; else codex=false; fi
          echo "codex=$codex" | tee -a "$GITHUB_OUTPUT"
          if grep -qE '^(install\.ps1|\.github/workflows/test\.yml|\.github/ci/(poste-neuf|sans-git|winget-casse|install-ps1-secours|install-ps1-arrets)\.ps1)$' <<< "$files"; then winget=true; else winget=false; fi
          echo "winget=$winget" | tee -a "$GITHUB_OUTPUT"

  # The launcher without tools for Codex (engine/hooks/_headless_codex.py) with the real Codex CLI,
  # pinned, in ChatGPT mode against a local fake server (engine/tests/mock_openai.py): fake tokens,
  # no account, no secret (docs/proposals/codex.md, §5.2). Forced tool calls refused, tools
  # announced, URLs, the caller's keys, a system config and requirements.toml, the user's MCP server;
  # then the reflection's and the review's questions through the choice of engine (_headless.py); then
  # a session the real Codex keeps, read as the reflection and Codex's Stop hook read it (_codex_rollout.py);
  # then the kit's hooks run by the real Codex from a hooks.json (--agent codex): their answers taken;
  # then install.sh (macOS, Linux) or install.ps1 (Windows) with Codex chosen: Codex from its pinned
  # installer, and the real Codex running the hooks the installer wired and approved (no trust bypassed);
  # on Windows, a %ProgramData%\OpenAI\Codex other accounts could change pauses Codex.
  codex-mock:
    name: codex-mock (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.codex == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CODEX_RELEASE: "0.162.1"
      CODEX_NON_INTERACTIVE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The installer of Codex's release, as install.sh and install.ps1 take it, checked against the
      # SHA-256 they pin (chatgpt.com/codex/install.sh and .ps1 answer 404 since 2026-10-22).
      - name: Codex 0.162.1 from the official installer (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL --retry 2 "https://github.com/openai/codex/releases/download/rust-v$CODEX_RELEASE/install.sh" -o "$RUNNER_TEMP/codex-install.sh"
          want=$(sed -n 's/^CODEX_INSTALLER_SHA256=\([0-9a-f]\{64\}\)$/\1/p' install.sh)
          echo "$want  $RUNNER_TEMP/codex-install.sh" | shasum -a 256 -c -
          sh "$RUNNER_TEMP/codex-install.sh"
          [ "$("$HOME/.local/bin/codex" --version)" = "codex-cli $CODEX_RELEASE" ]

      - name: Codex 0.162.1 from the official installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $f = Join-Path $env:RUNNER_TEMP 'codex-install.ps1'
          Invoke-WebRequest -Uri "https://github.com/openai/codex/releases/download/rust-v$env:CODEX_RELEASE/install.ps1" -OutFile $f -UseBasicParsing
          $want = [regex]::Match((Get-Content -Raw install.ps1), '(?m)^\$CODEX_INSTALLER_SHA256 = "([0-9a-f]{64})"').Groups[1].Value
          $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $f).Hash.ToLowerInvariant()
          if (-not $want -or $got -ne $want) { throw "Codex's installer: SHA-256 $got, install.ps1 pins $want" }
          powershell -NoProfile -ExecutionPolicy Bypass -File $f
          if ($LASTEXITCODE) { exit 1 }
          $v = & (Join-Path $env:LOCALAPPDATA 'Programs\OpenAI\Codex\bin\codex.exe') --version
          if ($v -ne "codex-cli $env:CODEX_RELEASE") { throw "codex --version said: $v" }

      - name: The launcher with the real Codex against the fake server
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then PY=python; else PY=python3; fi
          "$PY" -I engine/tests/codex_mock.py

  # The installer app, on a Mac, on Windows and on Linux (Ubuntu 24.04): diagnosis, install
  # steps, Voyage key check, command runner. (Real downloads are #[ignore] tests, run by hand.)
  app:
    name: app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # WebKitGTK and GTK, from Ubuntu's archive, to build the window against.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libssl-dev libxdo-dev
      - name: Rust tests
        run: cargo test --locked
      # The app's Codex step for real (steps.rs): OpenAI's official installer of the pinned Codex, checked
      # against the SHA-256 install.sh and install.ps1 pin, run as the step runs it, into a throwaway home.
      - name: The Codex step installs the pinned Codex
        run: cargo test --locked -- --ignored codex_real
      # The guide's capture on the runner's own desktop (capture/win.rs): windows of known colours drawn by
      # a program compiled there (tests/fixtures/guide/atelier.cs), a click in one, Start opened while Bibo
      # waits, a dialog, a protected window, a terminal, a page in the browser. Their pixels are counted in
      # memory; nothing of a user's.
      - name: The guide sees a real desktop's windows (Windows)
        if: runner.os == 'Windows'
        run: cargo test --locked -- --ignored bureau --test-threads=1
      - name: Clippy, warnings are errors
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: The windows' scripts parse
        run: |
          node --check ../src/ui.js
          node --check ../src/app.js
          node --check ../src/guide.js
          node --check ../src/bbrain-commun.js
          node --check ../src/bbrain.js
          node --check ../src/vitre.js
          node --check ../src/bibo.js
      # Every screen of the mock's scenarios with Claude alone, word for word as screens-claude.txt
      # holds them (master's, before Codex), the checks of Codex's screens where the mock opens it, and
      # the guide's screens in paste mode as screens-guide.txt holds them.
      - name: The window's screens with Claude alone, and the guide's, have not changed
        run: node ../dev/screens.mjs

      - name: Without its window, the app examines the PC and says so in JSON
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          $out = (& .\target\debug\brain-in-a-box.exe --diagnose) -join "`n"
          if ($LASTEXITCODE) { throw "--diagnose exited $LASTEXITCODE" }
          $out
          $d = $out | ConvertFrom-Json
          if ($d.os -notlike 'Windows 1*') { throw "os: $($d.os)" }
          $ids = @($d.checks | ForEach-Object { $_.id })
          foreach ($id in 'windows', 'disk', 'network', 'python', 'git', 'bun', 'claude', 'obsidian', 'brain_vault', 'voyage') {
            if ($ids -notcontains $id) { throw "no check $id in $($ids -join ', ')" }
          }
          if ($ids -contains 'clt') { throw 'Apple tools checked on Windows' }
          if (-not $d.can_install) { throw 'a fresh runner cannot install' }
          foreach ($step in @($d.todo)) { if ($step -notin 'claude', 'brain') { throw "unknown step $step" } }
          if ($d.ram_gb -le 0 -or $d.disk_free_gb -le 0) { throw "memory $($d.ram_gb), free $($d.disk_free_gb)" }
          # Bibo's advice, from _conseil.py's rules: Codex is closed, so Claude.
          if ($d.advice.conseil -ne 'claude' -or -not $d.advice.text) { throw "advice: $($d.advice | ConvertTo-Json -Compress)" }

      - name: Without its window, the app examines the Linux machine and says so in JSON
        if: runner.os == 'Linux'
        run: |
          cargo build --locked
          ./target/debug/brain-in-a-box --diagnose | tee "$RUNNER_TEMP/diag.json"
          python3 -I - "$RUNNER_TEMP/diag.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          ids = [c["id"] for c in d["checks"]]
          assert d["os"].startswith("Ubuntu"), d["os"]
          for want in ("linux", "disk", "network", "paquets", "bun", "claude", "obsidian", "brain_vault", "voyage"):
              assert want in ids, (want, ids)
          assert "clt" not in ids and "macos" not in ids, ids
          assert d["can_install"], d["checks"]
          assert set(d["todo"]) <= {"paquets", "claude", "bun", "obsidian", "brain"}, d["todo"]
          assert "paquets" not in d["todo"], "a runner has git, python3, curl and unzip"
          assert d["ram_gb"] > 0 and d["disk_free_gb"] > 0, (d["ram_gb"], d["disk_free_gb"])
          # Bibo's advice, from _conseil.py's rules: Codex is closed, so Claude.
          assert d["advice"]["conseil"] == "claude" and d["advice"]["text"], d.get("advice")
          print("linux:", d["os"], len(ids), "checks, to do:", d["todo"])
          PY

  # The app's own install path on a real Windows, without its window: Claude Code, then the
  # brain (install.ps1 from this commit, no console, no question) on a PC with only the Store's
  # python stub, Documents protected against ransomware and a TEMP every account can write to.
  # Afterwards the app's diagnosis must find nothing left to install. Then the app updates that
  # brain the way it updates one installed before it, and a folder with an accent arrives whole.
  app-windows-install:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build the app
        working-directory: app/src-tauri
        run: cargo build --locked

      - name: Claude Code, then the brain, through the app's steps (Documents protected, TEMP shared)
        run: |
          git archive --format=zip --prefix=brain-in-a-box-master/ -o "$env:RUNNER_TEMP\biab.zip" HEAD
          . .github/ci/poste-neuf.ps1
          # Controlled folder access, as on PCs hardened against ransomware: Documents is closed
          # to the programs Windows does not know. The brain goes to the profile's own folder.
          Set-MpPreference -EnableControlledFolderAccess Enabled
          if ((Get-MpPreference).EnableControlledFolderAccess -ne 1) { throw 'controlled folder access did not turn on' }
          # TEMP as on many company PCs: one folder every account can write to. Nothing of the app's goes there.
          $shared = 'C:\biab-shared-temp'
          New-Item -ItemType Directory $shared -Force | Out-Null
          $env:TMP = $shared; $env:TEMP = $shared
          $env:BIAB_ARCHIVE = "$env:RUNNER_TEMP\biab.zip"
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          foreach ($step in 'claude', 'brain') {
            & app\src-tauri\target\debug\brain-in-a-box.exe --run-step $step *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\step-$step.txt"
            if ($LASTEXITCODE) { throw "the $step step failed" }
          }
          # install.ps1's sections reached the window as progress lines, in order.
          $seen = @(Select-String -Path "$env:RUNNER_TEMP\step-brain.txt" -Pattern '\((\d+) sur 13\)' | ForEach-Object { [int]$_.Matches[0].Groups[1].Value })
          if ($seen.Count -lt 10) { throw "only $($seen.Count) sections announced: $seen" }
          if (($seen -join ',') -ne (($seen | Sort-Object) -join ',')) { throw "sections out of order: $seen" }
          if (-not (Test-Path "$env:USERPROFILE\.brain-in-a-box\tmp")) { throw "the app's work folders were not in the profile" }
          if (-not (Test-Path "$env:USERPROFILE\Brain\Profile")) { throw 'the brain is not in the profile folder' }
          if (Test-Path "$env:USERPROFILE\Documents\Brain") { throw 'the brain went into the protected Documents' }

      - name: The app now finds everything installed, Python from winget past the Store's stub
        run: |
          # The runner's own Python is back on this step's PATH: out again, the stub in front.
          . .github/ci/poste-neuf.ps1
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          # No BRAIN_DIR in this step's environment: the app reads the one install.ps1 saved.
          if ($env:BRAIN_DIR) { throw 'BRAIN_DIR leaked into the step' }
          $d = ((& app\src-tauri\target\debug\brain-in-a-box.exe --diagnose) -join "`n") | ConvertFrom-Json
          $d.checks | Format-Table id, status, detail, path -AutoSize | Out-String -Width 250
          if (@($d.todo).Count) { throw "still to install: $($d.todo -join ', ')" }
          foreach ($id in 'python', 'git', 'bun', 'claude', 'obsidian', 'brain_vault', 'brain_hooks', 'brain_skills', 'brain_memory') {
            $c = $d.checks | Where-Object id -eq $id
            if ($c.status -ne 'ok') { throw "$id is $($c.status): $($c.detail)" }
          }
          $py = ($d.checks | Where-Object id -eq python).path
          if ($py -notlike "$env:LOCALAPPDATA\Programs\Python\*") { throw "the app's Python is $py, not winget's" }
          if (($d.checks | Where-Object id -eq brain_vault).detail -notlike "*$env:USERPROFILE\Brain*") { throw 'the window does not say where the brain is' }
          # Run again, the step has nothing to do.
          $again = (& app\src-tauri\target\debug\brain-in-a-box.exe --run-step brain) -join "`n"; $again
          if ($LASTEXITCODE -or $again -notmatch 'Ton cerveau est d\S+ install') { throw 'a second run did something' }

      - name: A brain installed before the app is updated through it, nothing put back, and an accented folder arrives whole
        run: |
          . .github/ci/poste-neuf.ps1
          $H = $env:USERPROFILE
          # What an install from before installed.json leaves: no manifest (neither the kit's nor
          # the app's guard's), its sources, a hook as those sources had it, and settings.json
          # wired to the Python of that day, the shell form for one hook.
          Remove-Item "$H\.brain-in-a-box\installed.json", "$H\.brain-in-a-box\garde\ecrits.json" -ErrorAction SilentlyContinue
          $hook = "$H\.claude\hooks\brain\correction-detector.py"
          $old = [IO.File]::ReadAllText("$PWD\engine\hooks\correction-detector.py") + "# an older kit version`n"
          foreach ($f in $hook, "$H\.brain-in-a-box\src\engine\hooks\correction-detector.py") { [IO.File]::WriteAllText($f, $old) }
          $sp = "$H\.claude\settings.json"
          $j = Get-Content $sp -Raw | ConvertFrom-Json
          foreach ($entry in @($j.hooks.UserPromptSubmit.hooks)) { $entry.command = 'C:\Python311\python.exe' }
          $logger = @($j.hooks.Stop.hooks) | Where-Object { "$($_.args)" -like '*session-logger.py*' } | Select-Object -First 1
          $logger.command = "`"C:\Python311\python.exe`" `"$($logger.args[0])`""
          $logger.PSObject.Properties.Remove('args')
          [IO.File]::WriteAllText($sp, ($j | ConvertTo-Json -Depth 20))
          # The user turns on search by meaning (a key Voyage refuses, no secret here) and keeps the
          # brain in a folder named with an accent and a space.
          $dir = "$H\H$([char]0xE9)l$([char]0xE8)ne Dupont\Brain"
          $env:BRAIN_DIR = $dir
          $env:VOYAGE_API_KEY = 'pa-ci-refused-not-a-secret'
          $env:BIAB_ARCHIVE = "$env:RUNNER_TEMP\biab.zip"
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          & app\src-tauri\target\debug\brain-in-a-box.exe --run-step brain *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\step-again.txt"
          $code = $LASTEXITCODE
          $out = [IO.File]::ReadAllText("$env:RUNNER_TEMP\step-again.txt")
          if ($out -match 'remis exactement comme avant|pas pu le remettre') { throw 'the configuration guard put files back' }
          if ($code) { throw "the brain step failed on an existing install (exit $code)" }
          # install.ps1's own line, decoded by the app: not the app's sentence, which it writes itself.
          if (-not $out.Contains("=== Brain vault ($dir) ===")) { throw "install.ps1's output lost the accented folder: $(($out -split "`n" | Select-String 'Brain vault') -join ' | ')" }
          if ((Get-FileHash $hook).Hash -ne (Get-FileHash engine\hooks\correction-detector.py).Hash) { throw 'the hook was not updated' }
          $j = Get-Content $sp -Raw | ConvertFrom-Json
          foreach ($pair in @(@('UserPromptSubmit', 'correction-detector'), @('Stop', 'session-logger'))) {
            $w = @(@($j.hooks.($pair[0]).hooks) | Where-Object { "$($_.command) $($_.args)" -like "*$($pair[1]).py*" })
            if ($w.Count -ne 1 -or $w[0].command -notlike "$env:LOCALAPPDATA\Programs\Python\*") { throw "$($pair[1]) wired $($w.Count) times, to $($w.command)" }
          }
          $m = Get-Content "$H\.brain-in-a-box\installed.json" -Raw | ConvertFrom-Json
          if ($m.$hook -ne (Get-FileHash $hook).Hash.ToLower()) { throw "installed.json does not list the hook it wrote: $($m.$hook)" }
          if (-not (Test-Path -LiteralPath "$dir\Profile")) { throw 'no vault in the accented folder' }

  # The Windows installer (NSIS, for the user alone, no administrator), built as release.yml
  # builds it for the GitHub release, installed silently and started. The file people download
  # comes from release.yml only: nothing is uploaded here.
  app-windows-bundle:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tauri CLI
        run: cargo install tauri-cli --version "=2.11.5" --locked
      - name: Build the installer (release.yml's command)
        run: cargo tauri build --ci --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - name: It installs for the user alone, without administrator, and the installed app runs
        run: |
          $exe = @(Get-ChildItem target\x86_64-pc-windows-msvc\release\bundle\nsis\*-setup.exe)
          if ($exe.Count -ne 1) { throw "installers: $($exe.Name -join ', ')" }
          $exe | Format-Table Name, Length
          $p = Start-Process $exe[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode) { throw "the installer exited $($p.ExitCode)" }
          $uninstall = 'Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $mine = @(Get-ChildItem "HKCU:\$uninstall" | Get-ItemProperty | Where-Object DisplayName -eq 'Brain in a Box')
          if ($mine.Count -ne 1) { throw "uninstall entries for the user: $($mine.Count)" }
          $mine | Format-List DisplayName, DisplayVersion, UninstallString
          $all = @(Get-ChildItem "HKLM:\$uninstall", "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue |
            Get-ItemProperty | Where-Object DisplayName -eq 'Brain in a Box')
          if ($all.Count) { throw 'installed for every user of the PC' }
          $uninstaller = $mine[0].UninstallString.Trim('"')
          if ($uninstaller -notlike "$env:LOCALAPPDATA\*") { throw "installed in $uninstaller, outside the user's own programs" }
          $app = @(Get-ChildItem (Split-Path -Parent $uninstaller) -Filter *.exe | Where-Object Name -notlike 'uninstall*')
          if ($app.Count -ne 1) { throw "programs installed: $($app.Name -join ', ')" }
          # The release build has no console: its JSON goes to a file.
          $diag = "$env:RUNNER_TEMP\diag.json"
          $r = Start-Process $app[0].FullName -ArgumentList '--diagnose' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $diag
          if ($r.ExitCode) { throw "--diagnose exited $($r.ExitCode)" }
          $d = [IO.File]::ReadAllText($diag) | ConvertFrom-Json
          if ($d.os -notlike 'Windows 1*' -or @($d.checks).Count -lt 10) { throw "the installed app answered: $(Get-Content $diag -Raw)" }
          "installed app: $($d.os), $(@($d.checks).Count) checks"

  # The Linux packages, built as release.yml builds them (on 22.04, its AppImage tools and runtime
  # pinned): the .deb installs with apt, its dependencies from Ubuntu's archive, and the installed
  # app answers; the AppImage starts with the pinned runtime and answers too, unpacked (a runner may
  # lack FUSE). Both again on Ubuntu 24.04, where most users are. The night's terrain (app-linux)
  # runs the AppImage built the same way in a real window on 24.04.
  app-linux-bundle:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build dependencies, Tauri CLI, the AppImage tools and runtime pinned
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libssl-dev libxdo-dev patchelf file
          bash "$GITHUB_WORKSPACE/.github/ci/appimage-tools.sh"
          cargo install tauri-cli --version "=2.11.5" --locked
      - name: Build the .deb and the AppImage (release.yml's command)
        run: cargo tauri build --ci --target x86_64-unknown-linux-gnu --bundles deb,appimage -- --locked
      - name: The .deb installs and the installed app answers, the AppImage too
        run: |
          shopt -s nullglob
          debs=(target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb)
          images=(target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage)
          [ "${#debs[@]}" -eq 1 ] && [ "${#images[@]}" -eq 1 ] || { echo "::error::packages: ${debs[*]} ${images[*]}"; exit 1; }
          ls -la "${debs[0]}" "${images[0]}"
          bash "$GITHUB_WORKSPACE/.github/ci/appimage-tools.sh" check "${images[0]}"
          dpkg-deb -I "${debs[0]}"
          deps=$(dpkg-deb -f "${debs[0]}" Depends)
          case "$deps" in *libwebkit2gtk-4.1-0*) ;; *) echo "::error::the .deb does not depend on WebKitGTK 4.1: $deps"; exit 1 ;; esac
          sudo apt-get install -y -q "./${debs[0]}"
          test -f "/usr/share/applications/Brain in a Box.desktop"
          grep -qx 'Exec=brain-in-a-box' "/usr/share/applications/Brain in a Box.desktop"
          check='import json, sys; d = json.load(sys.stdin); ids = [c["id"] for c in d["checks"]]; assert "paquets" in ids, ids; print(sys.argv[1], d["os"], len(ids), "checks")'
          brain-in-a-box --diagnose | python3 -I -c "$check" deb
          chmod +x "${images[0]}"
          APPIMAGE_EXTRACT_AND_RUN=1 "${images[0]}" --diagnose | python3 -I -c "$check" AppImage
      # The same files on Ubuntu 24.04 (its image pinned): the .deb installs there with apt, both answer.
      - name: The 22.04 build installs and answers on Ubuntu 24.04
        env:
          NOBLE: ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
        run: |
          check='import json, sys; d = json.load(sys.stdin); ids = [c["id"] for c in d["checks"]]; assert "paquets" in ids, ids; assert "24.04" in d["os"], d["os"]; print(sys.argv[1], d["os"], len(ids), "checks")'
          docker run --rm -e "CHECK=$check" -v "$PWD/target/x86_64-unknown-linux-gnu/release/bundle:/bundle:ro" "$NOBLE" bash -euc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -q >/dev/null
            apt-get install -y -q python3 /bundle/deb/*.deb >/dev/null
            brain-in-a-box --diagnose | python3 -I -c "$CHECK" deb
            APPIMAGE_EXTRACT_AND_RUN=1 /bundle/appimage/*.AppImage --diagnose | python3 -I -c "$CHECK" AppImage'

  # A Windows whose winget cannot open its source (a GitHub VM's on 2026-10-22: 0x8A15000F), with no Git
  # and no Python but the Store stub: install.ps1, run as the app runs it (no console, nothing to read),
  # updates winget's source once, tries once more, then brings Python and Git with their official
  # installers, pinned and checked, and says so in its log. Runs when install.ps1, this workflow or the
  # fresh PC's helpers change, and on every push to master.
  windows-winget-casse:
    needs: changes
    if: needs.changes.outputs.winget == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fresh install, no Git, no Python, winget's source broken, no console
        timeout-minutes: 30
        run: |
          . .github/ci/poste-neuf.ps1
          & .github/ci/sans-git.ps1 -Preuve "$env:RUNNER_TEMP\sans-git.json"
          . .github/ci/winget-casse.ps1
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File install.ps1 *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\install.txt"
          if ($LASTEXITCODE) { throw "install.ps1 exited $LASTEXITCODE" }

      - name: Python and Git from their official installers, Git's history and Bash there, the log says which way
        if: ${{ !cancelled() }}
        run: |
          $H = $env:USERPROFILE
          $out = Get-Content "$env:RUNNER_TEMP\install.txt" -Raw
          $log = Get-Content "$H\.brain-in-a-box\install.log" -Raw
          $log
          # winget: Python's install, its source updated once, one more try; Git and Obsidian not asked again.
          $calls = @(Get-Content "$env:RUNNER_TEMP\winget-casse\appels.txt")
          $py = 'install -e --id Python.Python.3.12 --source winget --silent --accept-package-agreements --accept-source-agreements --scope user'
          if (($calls -join '|') -cne "$py|source update --name winget|$py") { throw "winget was asked: $($calls -join ' | ')" }
          # Python 3.14.8 for this user, the hooks on it.
          $hook = (@((Get-Content "$H\.claude\settings.json" -Raw | ConvertFrom-Json).hooks.UserPromptSubmit.hooks)[0]).command
          if ($hook -ne "$env:LOCALAPPDATA\Programs\Python\Python314\python.exe") { throw "the hooks run $hook" }
          $v = & $hook -c "import sys; print(sys.version.split()[0])"
          if ($v -ne '3.14.8') { throw "Python $v" }
          # Git 2.56.0.2, put there after the runner's was taken away; a new process finds it.
          $proof = Get-Content "$env:RUNNER_TEMP\sans-git.json" -Raw | ConvertFrom-Json
          $git = @("$env:ProgramFiles\Git\cmd\git.exe", "$env:LOCALAPPDATA\Programs\Git\cmd\git.exe") | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $git) { throw 'no git.exe where Find-Git looks' }
          if ((Get-Item -LiteralPath (Split-Path -Parent $git)).CreationTimeUtc -lt [DateTimeOffset]::FromUnixTimeSeconds($proof.fin_epoch).UtcDateTime) { throw "$git was there before" }
          $gv = & $git --version
          if ($gv -ne 'git version 2.56.0.windows.2') { throw "git: $gv" }
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not (Get-Command git -CommandType Application -ErrorAction SilentlyContinue)) { throw 'a new process does not find git' }
          # What its absence cost on 2026-10-22: the vault's history, Git Bash for Claude Code, gbrain.
          $root = @(& $git -C "$H\Documents\Brain" rev-list --max-parents=0 HEAD)
          if ($root.Count -ne 1 -or (& $git -C "$H\Documents\Brain" log -1 --format=%s $root[0]) -ne 'brain init') { throw 'the vault has no history' }
          if (-not (Test-Path -LiteralPath (Join-Path (Split-Path -Parent (Split-Path -Parent $git)) 'bin\bash.exe'))) { throw 'no Git Bash next to git' }
          if ((Get-Content "$H\.brain-search\engine").Trim() -ne 'gbrain') { throw "the memory is $(Get-Content "$H\.brain-search\engine"), not gbrain" }
          # The log and the screen say which way worked; nothing of the installers left behind.
          foreach ($l in "> installeur officiel : Python 3.14.8 (x64) https://www.python.org/ftp/python/3.14.8/python-3.14.8-amd64.exe`r`ninstalleur officiel : code 0",
                         "> Python : $hook (installeur officiel)",
                         "> winget : sa source est en panne, Git non installe par winget",
                         "> installeur officiel : Git 2.56.0.2 (x64) https://github.com/git-for-windows/git/releases/download/v2.56.0.windows.2/Git-2.56.0.2-64-bit.exe`r`ninstalleur officiel : code 0",
                         "> winget : sa source est en panne, Obsidian non installe par winget") {
            if (-not $log.Contains($l)) { throw "install.log does not say: $l" }
          }
          if ($log -notmatch '(?m)^> Git : .+\\git\.exe \(installeur officiel\)\r?$') { throw 'install.log does not say Git came from its official installer' }
          foreach ($l in "winget : sa source ne s'ouvre pas, je la mets a jour", 'Python 3.14.8 : installeur officiel', 'Git 2.56.0.2 : installeur officiel',
                         '[OK] git (', '[!]  Obsidian non installe (optionnel') {
            if (-not $out.Contains($l)) { throw "the install did not say: $l" }
          }
          if ($out.Contains('Git absent')) { throw 'the install said Git absent' }
          if (Get-ChildItem -LiteralPath "$H\.brain-in-a-box" -Directory -Filter 'installeur-*') { throw 'an installer folder was left behind' }

      - name: "install.ps1 when winget cannot: its functions against stand-ins (pwsh)"
        if: ${{ !cancelled() }}
        run: |
          pwsh -NoProfile -File .github/ci/install-ps1-secours.ps1
          if ($LASTEXITCODE) { throw "install-ps1-secours.ps1 exited $LASTEXITCODE" }

      # Here too a Documents an antivirus closes (a deny of this account's writes), which needs Windows.
      - name: "install.ps1's stops say their cause, and a closed Documents sends a new brain to the profile (pwsh)"
        if: ${{ !cancelled() }}
        run: |
          pwsh -NoProfile -File .github/ci/install-ps1-arrets.ps1
          if ($LASTEXITCODE) { throw "install-ps1-arrets.ps1 exited $LASTEXITCODE" }

  # A real install on a real Windows, the way a user runs it: no Python but the
  # Microsoft Store stub (what broke installs in the field), so Python comes from winget.
  # The memory is gbrain, as on macOS, at the release engine/gbrain-pin.json pins: this job
  # is what makes that pin a tested one. No secret here: the Voyage path runs against
  # .github/ci/fake_voyage.py, and the rejected-key path against the real API with a bad key.
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install.ps1 parses in Windows PowerShell 5.1 and PowerShell 7
        run: |
          foreach ($exe in 'powershell', 'pwsh') {
            & $exe -NoProfile -Command '$e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1).Path, [ref]$null, [ref]$e); if ($e) { $e | ForEach-Object { Write-Host $_.Extent.StartLineNumber $_.Message }; exit 1 }'
            if ($LASTEXITCODE) { exit 1 }
          }

      - name: install.ps1 is pure ASCII (5.1 reads a BOM-less script as ANSI)
        run: |
          $bad = Select-String -Path install.ps1 -Pattern '[^\x00-\x7F]'
          if ($bad) { $bad; exit 1 }

      # A Codex of the user's own, there before the kit: as long as Codex is not chosen, nothing touches
      # it (.github/ci/same-as-master.ps1 checks it after the installs below).
      - name: A Codex of the user's own, before anything
        run: |
          $C = "$env:USERPROFILE\.codex"
          New-Item -ItemType Directory "$C\sessions\2026\10\15" -Force | Out-Null
          Set-Content "$C\config.toml" "model = `"gpt-x`"`n[mcp_servers.mine]`ncommand = `"mine.exe`"" -Encoding ascii
          Set-Content "$C\AGENTS.md" 'My own rules.' -Encoding ascii
          Set-Content "$C\hooks.json" '{"hooks": {"Stop": [{"hooks": [{"type": "command", "command": "mine.cmd"}]}]}}' -Encoding ascii
          Set-Content "$C\sessions\2026\10\15\rollout-mine.jsonl" '{"type": "session_meta", "payload": {"source": "cli"}}' -Encoding ascii
          Get-ChildItem $C -Recurse -File -Force | ForEach-Object { "$($_.FullName) $((Get-FileHash $_.FullName).Hash)" } | Sort-Object |
            Set-Content "$env:RUNNER_TEMP\user-codex.txt"

      - name: Fresh install, only the Store python stub on the PATH, a Voyage key Voyage refuses
        run: |
          . .github/ci/poste-neuf.ps1
          $env:VOYAGE_API_KEY = 'pa-ci-refused-not-a-secret'
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\install-1.txt"
          if ($LASTEXITCODE) { exit 1 }
          $out = Get-Content "$env:RUNNER_TEMP\install-1.txt" -Raw
          if ($out -notmatch "Voyage n'a pas accepte cette cle") { throw 'a refused key was not reported' }
          foreach ($f in "$env:RUNNER_TEMP\install-1.txt", "$env:USERPROFILE\.brain-in-a-box\install.log", "$env:USERPROFILE\.gbrain\config.json") {
            if (Select-String -Path $f -SimpleMatch 'pa-ci-refused' -Quiet) { throw "the key leaked into $f" }
          }

      - name: The install did what it says
        run: |
          $H = $env:USERPROFILE
          $s = Get-Content "$H\.claude\settings.json" -Raw
          if ($s -match 'stub') { throw 'hooks wired to the Store stub' }
          if ($s -notmatch 'AppData\\\\Local\\\\Programs\\\\Python') { throw 'hooks not wired to the Python winget installed' }
          $j = $s | ConvertFrom-Json
          $cd = @(@($j.hooks.UserPromptSubmit.hooks) | Where-Object { "$($_.args)" -like '*correction-detector.py*' })
          if ($cd.Count -ne 1) { throw "correction-detector wired $($cd.Count) times" }
          if ($cd[0].command -notlike '*python.exe') { throw "hook is not in exec form: $($cd[0].command)" }
          $uc = @(@($j.hooks.SessionStart.hooks) | Where-Object { "$($_.args)" -like '*gbrain-update-check.py*' })
          if ($uc.Count -ne 1) { throw "gbrain-update-check wired $($uc.Count) times under SessionStart" }
          if ($uc[0].command -notlike '*python.exe') { throw "SessionStart hook is not in exec form: $($uc[0].command)" }
          $cs = @(@($j.hooks.SessionStart.hooks) | Where-Object { "$($_.args)" -like '*controle-sessionstart.py*' })
          if ($cs.Count -ne 1) { throw "controle-sessionstart wired $($cs.Count) times under SessionStart" }
          if ($cs[0].command -notlike '*python.exe') { throw "controle-sessionstart is not in exec form: $($cs[0].command)" }
          if (-not (Test-Path "$H\.claude\hooks\brain\gbrain_update.py")) { throw 'gbrain_update.py not installed next to the hooks' }
          if (-not (Test-Path "$H\.claude\hooks\brain\controle.py")) { throw 'controle.py not installed next to the hooks' }
          foreach ($f in 'controle.cmd', 'controle') {
            if (-not (Test-Path "$H\.local\bin\$f")) { throw "$f not installed in ~\.local\bin" }
          }
          if (-not (Test-Path "$H\Documents\Brain\Profile")) { throw 'vault skeleton missing' }
          if (-not (Test-Path "$H\Documents\Brain\.git")) { throw 'vault is not a git repo' }
          # Git for Windows' autocrlf would turn LF notes into CRLF whenever the night check undoes a fix.
          if ((git -C "$H\Documents\Brain" config core.autocrlf) -ne 'false') { throw 'the vault repo rewrites line ends' }
          Get-ScheduledTask -TaskName BrainNightly, BrainReflection | Format-Table TaskName, State
          # No black window at 12:00 and 23:00: the reflection runs pythonw.exe, as the nightly does.
          foreach ($t in 'BrainNightly', 'BrainReflection') {
            $exe = (Get-ScheduledTask -TaskName $t).Actions.Execute
            if ($exe -notlike '*\pythonw.exe') { throw "$t starts $exe" }
          }
          if (Get-ScheduledTask -TaskName BrainSearchReindex -ErrorAction SilentlyContinue) { throw 'the old BrainSearchReindex task is still there' }
          if (-not (Get-ScheduledTask -TaskName BrainNightly).Settings.StartWhenAvailable) { throw 'a missed nightly would not catch up' }
          if (-not (Test-Path "$H\.local\bin\claude.exe")) { throw 'Claude Code not installed' }
          $m = @(Select-String -Path "$H\.claude\CLAUDE.md" -SimpleMatch '<!-- brain-in-a-box -->').Count
          if ($m -ne 1) { throw "CLAUDE.md marker found $m times" }
          foreach ($sk in Get-ChildItem skills -Directory) {
            if (-not (Test-Path "$H\.claude\skills\$($sk.Name)\SKILL.md")) { throw "skill $($sk.Name) not installed" }
          }
          # Nothing chosen: Claude alone, as before there was a choice, and no file says so.
          if (Test-Path "$H\.brain-in-a-box\agents.json") { throw 'nothing was chosen, yet agents.json was written' }
          if ((Get-Content "$env:RUNNER_TEMP\install-1.txt" -Raw) -match 'agents IA') { throw 'a line about agents with nothing chosen' }
          foreach ($f in 'importer-memoire.cmd', 'importer-memoire') {
            if (-not (Test-Path "$H\.local\bin\$f")) { throw "$f not installed in ~\.local\bin" }
          }

      # What a terminal user runs (importer-memoire.cmd), on synthetic exports: an export read and its
      # plan announced, no AI asked. Git Bash's launcher, the skill's, in the step after the next ones.
      - name: importer-memoire.cmd reads an export and says what would leave, no AI asked
        run: |
          $py = (@((Get-Content "$env:USERPROFILE\.claude\settings.json" -Raw | ConvertFrom-Json).hooks.UserPromptSubmit.hooks)[0]).command
          & $py -I engine/tests/import_fixtures.py "$env:RUNNER_TEMP\fx"
          if ($LASTEXITCODE) { throw "fixtures: exit $LASTEXITCODE" }
          $im = "$env:USERPROFILE\.local\bin\importer-memoire.cmd"
          $lines = @(& $im preparer "$env:RUNNER_TEMP\fx\chatgpt-2026.zip" --json)
          if ($LASTEXITCODE) { throw "preparer exited $LASTEXITCODE : $lines" }
          $plan = ($lines[-1] | ConvertFrom-Json).plan
          if ($plan.source -ne 'chatgpt' -or $plan.conversations -ne 150) { throw "unexpected plan: $($lines[-1])" }
          $out = (& $im estimer $plan.id --appels 1) -join "`n"
          $out
          if ($LASTEXITCODE -or $out -notmatch 'Ce qui part : vers Claude seulement') { throw 'estimer did not say where it goes' }
          & $im annuler $plan.id
          if ($LASTEXITCODE) { throw "annuler exited $LASTEXITCODE" }
          Remove-Item "$env:USERPROFILE\.brain-in-a-box\import" -Recurse -Force

      # Python comes first: _agents.py decides. Nothing after it runs: not even the install log.
      - name: Codex is refused on this system (-Agents or BIAB_AGENTS), before anything changes
        run: |
          $H = $env:USERPROFILE
          $snap = { foreach ($f in "$H\.claude\settings.json", "$H\.claude\CLAUDE.md", "$H\.brain-in-a-box\installed.json", "$H\.brain-in-a-box\install.log") { "$f $((Get-FileHash $f).Hash)" } }
          $before = (& $snap) -join "`n"
          foreach ($case in @(@('-Agents', 'codex'), @('-Agents', 'claude,codex', '-Prefere', 'codex'), @('env'))) {
            if ($case[0] -eq 'env') { $env:BIAB_AGENTS = 'codex'; $case = @() }
            $out = (powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File install.ps1 @case 2>&1) -join "`n"
            $rc = $LASTEXITCODE
            Remove-Item Env:BIAB_AGENTS -ErrorAction SilentlyContinue
            $out
            if (-not $rc) { throw "install.ps1 $case went on" }
            if ($out -notmatch 'Codex arrive bientot sur ce systeme') { throw "install.ps1 $case did not say why" }
          }
          if (Test-Path "$H\.brain-in-a-box\agents.json") { throw 'a refused choice was written' }
          if (((& $snap) -join "`n") -ne $before) { throw 'a refused choice changed the install' }
          exit 0   # the step would otherwise end with the last refused run's exit code

      - name: Unit tests (engine/tests) with the Python the installer set up
        run: |
          $py = (@((Get-Content "$env:USERPROFILE\.claude\settings.json" -Raw | ConvertFrom-Json).hooks.UserPromptSubmit.hooks)[0]).command
          & $py -I -m unittest discover -s engine/tests -v
          if ($LASTEXITCODE) { throw "unit tests failed (exit $LASTEXITCODE)" }

      # poste-neuf.ps1 left only the Store stub on the job's PATH: the script takes the Python the installer set up.
      - name: install.ps1's Codex functions against stand-ins (pwsh)
        run: |
          $py = (@((Get-Content "$env:USERPROFILE\.claude\settings.json" -Raw | ConvertFrom-Json).hooks.UserPromptSubmit.hooks)[0]).command
          $env:PATH = "$(Split-Path -Parent $py);$env:PATH"
          pwsh -NoProfile -File .github/ci/install-ps1-codex.ps1
          if ($LASTEXITCODE) { throw "install-ps1-codex.ps1 exited $LASTEXITCODE" }

      - name: gbrain is the memory (keyword brain, no key)
        run: |
          $H = $env:USERPROFILE
          $gb = "$H\.bun\bin\gbrain.exe"
          if (-not (Test-Path $gb)) { throw 'gbrain.exe not linked' }
          if ((Get-Content "$H\.brain-search\engine").Trim() -ne 'gbrain') { throw "engine: $(Get-Content "$H\.brain-search\engine")" }
          if (-not (Test-Path "$H\.gbrain\brain.pglite")) { throw 'no brain.pglite' }
          $want = (Get-Content engine\gbrain-pin.json -Raw | ConvertFrom-Json).sha
          $head = (git -C "$H\DEV\gbrain" rev-parse HEAD).Trim()
          if ($head -ne $want) { throw "gbrain at $head, engine/gbrain-pin.json pins $want" }
          & $gb --version
          $cfg = Get-Content "$H\.gbrain\config.json" -Raw | ConvertFrom-Json
          if (-not $cfg.embedding_disabled) { throw 'a brain without a key should be keyword-only' }
          $src = (& $gb sources list) -join "`n"; $src
          if ($src -notmatch '(?m)^\s+vault\s') { throw 'the vault is not a gbrain source' }
          # gbrain skips README.md files; Profile/lessons.md is a page.
          $q = (& "$H\.local\bin\gbq.cmd" query "captured corrections") -join "`n"; $q
          if ($LASTEXITCODE) { throw "gbq.cmd query exited $LASTEXITCODE" }
          if ($q -notmatch '(?i)profile/lessons' -or $q -match '#chunk') { throw 'gbq.cmd query was not answered by gbrain' }
          # The onboarding's re-index, verbatim.
          & "$H\.local\bin\gbq.cmd" sync --repo "$H\Documents\Brain" --no-pull --no-embed; if ($LASTEXITCODE) { throw 'gbq.cmd sync failed' }
          & "$H\.local\bin\gbq.cmd" embed --stale --max-usd 0.10; if ($LASTEXITCODE) { throw 'gbq.cmd embed failed on a keyword brain' }

      # As on macOS and Linux: an approved gbq query runs gbq, not what a session wrote in its folder.
      - name: gbq's reads start gbrain from gbq.py's folder, so a folder's bunfig.toml never runs (the real Bun and gbrain)
        run: |
          $H = $env:USERPROFILE
          $d = (New-Item -ItemType Directory "$env:RUNNER_TEMP\bunfig-session" -Force).FullName
          Set-Location $d
          $w = "$d\witness"
          [IO.File]::WriteAllText("$d\bunfig.toml", "preload = [`"./x.ts`"]`n")
          [IO.File]::WriteAllText("$d\x.ts", "require(`"fs`").writeFileSync(" + ($w | ConvertTo-Json) + ", `"ran`");`n")
          & "$H\.bun\bin\gbrain.exe" --version *> $null
          if (-not (Test-Path $w)) { throw 'control: gbrain.exe started from this folder did not run its preload, so this step proves nothing' }
          Remove-Item $w
          foreach ($c in 'query', 'search') {
            $q = (& "$H\.local\bin\gbq.cmd" $c "captured corrections" 2>&1) -join "`n"; $q
            if (Test-Path $w) { throw "gbq.cmd $c ran the folder's preload" }
            if ($q -notmatch '(?i)lessons') { throw "gbq.cmd $c from its own folder found nothing" }
          }

      - name: A hook runs the way Claude Code spawns it (exec form)
        run: |
          $j = Get-Content "$env:USERPROFILE\.claude\settings.json" -Raw | ConvertFrom-Json
          $h = @($j.hooks.UserPromptSubmit.hooks)[0]
          '{"prompt": "hello", "session_id": "ci", "transcript_path": ""}' | & $h.command @($h.args)
          if ($LASTEXITCODE) { throw "correction-detector exited $LASTEXITCODE" }

      - name: gbq and controle work from Git Bash (Claude Code's Bash tool), onboarding commands included
        shell: bash
        run: |
          out=$(~/.local/bin/gbq query "captured corrections") && echo "$out" && echo "$out" | grep -qi 'profile/lessons'
          ~/.local/bin/gbq sync --repo ~/Documents/Brain --no-pull --no-embed
          ~/.local/bin/gbq embed --stale --max-usd 0.10
          # What the /controle skill runs; statut only reads the state, the check itself runs below.
          out=$(~/.local/bin/controle --help) && echo "$out" | grep -q 'annuler'
          ~/.local/bin/controle statut
          # What the importer-memoire skill runs (the export from the step above), no AI asked.
          out=$(~/.local/bin/importer-memoire --help) && echo "$out" | grep -q 'preparer'
          ~/.local/bin/importer-memoire conseil
          id=$(~/.local/bin/importer-memoire preparer "$RUNNER_TEMP/fx/claude-combinee.zip" --json | tail -1 | sed -nE 's/.*"id": "([0-9a-f]{12})".*/\1/p')
          [ -n "$id" ]
          out=$(~/.local/bin/importer-memoire estimer "$id") && grep -q 'Ce qui part : vers Claude seulement' <<< "$out"
          ~/.local/bin/importer-memoire annuler "$id"
          rm -rf ~/.brain-in-a-box/import

      - name: The 7-day gbrain update, dry run against the real GitHub (reads, decides, changes nothing)
        run: |
          $H = $env:USERPROFILE
          $py = (@((Get-Content "$H\.claude\settings.json" -Raw | ConvertFrom-Json).hooks.UserPromptSubmit.hooks)[0]).command
          $head = (git -C "$H\DEV\gbrain" rev-parse HEAD).Trim()
          # Compared before and after rather than expected absent: a job that runs across 04:00
          # also gets the real BrainNightly, which writes them (2026-10-14).
          $files = 'update-state.json', 'last-update.json', 'update.lock'
          $snap = { $files | ForEach-Object { $p = "$H\.gbrain\$_"; if (Test-Path $p) { "$_ $((Get-FileHash $p).Hash) $((Get-Item $p).LastWriteTimeUtc.Ticks)" } else { "$_ -" } } }
          $before = (& $snap) -join "`n"
          # Its own lines carry accents: only their ASCII parts are matched.
          $out = (& $py -I "$H\.claude\hooks\brain\gbrain_update.py" --a-blanc 2>&1) -join "`n"; $out
          if ($LASTEXITCODE) { throw "gbrain_update.py --a-blanc exited $LASTEXITCODE" }
          if ($out -notmatch 'tags v\* en amont : [1-9]') { throw 'the list of gbrain releases was not read' }
          if ($out -notmatch 'cision : ') { throw 'no decision printed' }
          if ((git -C "$H\DEV\gbrain" rev-parse HEAD).Trim() -ne $head) { throw 'a dry run moved gbrain' }
          $after = (& $snap) -join "`n"
          if ($after -ne $before) { throw "a dry run wrote in ~/.gbrain:`n$before`n->`n$after" }

      - name: The nightly task commits the day's notes and indexes them (S4U, as registered)
        run: |
          $H = $env:USERPROFILE
          $utf8 = New-Object Text.UTF8Encoding $false
          [IO.File]::WriteAllText("$H\Documents\Brain\Journal\lighthouse.md", "# The lighthouse`n`nThe lighthouse keeper logs every storm and repairs the lamp lens before winter.`n", $utf8)
          # The update step runs for real (list, registry, state) but paused: whether a release is
          # 7 days old today depends on upstream, and installing one is covered by engine/tests.
          $until = (Get-Date).ToUniversalTime().AddDays(2).ToString("s") + "Z"
          [IO.File]::WriteAllText("$H\.gbrain\update-state.json", "{`"pause_jusqua`": `"$until`"}", $utf8)
          Start-ScheduledTask -TaskName BrainNightly
          $sw = [Diagnostics.Stopwatch]::StartNew()
          Start-Sleep -Seconds 3
          while ((Get-ScheduledTask -TaskName BrainNightly).State -eq 'Running' -and $sw.Elapsed.TotalSeconds -lt 900) { Start-Sleep -Seconds 3 }
          $info = Get-ScheduledTaskInfo -TaskName BrainNightly
          Get-Content "$H\.gbrain\nightly.log"
          if ($info.LastTaskResult -ne 0) { throw "BrainNightly LastTaskResult $($info.LastTaskResult)" }
          $log = Get-Content "$H\.gbrain\nightly.log" -Raw
          foreach ($want in '[gbrain-update] exit 0', '[controle] exit 0', '[sync] exit 0', '[embed] exit 0', '[brain_search] exit 0', 'nightly done') {
            if (-not $log.Contains($want)) { throw "nightly.log lacks '$want'" }
          }
          $at = '[gbrain-update] exit', '[controle] exit', '[sync] exit' | ForEach-Object { $log.IndexOf($_) }
          if ($at[0] -gt $at[1] -or $at[1] -gt $at[2]) { throw "update, night check and sync out of order: $($at -join ', ')" }
          # The night check commits the day's notes itself ("nightly <date>"), before its fixes;
          # the vault commit after it only catches what is left.
          if ((git -C "$H\Documents\Brain" log -1 --format=%s -- Journal/lighthouse.md) -notmatch '^nightly ') { throw "today's note was not committed by the nightly" }
          $lu = Get-Content "$H\.gbrain\last-update.json" -Raw | ConvertFrom-Json
          if ($lu.status -ne 'paused' -or -not $lu.derniere_verif_ok) { throw "update step: status $($lu.status), last check $($lu.derniere_verif_ok)" }
          $q = (& "$H\.local\bin\gbq.cmd" query "lighthouse keeper storm") -join "`n"; $q
          if ($q -notmatch '(?i)lighthouse' -or $q -match '#chunk') { throw 'the note written today is not in gbrain after the nightly' }
          # The session's first line, spawned the way Claude Code does: its JSON or nothing, and never twice for one run.
          $cs = @(@((Get-Content "$H\.claude\settings.json" -Raw | ConvertFrom-Json).hooks.SessionStart.hooks) | Where-Object { "$($_.args)" -like '*controle-sessionstart.py*' })[0]
          $first = ('{"source": "startup", "session_id": "ci"}' | & $cs.command @($cs.args)) -join "`n"; $first
          if ($LASTEXITCODE) { throw "controle-sessionstart exited $LASTEXITCODE" }
          if ($first -and ($first | ConvertFrom-Json).hookSpecificOutput.hookEventName -ne 'SessionStart') { throw 'controle-sessionstart printed something else than its JSON' }
          $etat = Get-Content "$H\.brain-in-a-box\controle\etat.json" -Raw | ConvertFrom-Json
          # Each start is told of the brain; the night's line ("Controle du cerveau") comes once.
          $night = { param($o) $o -and ($o | ConvertFrom-Json).hookSpecificOutput.additionalContext -match 'Contr.le du cerveau' }
          if ($etat.rapport_reecrit -and ($etat.corrections -or $etat.a_voir) -and -not (& $night $first)) { throw 'the night check wrote a report, the session would not hear of it' }
          $again = ('{"source": "startup", "session_id": "ci"}' | & $cs.command @($cs.args)) -join "`n"
          if (& $night $again) { throw "the same line came twice: $again" }

      - name: The night check fixes a trapped vault, undoing the night puts every note back, a vault without git is left alone
        run: |
          $H = $env:USERPROFILE
          $py = (@((Get-Content "$H\.claude\settings.json" -Raw | ConvertFrom-Json).hooks.UserPromptSubmit.hooks)[0]).command
          $ctl = "$H\.local\bin\controle.cmd"
          $T = "$env:RUNNER_TEMP\controle"
          $V = "$T\Brain"
          function Snap($root) {
            Get-ChildItem -LiteralPath $root -Recurse -File -Force | Where-Object { $_.FullName -notlike "$root\.git\*" } |
              ForEach-Object { "$($_.FullName.Substring($root.Length)) $((Get-FileHash -LiteralPath $_.FullName).Hash)" } | Sort-Object
          }
          & $py -I engine\tests\vault_piege.py $V
          if ($LASTEXITCODE) { throw "vault_piege.py exited $LASTEXITCODE" }
          $before = Snap $V
          $out = (& $ctl nuit --sans-claude --brain $V --etat "$T\etat" 2>&1) -join "`n"; $out
          if ($LASTEXITCODE) { throw "controle nuit exited $LASTEXITCODE" }
          $etat = Get-Content "$T\etat\etat.json" -Raw | ConvertFrom-Json
          if ($etat.corrections -lt 5) { throw "only $($etat.corrections) fixes on the trapped vault" }
          $pw = 'hunter2-ci-' + 'canari'
          if ((Get-Content "$V\Projects\api-notes.md" -Raw).Contains($pw)) { throw 'a password was left in clear' }
          if ((git -C $V log -p --all) -match [regex]::Escape($pw)) { throw 'a password reached git history' }
          $out = (& $ctl annuler derniere-nuit --brain $V --etat "$T\etat" 2>&1) -join "`n"; $out
          if ($LASTEXITCODE) { throw "controle annuler exited $LASTEXITCODE" }
          if ((Get-Content "$V\Projects\api-notes.md" -Raw).Contains($pw)) { throw "undoing the night put a secret back" }
          # A masked secret comes back on its own, by its id, when asked for explicitly.
          $ids = @([regex]::Matches($out, 'S1-\d{6}-\d{2,3}') | ForEach-Object { $_.Value } | Sort-Object -Unique)
          if (-not $ids) { throw 'the undo did not list the masked secrets' }
          foreach ($id in $ids) {
            & $ctl annuler $id --remettre-le-secret --brain $V --etat "$T\etat"
            if ($LASTEXITCODE) { throw "controle annuler $id exited $LASTEXITCODE" }
          }
          $diff = @(Compare-Object $before (Snap $V) | ForEach-Object { $_.InputObject -replace ' [0-9A-F]{64}$', '' } | Sort-Object -Unique)
          if ("$diff" -ne '\Profile\controle.md') { throw "undoing the night left these files changed: $diff" }
          if ((Get-Content "$V\Profile\controle.md" -Raw) -notmatch '## Annul') { throw 'the report does not say the night was undone' }
          # No git, no fix: nothing in the vault changes, the cause is in etat.json.
          $N = "$T\sans-git"
          New-Item -ItemType Directory "$N\Projects" -Force | Out-Null
          Copy-Item "$V\Projects\deploy.md", "$V\Projects\api-notes.md" "$N\Projects\"
          $before = Snap $N
          & $ctl nuit --sans-claude --brain $N --etat "$T\etat-sans-git"
          if ($LASTEXITCODE) { throw "controle nuit exited $LASTEXITCODE on a vault without git" }
          if (Compare-Object $before (Snap $N)) { throw 'a vault without git was changed' }
          $etat = Get-Content "$T\etat-sans-git\etat.json" -Raw | ConvertFrom-Json
          if ($etat.cause -ne 'pas_de_git' -or $etat.corrections -ne 0) { throw "vault without git: cause $($etat.cause), $($etat.corrections) fixes" }

      - name: A second run is idempotent, and an existing user loses nothing
        run: |
          $H = $env:USERPROFILE
          # What a Windows install from before gbrain left, and what its owner changed since.
          Register-ScheduledTask -TaskName BrainSearchReindex -Action (New-ScheduledTaskAction -Execute cmd.exe -Argument '/c exit 0') -Trigger (New-ScheduledTaskTrigger -Daily -At 04:00) -User $env:USERNAME -Force | Out-Null
          Add-Content "$H\.claude\hooks\brain\session-logger.py" '# adapted on this PC'
          $sp = "$H\.claude\settings.json"
          $j = Get-Content $sp -Raw | ConvertFrom-Json
          $j | Add-Member -NotePropertyName mine -NotePropertyValue 'kept'
          $j.hooks.Stop[0].hooks = @($j.hooks.Stop[0].hooks | Where-Object { "$($_.args)" -notlike '*session-recap.py*' })
          [IO.File]::WriteAllText($sp, ($j | ConvertTo-Json -Depth 20))
          $note = [IO.File]::ReadAllText("$H\Documents\Brain\Journal\lighthouse.md")
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\install-2.txt"
          if ($LASTEXITCODE) { exit 1 }
          $bak = @(Get-ChildItem "$H\.brain-in-a-box\backups\*\brain\session-logger.py")
          if ($bak.Count -ne 1 -or -not (Select-String -Path $bak[0].FullName -SimpleMatch 'adapted on this PC' -Quiet)) { throw 'the adapted hook was not backed up' }
          if ((Get-FileHash "$H\.claude\hooks\brain\session-logger.py").Hash -ne (Get-FileHash engine\hooks\session-logger.py).Hash) { throw 'the hook was not updated' }
          if ((Get-Content "$env:RUNNER_TEMP\install-2.txt" -Raw) -notmatch 'session-logger\.py') { throw 'the replaced hook was not reported' }
          $all = @(Get-ChildItem "$H\.brain-in-a-box\backups" -Recurse -File)
          if ($all.Count -ne 1) { throw "unchanged files were backed up: $($all.FullName -join ', ')" }
          $sb = @(Get-ChildItem "$H\.claude\settings.json.bak-*" | Where-Object { Select-String -Path $_.FullName -SimpleMatch '"kept"' -Quiet })
          if (-not $sb.Count) { throw 'settings.json was rewritten without a backup' }
          if ((Get-Content $sp -Raw | ConvertFrom-Json).mine -ne 'kept') { throw 'a setting of the user was lost' }
          if (Test-Path "$H\.brain-in-a-box\agents.json") { throw 'nothing was chosen, yet agents.json was written' }
          if (Get-ScheduledTask -TaskName BrainSearchReindex -ErrorAction SilentlyContinue) { throw 'the old BrainSearchReindex task is still there' }
          if ([IO.File]::ReadAllText("$H\Documents\Brain\Journal\lighthouse.md") -ne $note) { throw 'a note changed' }
          $q = (& "$H\.local\bin\gbq.cmd" query "lighthouse keeper storm") -join "`n"
          if ($q -notmatch '(?i)lighthouse' -or $q -match '#chunk') { throw 'gbrain lost the note on a second run' }
          $j = Get-Content "$env:USERPROFILE\.claude\settings.json" -Raw | ConvertFrom-Json
          $all = @(@($j.hooks.UserPromptSubmit.hooks) + @($j.hooks.Stop.hooks) + @($j.hooks.SessionStart.hooks))
          foreach ($h in 'correction-detector', 'session-logger', 'session-indexer', 'session-recap', 'gbrain-update-check', 'controle-sessionstart') {
            $n = @($all | Where-Object { "$($_.command) $($_.args)" -like "*$h.py*" }).Count
            if ($n -ne 1) { throw "$h wired $n times after a second run" }
          }
          $m = @(Select-String -Path "$env:USERPROFILE\.claude\CLAUDE.md" -SimpleMatch '<!-- brain-in-a-box -->').Count
          if ($m -ne 1) { throw "CLAUDE.md marker found $m times after a second run" }
          if ((Get-Content "$env:USERPROFILE\.brain-search\engine").Trim() -ne 'gbrain') { throw 'a second run left gbrain' }
          $n = @((& "$env:USERPROFILE\.bun\bin\gbrain.exe" sources list) | Select-String '^\s+vault\s').Count
          if ($n -ne 1) { throw "vault source listed $n times after a second run" }

      # The README's command: no choice, as every Windows user has run it so far.
      - name: One-liner mode (irm | iex) under the Restricted policy of a fresh PC
        run: |
          Unregister-ScheduledTask -TaskName BrainNightly, BrainReflection -Confirm:$false
          git archive --format=zip --prefix=brain-in-a-box-master/ -o "$env:RUNNER_TEMP\src.zip" HEAD
          $env:BIAB_ARCHIVE = "$env:RUNNER_TEMP\src.zip"
          $env:BRAIN_DIR = "$env:RUNNER_TEMP\Brain2"
          powershell -NoProfile -ExecutionPolicy Restricted -Command "Get-Content -Raw '$PWD\install.ps1' | Invoke-Expression" *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\install-iex.txt"
          if ($LASTEXITCODE) { exit 1 }
          if (-not (Test-Path "$env:USERPROFILE\.brain-in-a-box\src\vault-skeleton")) { throw 'sources not unpacked' }
          if (-not (Test-Path "$env:RUNNER_TEMP\Brain2\Profile")) { throw 'vault not created in BRAIN_DIR' }
          Get-ScheduledTask -TaskName BrainNightly, BrainReflection | Format-Table TaskName, State
          if (Test-Path "$env:USERPROFILE\.brain-in-a-box\agents.json") { throw 'nothing was chosen, yet agents.json was written' }
          if ((Get-Content "$env:RUNNER_TEMP\install-iex.txt" -Raw) -match 'agents IA') { throw 'a line about agents with nothing chosen' }

      - name: A Voyage key added later turns on search by meaning (fake Voyage, no secret)
        run: |
          $H = $env:USERPROFILE
          $py = (@((Get-Content "$H\.claude\settings.json" -Raw | ConvertFrom-Json).hooks.UserPromptSubmit.hooks)[0]).command
          $flog = "$env:RUNNER_TEMP\fake-voyage.log"
          Start-Process $py -ArgumentList @('-I', "$PWD\.github\ci\fake_voyage.py", '8899') -RedirectStandardOutput $flog -RedirectStandardError "$flog.err"
          Start-Sleep -Seconds 2
          # What a proxy setup looks like: gbrain, and the installer's key check, go to the stand-in.
          $cfgPath = "$H\.gbrain\config.json"
          'import json,sys; p=sys.argv[1]; d=json.load(open(p)); d["provider_base_urls"]={"voyage":"http://127.0.0.1:8899/v1"}; json.dump(d,open(p,"w"),indent=2)' | Set-Content "$env:RUNNER_TEMP\base.py" -Encoding ascii
          & $py -I "$env:RUNNER_TEMP\base.py" $cfgPath
          $env:VOYAGE_API_KEY = 'ci-fake-key-not-a-secret'
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File install.ps1 *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\install-voyage.txt"
          if ($LASTEXITCODE) { exit 1 }
          Remove-Item Env:VOYAGE_API_KEY
          $out = Get-Content "$env:RUNNER_TEMP\install-voyage.txt" -Raw
          if ($out -notmatch 'cle acceptee par Voyage') { throw 'the key check did not pass against the stand-in' }
          if ($out -notmatch 'recherche par le sens') { throw 'the brain did not move to search by meaning' }
          foreach ($f in "$env:RUNNER_TEMP\install-voyage.txt", "$H\.brain-in-a-box\install.log", "$H\.gbrain\nightly.log") {
            if (Select-String -Path $f -SimpleMatch 'ci-fake-key' -Quiet) { throw "the key leaked into $f" }
          }
          $cfg = Get-Content $cfgPath -Raw | ConvertFrom-Json
          if ($cfg.embedding_model -ne 'voyage:voyage-4') { throw "embedding_model: $($cfg.embedding_model)" }
          if ($cfg.voyage_api_key -ne 'ci-fake-key-not-a-secret') { throw 'key not stored in config.json' }
          $gb = "$H\.bun\bin\gbrain.exe"
          $rr = (& $gb config get search.reranker.model) -join ''
          if ($rr -notmatch 'rerank-3-lite') { throw "reranker: $rr" }
          $stats = (& $gb stats) -join "`n"; $stats
          $emb = [regex]::Match($stats, 'Embedded:\s+(\d+)').Groups[1].Value
          if (-not $emb -or [int]$emb -lt 3) { throw "only '$emb' chunks embedded" }
          $before = @(Select-String -Path $flog -Pattern 'embeddings n=').Count
          $q = (& "$H\.local\bin\gbq.cmd" query "storm keeper lamp") -join "`n"; $q
          if ($q -notmatch '(?i)lighthouse') { throw 'query by meaning missed the lighthouse note' }
          $after = @(Select-String -Path $flog -Pattern 'embeddings n=').Count
          Get-Content $flog
          if ($after -le $before) { throw 'the query was not embedded (no vector search)' }

      - name: Fallback - gbrain gone or impossible to install, keyword search stays
        run: |
          $H = $env:USERPROFILE
          # gbrain removed behind the installer's back: gbq answers from the keyword index.
          Rename-Item "$H\.bun\bin\gbrain.exe" gbrain.exe.off
          $q = (& "$H\.local\bin\gbq.cmd" query "lighthouse keeper storm" 2>&1) -join "`n"; $q
          if ($LASTEXITCODE -or $q -notmatch 'lighthouse.md#chunk') { throw 'no keyword fallback with gbrain missing' }
          # A re-run that cannot install gbrain (its folder is not a gbrain clone): the install still
          # succeeds, in keyword mode, and the nightly keeps the keyword index fresh.
          Rename-Item "$H\DEV\gbrain" gbrain.off
          New-Item -ItemType Directory "$H\DEV\gbrain" | Out-Null
          Set-Content "$H\DEV\gbrain\notes.txt" 'not gbrain'
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File install.ps1
          if ($LASTEXITCODE) { exit 1 }
          if ((Get-Content "$H\.brain-search\engine").Trim() -ne 'brain_search') { throw 'engine is not brain_search after a failed gbrain install' }
          & "$H\.local\bin\gbq.cmd" sync; if ($LASTEXITCODE) { throw 'gbq sync (reindex) failed in fallback mode' }
          $q = (& "$H\.local\bin\gbq.cmd" query "lighthouse keeper storm") -join "`n"; $q
          if ($LASTEXITCODE -or $q -notmatch 'lighthouse.md#chunk') { throw 'gbq.cmd query failed in fallback mode' }
          Start-ScheduledTask -TaskName BrainNightly
          Start-Sleep -Seconds 3
          $sw = [Diagnostics.Stopwatch]::StartNew()
          while ((Get-ScheduledTask -TaskName BrainNightly).State -eq 'Running' -and $sw.Elapsed.TotalSeconds -lt 300) { Start-Sleep -Seconds 2 }
          if ((Get-ScheduledTaskInfo -TaskName BrainNightly).LastTaskResult -ne 0) { throw 'nightly failed in fallback mode' }
          Get-Content "$H\.gbrain\nightly.log" -Tail 6

      # A gbrain the nightly moved past the pin stays where it is: its brain may already be
      # migrated. merge-base cannot see that on the shallow clone, the version guard does.
      - name: A re-install never moves gbrain back down to the pin
        run: |
          $H = $env:USERPROFILE
          $G = "$H\DEV\gbrain"
          Remove-Item -Recurse -Force $G
          Rename-Item "$G.off" gbrain
          $pin = Get-Content engine\gbrain-pin.json -Raw | ConvertFrom-Json
          $pv = [version]$pin.tag.TrimStart('v')
          $url = 'https://github.com/garrytan/gbrain.git'
          $newer = @(git ls-remote --tags --refs $url 'refs/tags/v*' | ForEach-Object {
              $tag = ($_ -split "`t")[1] -replace '^refs/tags/', ''
              if ($tag -match '^v(\d+\.\d+\.\d+(\.\d+)?)$') { [pscustomobject]@{ tag = $tag; v = [version]$Matches[1] } }
            } | Where-Object { $_.v -gt $pv } | Sort-Object v)
          if (-not $newer.Count) { Write-Host "::warning::no gbrain release above $($pin.tag) yet: nothing to check"; exit 0 }
          $tag = $newer[0].tag
          git -C $G -c credential.helper= fetch -q --depth 1 $url "refs/tags/${tag}:refs/tags/${tag}"
          if ($LASTEXITCODE) { throw "fetch of $tag failed" }
          git -C $G -c advice.detachedHead=false checkout -q --detach $tag
          if ($LASTEXITCODE) { throw "checkout of $tag failed" }
          $head = (git -C $G rev-parse HEAD).Trim()
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File install.ps1 *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\install-newer.txt"
          if ($LASTEXITCODE) { exit 1 }
          if ((git -C $G rev-parse HEAD).Trim() -ne $head) { throw "the installer moved gbrain from $tag back to $($pin.tag)" }
          if ((Get-Content "$env:RUNNER_TEMP\install-newer.txt" -Raw) -notmatch 'gbrain deja a jour \(v') { throw "the installer did not see gbrain is past the pin" }

      # Claude alone, the same install as master's install.ps1, line for line, command for command,
      # file for file: without agents.json here, with Claude chosen below.
      - name: Claude alone, install.ps1 says and does what master's does (no agents.json)
        run: |
          if (Test-Path "$env:USERPROFILE\.brain-in-a-box\agents.json") { throw 'agents.json is there already' }
          # A CODEX_HOME on a drive that is not there (a USB key, a volume not mounted): Claude alone never reads it.
          if (Test-Path 'Q:\') { throw 'a drive Q: on this runner: this step would prove nothing' }
          $env:CODEX_HOME = 'Q:\codex'
          & .github/ci/same-as-master.ps1

      # Last of Claude alone, so that every step above runs as users who never chose do: irm | iex passes no
      # parameter, the choice comes through BIAB_AGENTS, as the app passes it.
      - name: One-liner mode, Claude chosen through BIAB_AGENTS
        run: |
          $env:BIAB_ARCHIVE = "$env:RUNNER_TEMP\src.zip"
          $env:BIAB_AGENTS = 'claude'
          powershell -NoProfile -ExecutionPolicy Restricted -Command "Get-Content -Raw '$PWD\install.ps1' | Invoke-Expression" *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\install-iex-claude.txt"
          if ($LASTEXITCODE) { exit 1 }
          $a = Get-Content "$env:USERPROFILE\.brain-in-a-box\agents.json" -Raw | ConvertFrom-Json
          if ("$($a.version) $($a.agents -join ',') $($a.prefere) $($a.pose_par)" -ne '1 claude claude install.ps1' -or $a.codex_home) { throw "agents.json: $($a | ConvertTo-Json -Compress)" }
          if ((Get-Content "$env:RUNNER_TEMP\install-iex-claude.txt" -Raw) -notmatch 'agents IA : Claude Code, note dans') { throw 'the choice was not said' }

      - name: Claude alone, install.ps1 says and does what master's does (Claude chosen)
        run: |
          if (((Get-Content "$env:USERPROFILE\.brain-in-a-box\agents.json" -Raw | ConvertFrom-Json).agents -join ',') -ne 'claude') { throw 'agents.json does not say Claude alone' }
          # A Codex whose hooks.json names one of the kit's hooks, wired by hand: only a Codex the kit wired is
          # told it is not chosen any more.
          $C = "$env:RUNNER_TEMP\hand-codex"; New-Item -ItemType Directory $C -Force | Out-Null
          $hook = "$env:USERPROFILE\.claude\hooks\brain\session-logger.py" | ConvertTo-Json
          [IO.File]::WriteAllText("$C\hooks.json", '{"hooks": {"Stop": [{"hooks": [{"type": "command", "command": ' + $hook + '}]}]}}')
          if (-not (Select-String -LiteralPath "$C\hooks.json" -SimpleMatch '\\.claude\\hooks\\brain\\' -Quiet)) { throw "this Codex's hooks.json does not name the kit's hook as install.ps1 looks for it" }
          $env:CODEX_HOME = $C
          & .github/ci/same-as-master.ps1

      # Codex is closed on Windows: a copy of the kit where it is open, as the change that opens it will
      # have it. Claude's install stays what it was; Codex's files go in beside the user's own, which are
      # kept and backed up first; Codex comes from its pinned installer.
      - name: Codex chosen beside Claude (a copy of the kit where Codex is open)
        run: |
          $H = $env:USERPROFILE; $K = "$env:RUNNER_TEMP\kit-open"; $C = "$H\.codex"
          git archive --format=zip -o "$env:RUNNER_TEMP\kit-open.zip" HEAD
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory("$env:RUNNER_TEMP\kit-open.zip", $K)
          $gate = "$K\engine\hooks\_agents.py"
          $g = [IO.File]::ReadAllText($gate)
          # Whatever the gate says: closed today, open on some systems once a change opens them.
          if (([regex]::Matches($g, '(?m)^CODEX_OUVERT = frozenset\(.*\)\r?$')).Count -ne 1) { throw "the gate's line moved" }
          [IO.File]::WriteAllText($gate, ($g -replace '(?m)^CODEX_OUVERT = frozenset\(.*\)(?=\r?$)', 'CODEX_OUVERT = frozenset({"darwin", "linux", "windows"})'))
          # Claude's side, but the gate itself (the copy's _agents.py replaces the one in place, and says so)
          # and the list of Codex's features, which Codex's launcher reads next to it (read with -B: no __pycache__).
          $claude = { @(Get-ChildItem "$H\.claude" -Recurse -File -Force) + @(Get-ChildItem "$H\.local\bin" -File) |
                      Where-Object { $_.Name -notin '_agents.py', 'codex-features.json' } | ForEach-Object { "$($_.FullName) $((Get-FileHash $_.FullName).Hash)" } | Sort-Object }
          $before = @(& $claude)
          $user = @{}; foreach ($n in 'config.toml', 'AGENTS.md', 'hooks.json') { $user[$n] = [IO.File]::ReadAllText("$C\$n") }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$K\install.ps1" -Agents claude,codex -Prefere claude *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\install-codex.txt"
          if ($LASTEXITCODE) { exit 1 }
          $out = Get-Content "$env:RUNNER_TEMP\install-codex.txt" -Raw
          if ($out -notmatch 'agents IA : Claude Code et Codex \(prefere : Claude Code\), note dans') { throw 'the choice was not said' }
          $cb = "$env:LOCALAPPDATA\Programs\OpenAI\Codex\bin\codex.exe"
          if (-not (Test-Path $cb) -or (& $cb --version) -ne 'codex-cli 0.162.1' -or $out -notmatch 'Codex 0\.162\.1 installe') {
            $log = [IO.File]::ReadAllText("$H\.brain-in-a-box\install.log"); $log.Substring([Math]::Max(0, $log.LastIndexOf('> codex :')))
            throw 'Codex did not come from its pinned installer'
          }
          if ($out -notmatch 'le kit a approuve ses 6 hooks pour toi' -or $out -notmatch 'avec /hooks dans Codex') { throw 'the approval was not said' }
          $j = Get-Content "$C\hooks.json" -Raw | ConvertFrom-Json
          if ($j.hooks.Stop[0].hooks[0].command -ne 'mine.cmd') { throw "the user's hook was lost" }
          $py = (@((Get-Content "$H\.claude\settings.json" -Raw | ConvertFrom-Json).hooks.UserPromptSubmit.hooks)[0]).command
          $want = "& '$py' '$H\.claude\hooks\brain\correction-detector.py' --agent codex"
          $cd = $j.hooks.UserPromptSubmit[0].hooks[0]
          if ($cd.commandWindows -cne $want -or $cd.command -cne $want -or $cd.timeout -ne 30) { throw "correction-detector wired as $($cd | ConvertTo-Json -Compress), not $want" }
          $list = "$H\.claude\hooks\brain\codex-features.json"
          if (-not (Test-Path $list) -or (Get-FileHash $list).Hash -ne (Get-FileHash "$K\engine\codex-features.json").Hash) { throw "the launcher's list of Codex's features is not installed" }
          & $py -I -B -c 'import sys; sys.path.insert(0, sys.argv[1]); import _headless_codex as c; assert len(c.load_features()) > 50' "$H\.claude\hooks\brain"
          if ($LASTEXITCODE) { throw 'the launcher, as installed, does not read its list of features' }
          $mine = @(@($j.hooks.UserPromptSubmit.hooks) + @($j.hooks.Stop.hooks) + @($j.hooks.SessionStart.hooks) | Where-Object { "$($_.commandWindows)" -like '& *--agent codex' })
          if ($mine.Count -ne 6) { throw "$($mine.Count) of the kit's hooks in hooks.json" }
          $toml = [IO.File]::ReadAllText("$C\config.toml")
          if (-not $toml.StartsWith($user['config.toml'])) { throw "the user's config.toml was not kept as it was" }
          if (([regex]::Matches($toml, '(?m)^\[hooks\.state\."')).Count -ne 6) { throw 'not six tables in config.toml' }
          foreach ($n in 'hooks.json', 'config.toml') { if (@(Get-ChildItem "$C\$n.bak-*").Count -ne 1) { throw "$n was not backed up once" } }
          $env:CODEX_HOME = $C; & $cb features list | Out-Null; $rc = $LASTEXITCODE; Remove-Item Env:CODEX_HOME
          if ($rc) { throw 'Codex does not read config.toml as the kit left it' }
          $am = [IO.File]::ReadAllText("$C\AGENTS.md")
          if (-not $am.StartsWith($user['AGENTS.md'].TrimEnd()) -or ([regex]::Matches($am, '<!-- brain-in-a-box -->')).Count -ne 1) { throw "AGENTS.md: the user's text lost, or the block not there once" }
          # No gbq rule on Windows: gbq.cmd goes through cmd.exe, which reads an & in its arguments again.
          if (Test-Path "$C\rules") { throw "a rules folder in Codex's home: gbq would run without asking" }
          if ($out -notmatch 'Codex demande avant chaque gbq') { throw 'that Codex asks before gbq was not said' }
          $V = "$H\Documents\Brain"
          if (-not (Test-Path "$V\AGENTS.md") -or (git -C $V ls-files AGENTS.md) -ne 'AGENTS.md') { throw "the vault's AGENTS.md is not there, or not committed" }
          foreach ($sk in Get-ChildItem skills -Directory) { if (-not (Test-Path "$H\.agents\skills\$($sk.Name)\SKILL.md")) { throw "Codex's skill $($sk.Name) is not installed" } }
          if (-not (Test-Path "$H\.brain-in-a-box\codex-hooks-poses.json")) { throw 'when the hooks were wired was not noted' }
          if ($out -notmatch 'codex login') { throw 'codex login was not said' }
          $after = @(& $claude)
          if (($after -join "`n") -cne ($before -join "`n")) { Compare-Object $before $after; throw "Claude's install changed" }

      - name: Codex chosen, a second run changes nothing and says so
        run: |
          $H = $env:USERPROFILE; $K = "$env:RUNNER_TEMP\kit-open"; $C = "$H\.codex"
          $snap = { foreach ($f in 'hooks.json', 'config.toml', 'AGENTS.md') { "$f $((Get-FileHash "$C\$f").Hash)" } }
          $before = (& $snap) -join "`n"
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$K\install.ps1" *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\install-codex-2.txt"
          if ($LASTEXITCODE) { exit 1 }
          $out = Get-Content "$env:RUNNER_TEMP\install-codex-2.txt" -Raw
          if (((& $snap) -join "`n") -ne $before) { throw 'a second run rewrote one of Codex files' }
          foreach ($n in 'hooks.json', 'config.toml') { if (@(Get-ChildItem "$C\$n.bak-*").Count -ne 1) { throw "$n backed up again" } }
          foreach ($want in 'les hooks du kit y sont deja', 'les 6 hooks du kit sont approuves', 'a deja le bloc du kit', 'Codex deja installe \(0\.162\.1\)', 'AGENTS\.md deja la') {
            if ($out -notmatch $want) { throw "a second run did not say: $want" }
          }

      - name: Codex chosen, a hooks.json of Codex's that does not parse stops install.ps1 before anything
        run: |
          $H = $env:USERPROFILE; $K = "$env:RUNNER_TEMP\kit-open"; $C = "$H\.codex"
          Copy-Item "$C\hooks.json" "$env:RUNNER_TEMP\hooks.json.good"
          Set-Content "$C\hooks.json" '{"hooks": {,}}' -Encoding ascii -NoNewline
          $snap = { foreach ($f in "$C\hooks.json", "$C\config.toml", "$H\.brain-in-a-box\install.log", "$H\.brain-in-a-box\agents.json", "$H\.claude\settings.json") { "$f $((Get-FileHash $f).Hash)" } }
          $before = (& $snap) -join "`n"
          $out = (powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$K\install.ps1" 2>&1) -join "`n"
          $rc = $LASTEXITCODE
          $out
          if (-not $rc) { throw 'install.ps1 went on over a hooks.json it cannot read' }
          if ($out -notmatch "hooks\.json n'est pas du JSON valide \(ligne 1, colonne") { throw 'it did not say why' }
          if (((& $snap) -join "`n") -ne $before) { throw 'something changed before it stopped' }
          Move-Item "$env:RUNNER_TEMP\hooks.json.good" "$C\hooks.json" -Force
          exit 0

      - name: Back to Claude alone, Codex's files stay and the way to remove them is said
        run: |
          $H = $env:USERPROFILE; $K = "$env:RUNNER_TEMP\kit-open"; $C = "$H\.codex"
          $before = (Get-FileHash "$C\hooks.json").Hash
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$K\install.ps1" -Agents claude *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\install-back.txt"
          if ($LASTEXITCODE) { exit 1 }
          $out = Get-Content "$env:RUNNER_TEMP\install-back.txt" -Raw
          if ($out -notmatch "Codex n'est plus choisi : ce que le kit a pose pour lui reste, et ses hooks se taisent") { throw 'leaving Codex was not said' }
          if ($out -match '=== Codex') { throw 'the Codex section ran with Claude alone' }
          if ((Get-FileHash "$C\hooks.json").Hash -ne $before) { throw "Codex's hooks.json changed with Claude alone" }
          if (((Get-Content "$H\.brain-in-a-box\agents.json" -Raw | ConvertFrom-Json).agents -join ',') -ne 'claude') { throw 'agents.json does not say Claude alone' }

      # Last, it writes into the vault: the reflection as its task starts it (pythonw.exe, S4U, no console),
      # on a session of today, with a Claude Code nobody logged in to. It fails, and says so where the night
      # check and the next session read it: its state and its error log.
      - name: The reflection's task runs without a window and still writes its state
        run: |
          $H = $env:USERPROFILE
          $now = [DateTime]::UtcNow
          $p = "$H\.claude\projects\ci-reflection"
          New-Item -ItemType Directory $p -Force | Out-Null
          $lines = foreach ($i in 0..3) {
            $who = if ($i % 2) { 'assistant' } else { 'user' }
            $content = if ($who -eq 'user') { "the lighthouse keeper asks about storms $i" } else { , @{ type = 'text'; text = "noted, storm $i" } }
            @{ type = $who; timestamp = $now.AddSeconds($i - 10).ToString('yyyy-MM-ddTHH:mm:ss.fffZ'); cwd = "$H\Documents\Brain"; message = @{ role = $who; content = $content } } | ConvertTo-Json -Compress -Depth 5
          }
          [IO.File]::WriteAllLines("$p\ci.jsonl", [string[]]$lines)
          $state = "$H\.claude\logs\daily-reflection.state.json"
          $before = if (Test-Path $state) { (Get-Item $state).LastWriteTimeUtc } else { [DateTime]::MinValue }
          if ((Get-ScheduledTask -TaskName BrainReflection).Actions.Execute -notlike '*\pythonw.exe') { throw 'BrainReflection does not start pythonw.exe' }
          Start-ScheduledTask -TaskName BrainReflection
          Start-Sleep -Seconds 3
          $sw = [Diagnostics.Stopwatch]::StartNew()
          while ((Get-ScheduledTask -TaskName BrainReflection).State -eq 'Running' -and $sw.Elapsed.TotalSeconds -lt 1000) { Start-Sleep -Seconds 3 }
          $info = Get-ScheduledTaskInfo -TaskName BrainReflection
          Get-Content "$H\.claude\logs\daily-reflection-errors.log" -Tail 5 -ErrorAction SilentlyContinue
          if ($info.LastTaskResult -ne 0) { throw "BrainReflection LastTaskResult $($info.LastTaskResult)" }
          if (-not (Test-Path $state) -or (Get-Item $state).LastWriteTimeUtc -le $before) { throw 'the reflection run under pythonw.exe did not write its state' }
          $st = Get-Content $state -Raw | ConvertFrom-Json
          $st | ConvertTo-Json -Compress
          if (-not ($st.last_error -or $st.last_ok)) { throw 'the state says neither a run nor a failure' }
