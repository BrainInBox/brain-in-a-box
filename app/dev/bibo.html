<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Bibo prend vie</title>
  <!-- Every gesture and scene of Bibo (bibo.js, bibo-anim.css), each on a loop. Opened from disk. -->
  <link rel="stylesheet" href="../src/styles.css">
  <link rel="stylesheet" href="../src/bibo-anim.css">
  <style>
    :root {
      --vt-bg: #0a0a0a;
      --vt-card: #141414;
      --vt-stage: #1c1c1c;
      --vt-line: #262626;
      --vt-ink: #fafafa;
      --vt-ink-2: #a3a3a3;
      --vt-glow: rgba(247, 169, 196, 0.16);
      --vt-pink: #f7a9c4;
      color-scheme: dark;
    }
    html, body { height: auto; }
    body.vitrine {
      background: var(--vt-bg);
      color: var(--vt-ink);
      font: 16px/1.5 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: auto;
      user-select: auto;
    }
    .top { max-width: 1180px; margin: 0 auto; padding: 56px 16px 8px; text-align: center; }
    .top h1 { margin: 0; font-size: clamp(30px, 5vw, 44px); line-height: 1.1; letter-spacing: -0.02em; }
    .top p { margin: 14px auto 0; max-width: 38em; color: var(--vt-ink-2); text-wrap: balance; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr));
      gap: 16px;
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 16px 72px;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 14px 14px 16px;
      background: var(--vt-card);
      border: 1px solid var(--vt-line);
      border-radius: 14px;
    }
    .stage {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      margin-bottom: 8px;
      background: radial-gradient(closest-side, var(--vt-glow), transparent) var(--vt-stage);
      border-radius: 10px;
      overflow: hidden;
    }
    .stage .bibo { width: 76%; height: auto; cursor: default; }
    .card h2 { margin: 0; font-size: 17px; line-height: 1.3; }
    .when { margin: 0 0 10px; color: var(--vt-ink-2); font-size: 14px; }
    .replay {
      align-self: flex-start;
      margin-top: auto;
      padding: 7px 14px;
      font: inherit;
      font-size: 14px;
      color: var(--vt-ink);
      background: transparent;
      border: 1px solid var(--vt-line);
      border-radius: 999px;
      cursor: pointer;
    }
    .replay:hover { border-color: var(--vt-pink); }
    .replay:focus-visible { outline: 2px solid var(--vt-pink); outline-offset: 2px; }
    /* A phone: two cards a row. */
    @media (max-width: 520px) {
      .top { padding-top: 40px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-top: 24px; }
      .card { padding: 8px 8px 12px; border-radius: 12px; }
      .card h2 { font-size: 15px; }
      .when { font-size: 13px; }
      .replay { padding: 6px 12px; font-size: 13px; }
    }
  </style>
  <script src="../src/ui.js" defer></script>
  <script src="../src/bibo.js" defer></script>
  <script src="bibo-vitrine.js" defer></script>
</head>
<body class="vitrine">
  <header class="top">
    <h1>Bibo prend vie</h1>
    <p>Chaque geste de Bibo, en boucle, et le moment où l’app ou le guide le joue. Avec « Réduire les animations » dans les réglages de ton ordinateur, chacun montre une pose fixe.</p>
  </header>
  <main class="grid"></main>
</body>
</html>
