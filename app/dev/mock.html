<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Brain in a Box (maquette)</title>
  <link rel="stylesheet" href="../src/styles.css">
  <style>
    .mock-bar { position: fixed; right: 8px; bottom: 8px; z-index: 9; display: flex; gap: 6px; flex-wrap: wrap;
      font: 12px -apple-system, sans-serif; background: #222; color: #eee; padding: 6px 8px; border-radius: 8px; opacity: .85; }
    .mock-bar a { color: #9cf; }
    /* Headless screenshots sometimes land mid-fade: driven runs skip the entrance animation. */
    .driven .screen > *, .driven .actions > * { animation: none !important; }
  </style>
  <script>
  // Fake window.__TAURI__ for the window in ../src, opened straight from disk.
  //   ?s=manque    everything missing (default)
  //   ?s=echec     the Obsidian step fails once, then « Réessayer » works
  //   ?s=installe  everything already installed
  //   ?s=motscles  everything installed, but the brain searches by keywords only (no Voyage key)
  //   ?s=bloque    old macOS, no network: nothing can be installed
  //   ?s=login-early        Claude Code is there but not connected: the install asks for the login first
  //   ?s=repair-not-logged  the same Mac, the login put off, then the Obsidian step fails: Claude needs the login
  // Repair with Claude, Claude Code installed and connected (see REPAIRS below):
  //   ?s=repair-ok           Obsidian's download is cut, Claude cleans up and relaunches: fixed
  //   ?s=repair-user-action  macOS refuses Documents: nothing for the app to do, the user allows it, relaunch
  //   ?s=repair-low          Claude is not sure, sets the half-copied Obsidian aside: fixed
  //   ?s=repair-round2       a relaunch does not help, the second (last) round drops the Voyage key: fixed
  //   ?s=repair-fail         Bun set aside, still failing, last round still failing: « Remettre comme avant », Terminal
  //   ?s=repair-regression   the repair breaks Bun: undone
  //   ?s=repair-quota        the subscription is at its limit
  //   ?s=repair-auth         Claude must log in again, then the analysis works
  //   ?s=repair-suspect      the log tries to steer Claude: no repair
  //   ?s=repair-offline      no internet under the failure
  //   ?s=repair-terminal     Claude Code too old for the in-app repair: plan B in Terminal
  // Driving, for screenshots: &go=<screen> clicks through to welcome|diag|voyage|install|login|done,
  // &key=pa-... types and checks that key on the Voyage screen (pa-…limit, pa-…off for the other answers),
  // &add=diag|done clicks « Activer la recherche par le sens » once on that screen,
  // &fail=obsidian|brain makes that step fail once, &pause=<step> leaves that step running (the Voyage upgrade is « brain »),
  // &details=1 opens the log, &sent=1 opens « Voir exactement ce que j'envoie », &press=1 clicks the main button once on arrival,
  // &jump=showLogin|showDone opens that screen of app.js directly (the screenshot budget is only 3 s),
  // &repair=offline|exhausted|unsupported|disabled|not_logged_in is what repair_status answers under a failed step,
  // &pause=analyze|apply leaves Claude's analysis or the repair running,
  // &error=timeout|init_invalid|invalid_verdict|refused|api|busy ends the first analysis on that error (init_invalid
  // then rules the in-app repair out, as repair.rs does),
  // &agents=codex|codex,claude|claude,codex: agents.json lists Codex, the first one is preferred (Codex open in this copy,
  // as the tests open it): repair.rs names who is asked and who answered, the screens say Codex where they said Claude,
  // Claude in Terminal only when Claude is listed; &secours=1 has the preferred one hit its limit, the other one answers;
  // &repair=agents is a choice the kit cannot read (no AI asked),
  // &porte=1 (implied by &agents= with Codex): the kit lets Codex be chosen here: the welcome names no
  // AI and the choice screen comes first, preselecting &agents= (else Claude); &choix=claude|codex|both picks
  // there, &resume=claude|codex picks who writes the evening summary when both; the steps, the checks, the
  // logins and the end follow the choice; &choix=codex,claude picks Codex first, then Claude the next time the
  // choice shows (« Changer d'IA »); &codex=billed|managed|system|unknown is how Codex is logged in at first,
  // logged in with ChatGPT two checks after its login window opened (&after=managed|billed|system: logged in that
  // way instead); before the brain step put the kit's list of Codex's features, Codex cannot repair yet (not_yet),
  // unless agents.json already lists it,
  // &at=<css> stops the driving on &go's screen only once that element is there, &nth=<n> only on its n-th arrival there,
  // &click=<act>[,<act>…] clicks those buttons in that order, once each, and &go's screen counts only after the last.
  // The advice (advice.rs, the kit's sentences): &conseil=claude_connecte|claude_vu|chatgpt_bientot|rien|codex|les_deux
  // (else the scenario's: connected where Claude Code is, nothing on a fresh Mac), &hermes=1 Hermes seen too, &hermes=lu
  // seen and its conversations read by the evening reflection.
  // « Importer ma mémoire » (import.rs), the end's card: &imp=<what> is what the importer answers: a_jour (a brain of
  // before the import), deja, compte, pas_un_zip, trop_de_fichiers (5 picked), auth, quota, timeout, phrase (the sentence
  // pasted back), partiel, rien (no fact kept), suspect; &fichiers=3 reads
  // three files; &pause=import leaves the requests running (« Arrêter »); &colle=1 pastes an answer on the paste screen.
  // Bibo: &sleep=3 makes it doze off after 3 s without activity instead of 45.
  // Windows: &os=windows shows the PC's words and checks (manque, installe, motscles, echec with &fail=brain):
  // Python and Git instead of Apple's tools, install.ps1's sections under the brain step.
  // Linux: &os=linux shows the words and checks of an Ubuntu (manque, installe, motscles, echec):
  // the system's tools (git, curl) instead of Apple's, first, and the password note.
  (() => {
    const P = new URLSearchParams(location.search);
    if (P.get('sleep')) window.BIBO_SLEEP_MS = Number(P.get('sleep')) * 1000;
    const WIN = P.get('os') === 'windows';
    const LIN = P.get('os') === 'linux';
    if (WIN) window.BIBO_OS = 'windows';
    if (LIN) window.BIBO_OS = 'linux';
    const scenario = P.get('s') || 'manque';
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    // Driven runs must reach their screen within the screenshot's 3 s budget.
    const LINE_MS = P.get('go') ? 10 : 70;
    const T = (ms) => (P.get('go') ? Math.ceil(ms / 10) : ms);
    const listeners = {};
    const emit = (event, payload) => (listeners[event] || []).forEach((cb) => cb({ event, payload }));
    // Same labels and wording as src-tauri/src/diagnose.rs.
    const LABELS = {
      macos: 'Version de macOS', windows: 'Version de Windows', python: 'Python (pour les automatismes)',
      git: 'Git (l’historique de tes notes)', disk: 'Espace disque', network: 'Connexion internet',
      clt: 'Outils Apple (git, python3)', linux: 'Système', paquets: 'Outils de base (git, python3, curl)', bun: 'Bun (le moteur de la mémoire)', claude: 'Claude Code',
      claude_auth: 'Connexion à Claude', obsidian: 'Obsidian (pour lire tes notes)',
      brain_vault: 'Ton dossier Brain', brain_hooks: 'Les automatismes de Claude',
      brain_skills: 'Les compétences de Claude', brain_memory: 'La mémoire de recherche', voyage: 'Recherche par le sens',
      codex: 'Codex', codex_auth: 'Connexion à Codex', agents: 'Ton choix d’IA', brain_codex_hooks: 'Les automatismes de Codex',
      brain_codex_instructions: 'Tes consignes pour Codex', brain_codex_skills: 'Les compétences de Codex',
    };
    const FIX = {
      clt: 'clt', paquets: 'paquets', bun: 'bun', claude: 'claude', codex: 'codex', obsidian: 'obsidian', agents: 'brain', brain_vault: 'brain', brain_hooks: 'brain', brain_skills: 'brain', brain_memory: 'brain',
      brain_codex_hooks: 'brain', brain_codex_instructions: 'brain', brain_codex_skills: 'brain',
    };
    // install.ps1 brings all of them with the brain.
    if (WIN) Object.assign(FIX, { python: 'brain', git: 'brain', bun: 'brain', obsidian: 'brain' });
    const C = (id, status, detail) => ({ id, label: LABELS[id], status, detail, fix: FIX[id] || null });
    const ALL_STEPS = WIN ? ['claude', 'brain'] : LIN ? ['paquets', 'claude', 'bun', 'obsidian', 'brain'] : ['claude', 'clt', 'bun', 'obsidian', 'brain'];
    const TOOLS_MISSING = WIN
      ? [C('python', 'missing', 'Pas encore installé. Je le prends chez Microsoft (winget).'),
        C('git', 'missing', 'Pas encore installé. Je le prends chez Microsoft (winget).')]
      : LIN ? [C('paquets', 'missing', 'Il manque git et curl. Je les installe : ton ordinateur te demandera ton mot de passe.')]
        : [C('clt', 'missing', 'Pas encore installés. Apple s’en charge, il suffit de cliquer.')];
    const MISSING = [
      ...TOOLS_MISSING,
      C('bun', 'missing', 'Pas encore installé.'),
      C('claude', 'missing', 'Pas encore installé.'),
      C('claude_auth', 'warn', 'Tu te connecteras une fois Claude Code installé.'),
      C('obsidian', 'missing', 'Pas encore installé.'),
      C('brain_vault', 'missing', 'Pas encore créé.'),
      C('brain_hooks', 'missing', 'Pas encore branchés.'),
      C('brain_skills', 'missing', 'Pas encore installées.'),
      C('brain_memory', 'missing', 'Pas encore créée.'),
      C('voyage', 'warn', 'Recherche par mots-clés seulement. Une clé Voyage permet de chercher par le sens.'),
    ];
    const OK = {
      clt: C('clt', 'ok', 'git et python3 sont là.'),
      paquets: C('paquets', 'ok', 'git, python3, curl et unzip sont là.'),
      python: C('python', 'ok', 'Python 3.12.10'),
      git: C('git', 'ok', 'Git 2.51.0'),
      bun: C('bun', 'ok', 'Bun 1.4.2'),
      claude: C('claude', 'ok', 'Claude Code 2.1.296'),
      claude_auth: C('claude_auth', 'ok', 'Tu es connecté.'),
      obsidian: C('obsidian', 'ok', 'Obsidian 1.14.4'),
      brain_vault: C('brain_vault', 'ok', 'Il est dans Documents/Brain.'),
      brain_hooks: C('brain_hooks', 'ok', 'Claude note tes corrections et tes séances.'),
      brain_skills: C('brain_skills', 'ok', 'Installées.'),
      brain_memory: C('brain_memory', 'ok', 'Prête.'),
      voyage: C('voyage', 'ok', 'Activée (Voyage AI)'),
    };
    const SYSTEM = WIN ? 'Windows 11 (24H2)' : LIN ? 'Ubuntu 24.04.1 LTS' : 'macOS 15.4';
    const ARCH = WIN || LIN ? 'x86_64' : 'arm64';
    const ONLINE = [C(WIN ? 'windows' : LIN ? 'linux' : 'macos', 'ok', SYSTEM), C('disk', 'ok', '182 Go libres'), C('network', 'ok', 'github.com et claude.ai répondent.')];
    // Codex's lines (diagnose.rs), missing and there.
    const CODEX_MISSING = {
      codex: C('codex', 'missing', 'Pas encore installé.'),
      codex_auth: C('codex_auth', 'warn', 'Tu te connecteras une fois Codex installé.'),
      brain_codex_hooks: C('brain_codex_hooks', 'missing', 'Pas encore branchés.'),
      brain_codex_instructions: C('brain_codex_instructions', 'missing', 'Pas encore ajoutées.'),
      brain_codex_skills: C('brain_codex_skills', 'missing', 'Pas encore installées.'),
    };
    const CODEX_OK = {
      codex: C('codex', 'ok', 'Codex 0.162.1'),
      codex_auth: C('codex_auth', 'ok', 'Tu es connecté avec ton compte ChatGPT.'),
      brain_codex_hooks: C('brain_codex_hooks', 'ok', 'Codex note tes corrections et tes séances.'),
      brain_codex_instructions: C('brain_codex_instructions', 'ok', 'Codex les lit à chaque séance.'),
      brain_codex_skills: C('brain_codex_skills', 'ok', 'Installées.'),
    };
    // agents.json (&agents=, as written by the installer), then the window's choice (choose_agents).
    const parseAgents = (v) => (v || '').split(',').filter((a, i, all) => ['claude', 'codex'].includes(a) && all.indexOf(a) === i);
    const FILE_AGENTS = parseAgents(P.get('agents'));
    // A trusted agents.json that lists Codex: the gate is open in this copy.
    const PORTE = P.get('porte') === '1' || FILE_AGENTS.includes('codex');
    let chosen = null;
    const agentsNow = () => chosen || (FILE_AGENTS.length ? FILE_AGENTS : ['claude']);
    const pending = () => Boolean(chosen) && chosen.join() !== (FILE_AGENTS.length ? FILE_AGENTS : ['claude']).join();
    // The checks of the agents of now, in diagnose.rs's order; with Claude alone and nothing to record,
    // the list itself, untouched.
    function forAgents(list, done) {
      const agents = agentsNow();
      if (agents.join() === 'claude' && !pending()) return list;
      const out = [];
      for (const c of list) {
        if (c.id === 'network') {
          const sites = ['github.com', ...agents.map((a) => (a === 'codex' ? 'chatgpt.com' : 'claude.ai'))];
          out.push(C('network', 'ok', `${sites.length > 2 ? `${sites.slice(0, -1).join(', ')} et ${sites[sites.length - 1]}` : sites.join(' et ')} répondent.`));
        } else if (c.id === 'claude') {
          for (const a of agents) {
            if (a === 'claude') out.push(c, list.find((x) => x.id === 'claude_auth'));
            else out.push(...['codex', 'codex_auth'].map((id) => (done(id) ? CODEX_OK : CODEX_MISSING)[id]));
          }
          if (pending()) out.push(C('agents', 'missing', 'Je le note en installant ton cerveau.'));
        } else if (c.id === 'claude_auth') {
          continue;
        } else if (c.id === 'brain_hooks' || c.id === 'brain_skills') {
          if (agents.includes('claude')) out.push(c);
          if (c.id === 'brain_skills' && agents.includes('codex')) {
            out.push(...['brain_codex_hooks', 'brain_codex_instructions', 'brain_codex_skills'].map((id) => (done(id) ? CODEX_OK : CODEX_MISSING)[id]));
          }
        } else {
          out.push(c);
        }
      }
      return out;
    }
    // The steps, the agents' where Claude Code's stands (steps::order).
    const forSteps = (steps) => steps.flatMap((s) => (s === 'claude' ? agentsNow() : [s]));
    // Claude Code installed but not connected, the steps in `todo` still to run.
    const CLAUDE_ONLY = {
      'login-early': ['clt', 'bun', 'obsidian', 'brain'],
      'repair-not-logged': ['obsidian', 'brain'],
    };


    // _conseil.py's sentences (CONSEIL_JSON).
    const PHRASES = {
      claude_connecte: 'Tu as déjà Claude Code, connecté à ton abonnement : ton cerveau travaillera avec lui.',
      claude_vu: 'Tu utilises déjà Claude : ton cerveau travaillera avec lui (il te faudra un abonnement Pro ou Max pour Claude Code).',
      chatgpt_bientot: 'Tu utilises ChatGPT : ton cerveau marche avec Claude, il te faudra un abonnement Claude Pro ou Max (ton abonnement ChatGPT ne suffit pas). Codex, l\'IA de ChatGPT, arrive bientôt ici. À la fin, tu pourras apporter à ton cerveau ce que ChatGPT sait de toi.',
      rien: 'Ton cerveau marche avec Claude : il te faudra un abonnement Claude Pro ou Max.',
      codex: 'Tu utilises ChatGPT : ton cerveau peut travailler avec Codex, l\'IA de ChatGPT, sur ton abonnement ChatGPT. À la fin, tu pourras apporter à ton cerveau ce que ChatGPT sait de toi.',
      les_deux: 'Tu as Claude et ChatGPT : ton cerveau peut travailler avec les deux, Claude d\'abord.',
      hermes: 'J\'ai vu Hermes : je ne l\'installe pas et n\'y touche pas. Ses meilleures compétences arrivent dans Claude avec ton cerveau.',
      hermes_lu: 'J\'ai vu Hermes : je ne l\'installe pas et n\'y touche pas. Ses meilleures compétences arrivent dans Claude avec ton cerveau, et chaque soir ton cerveau lit aussi ses conversations.',
    };
    // Claude Code connected where the scenario has it, seen where it is not connected, else nothing.
    function advice() {
      const which = Object.hasOwn(PHRASES, P.get('conseil') || '') ? P.get('conseil')
        : scenario === 'installe' || scenario === 'motscles' || REPAIR ? 'claude_connecte' : Object.hasOwn(CLAUDE_ONLY, scenario) ? 'claude_vu' : 'rien';
      const hermes = { 1: PHRASES.hermes, lu: PHRASES.hermes_lu }[P.get('hermes')] || null;
      return { conseil: { codex: 'codex', les_deux: 'les_deux' }[which] || 'claude', text: PHRASES[which], hermes };
    }

    function diagnosis() {
      const d = { ...diagnosisOfClaude(), advice: advice() };
      if (!chosen) return d;
      // What the agents chosen change: their checks, a choice still to record, their steps.
      const installed = scenario === 'installe' || scenario === 'motscles';
      const checks = forAgents(d.checks, () => installed && FILE_AGENTS.includes('codex'));
      const todo = forSteps(ALL_STEPS).filter((s) => checks.some((c) => c.status === 'missing' && c.fix === s));
      return { ...d, checks, todo };
    }

    function diagnosisOfClaude() {
      if (scenario === 'installe' || scenario === 'motscles') {
        return {
          os: SYSTEM, arch: ARCH, ram_gb: 16, disk_free_gb: 182.4, online: true, todo: [], can_install: true,
          checks: [
            ...ONLINE,
            ...MISSING.map((c) => (scenario === 'motscles' && c.id === 'voyage' ? c : OK[c.id])),
          ],
        };
      }
      if (REPAIR) {
        const checks = MISSING.map((c) => (c.id === 'voyage' || REPAIR.todo.includes(c.fix) ? c : OK[c.id]));
        return { os: SYSTEM, arch: ARCH, ram_gb: 16, disk_free_gb: 182.4, online: true, todo: REPAIR.todo, can_install: true, checks: [...ONLINE, ...checks] };
      }
      if (Object.hasOwn(CLAUDE_ONLY, scenario)) {
        const todo = CLAUDE_ONLY[scenario];
        const checks = MISSING.map((c) => {
          if (c.id === 'claude_auth') return C('claude_auth', 'warn', 'Pas encore connecté. Tu le feras en un clic.');
          return c.id === 'voyage' || todo.includes(c.fix) ? c : OK[c.id];
        });
        return { os: SYSTEM, arch: ARCH, ram_gb: 16, disk_free_gb: 182.4, online: true, todo, can_install: true, checks: [...ONLINE, ...checks] };
      }
      if (scenario === 'bloque') {
        return {
          os: 'macOS 12.7', arch: 'x86_64', ram_gb: 8, disk_free_gb: 2.3, online: false, todo: ALL_STEPS, can_install: false,
          checks: [
            C('macos', 'error', 'macOS 12.7 : il faut macOS 13 ou plus récent. Fais la mise à jour dans Réglages Système.'),
            C('disk', 'error', 'Il reste 2,3 Go, il en faut au moins 3. Fais un peu de place, puis relance.'),
            C('network', 'error', 'Pas d’internet : ni github.com ni claude.ai ne répondent. Vérifie ton Wi-Fi, puis relance.'),
            ...MISSING,
          ],
        };
      }
      return {
        os: SYSTEM, arch: ARCH, ram_gb: 16, disk_free_gb: 182.4, online: true, todo: ALL_STEPS, can_install: true,
        checks: [...ONLINE, ...MISSING],
      };
    }

    const LOGS = {
      paquets: ['Il manque git et curl. Ton ordinateur va te demander ton mot de passe : c’est pour les installer.', 'Lecture des listes de paquets…', 'Les NOUVEAUX paquets suivants seront installés :', '  curl git git-man liberror-perl', 'Paramétrage de git (1:2.43.0-1ubuntu7) …'],
      clt: ['Je demande les outils Apple…', 'Toujours en attente de la fenêtre Apple (0 min 30 s)', 'Outils Apple installés dans /Library/Developer/CommandLineTools'],
      bun: ['Téléchargement de https://bun.sh/install', '######################################################################## 100,0%', 'bun was installed successfully to ~/.bun/bin/bun', 'bun 1.4.2'],
      claude: ['Téléchargement de l’installeur de Claude Code', 'Setting up Claude Code...', '✔ Claude Code successfully installed!', 'Version: 2.1.296', 'Location: /Users/camille/.local/bin/claude'],
      codex: ['Téléchargement de l’installeur de Codex', 'Je vérifie l’installeur de Codex…', 'J’installe Codex…', 'Installing Codex CLI 0.162.1', 'Codex CLI 0.162.1 installed to /Users/camille/.local/bin/codex'],
      obsidian: ['Téléchargement d’Obsidian 1.14.4 (233 Mo)', '  12 %', '  47 %', '  83 %', '  100 %', 'Copie dans /Users/camille/Applications/Obsidian.app', 'Signature vérifiée (6JSW4SJWN9)'],
      brain: WIN ? [
        'Je télécharge le moteur du cerveau…', 'Je mets en place ton cerveau, avec Python, Git, la mémoire et Obsidian (10 à 20 minutes)…',
        '▸ Je vérifie Python et Git, et je les installe s’il le faut (1 sur 13)…', '=== Preflight ===', '  ... Python : installation (winget)', '  [OK] python (~\\AppData\\Local\\Programs\\Python\\Python312\\python.exe)',
        '▸ Je crée ton dossier Brain (3 sur 13)…', '=== Brain vault (~\\Documents\\Brain) ===', '  [OK] skeleton place',
        '▸ J’installe la mémoire, 2 à 5 minutes (10 sur 13)…', '=== Memoire gbrain (2 a 5 minutes la premiere fois) ===', '  [OK] bun 1.4.3',
        '▸ J’installe Obsidian (12 sur 13)…', '=== Claude Code + Obsidian ===', '  ... Obsidian : installation (winget)',
        '▸ Je vérifie que tout répond (13 sur 13)…', '=== Verification ===', '  [OK] memoire : recherche par mots-cles (gbrain)',
      ] : ['Téléchargement de brain-in-a-box', 'Extraction dans ~/.brain-in-a-box/src', '▸ Dependencies', '  ✓ deps OK', '▸ Search by meaning (Voyage AI key, optional)', '  ✓ key taken from VOYAGE_API_KEY', '▸ GBrain', '  ✓ cloned', '  ✓ deps + link', '▸ Vault', '  ✓ ~/Documents/Brain created', '▸ Hooks', '  ✓ 5 hooks installed', '▸ GBrain init + import', '  ✓ brain initialized (Voyage: search by meaning)', '  ✓ vault imported', '  ✓ embedded', 'Done.'],
    };
    const FAILS = {
      obsidian: {
        logs: ['Téléchargement d’Obsidian 1.14.4 (233 Mo)', '  12 %', 'curl: (28) Operation timed out after 300000 milliseconds with 29360128 out of 233704463 bytes received', 'Nettoyage de /var/folders/xy/T/biab-obsidian'],
        message: 'Le téléchargement d’Obsidian a été coupé. Vérifie ta connexion, puis clique sur Réessayer.',
      },
      bun: {
        logs: ['Téléchargement de https://bun.sh/install', 'bun was installed successfully to ~/.bun/bin/bun', 'error: ~/.bun/bin/bun: Permission denied', '✗ Bun ne répond pas après l’installation'],
        message: "Bun s'est installé mais ne répond pas. Réessaie ; si ça recommence, envoie le rapport à l'équipe.",
      },
      brain: {
        logs: [...LOGS.brain.slice(0, 14), '  ✗ embedding failed: Voyage answered 503'],
        message: "L'installation du cerveau s'est arrêtée (code 1) sur : « ✗ embedding failed: Voyage answered 503 ». Relance l'étape ; si ça recommence, envoie le journal à l'équipe.",
      },
    };
    // Same sentences as steps.rs at the end of the brain step.
    const BRAIN_OK = {
      meaning: 'Ton cerveau est installé dans Documents/Brain, avec la recherche par le sens.',
      keywords: 'Ton cerveau est installé dans Documents/Brain. Il cherche par mots-clés ; tu pourras ajouter une clé Voyage plus tard.',
    };
    // Same texts as src-tauri/src/repair.rs (catalogue, user side).
    const L = (id, text, pane = null) => ({ id, text, pane });
    const RELANCER = (name) => L('relancer', `Relancer l'étape « ${name} ».`);
    const NETTOYER = L('nettoyer_dossiers_travail', 'Faire le ménage dans mes fichiers temporaires.');
    const RESEAU = L('verifier_reseau', "Vérifie ton Wi-Fi. Si tu as un VPN ou un réseau d'entreprise, coupe-le le temps de l'installation.");
    const plan = (cause_id, cause, confiance, remedies, actions, explication = null, suspect = false) =>
      ({ cause_id, cause, confiance, remedies, actions, explication, suspect });
    const done = (message = 'Fait.') => ({ outcome: 'fixed', message, undoable: false, retry: false, details: [] });

        const s = document.body.dataset.screen;
        if (s !== seen) {
          seen = s;
          if (s === go) arrivals += 1;
        }
        // This scenario is about someone who put the login off.
        if (scenario === 'repair-not-logged' && q('.login-card')) { q('[data-act=skip]')?.click(); return; }
        if (s === add && !added && q('[data-act=voyage]')) {
          added = true;
          q('[data-act=voyage]').click();
          return;
        }
        if (s === 'voyage' && key && !typed) {
          const input = q('#voyage-key');
          if (input) { typed = true; input.value = key; input.dispatchEvent(new Event('input')); q('[data-act=verify]').click(); }
          return;
        }
        if (s === 'import-paste' && P.get('colle') && !pasted && q('textarea.paste') && q('[data-act=copy-phrase]:not(:disabled)')) {
          pasted = true;
          const area = q('textarea.paste');
          area.value = '- [2026-03-02] Habite à Lyon, boulangère.\n- Préfère des réponses courtes, en français.\n- Travaille avec Malik (comptable).';
          area.dispatchEvent(new Event('input'));
          return;
        }
        if (s === 'choice' && choix.length && q(`[data-agent=${choix[0]}]:not(:disabled)`) && !q('[data-act=back]')) {
          q(`[data-agent=${choix.shift()}]`).click();
          return;
        }
        if (s === 'choice' && resume && q('[data-act=back]') && q(`[data-agent=${resume}]:not(:disabled)`)) {
          q(`[data-agent=${resume}]`).click();
          resume = '';
          return;
        }
        if (clicks.length && q(`[data-act=${clicks[0]}]:not(:disabled)`)) {
          q(`[data-act=${clicks.shift()}]`).click();
          return;
        }
        if (s === go && arrivals >= nth && !clicks.length && (!at || q(at))) {
          const main = q('[data-act=next]:not(:disabled)');
          if (P.get('press') && !pressed && main) { pressed = true; setTimeout(() => main.click(), 200); }
          return;
        }
        if (s === 'voyage' && !key) { q('[data-act=skip]')?.click(); return; }
        const next = q('[data-act=next]:not(:disabled)');
        // A repair scenario goes through Claude: « Réessayer » would only run the step again.
        if (REPAIR && next && next.textContent === 'Réessayer') return;
        next?.click();
      }, 120);
    } else {
      addEventListener('DOMContentLoaded', () => {
        const bar = document.createElement('nav');
        bar.className = 'mock-bar';
        for (const [label, qs] of [['tout manque', '?s=manque'], ['échec', '?s=echec'], ['tout installé', '?s=installe'], ['sans Voyage', '?s=motscles'], ['bloqué', '?s=bloque'], ['connexion tôt', '?s=login-early'], ['réparer sans compte', '?s=repair-not-logged'],
          ['réparé', '?s=repair-ok'], ['à toi de jouer', '?s=repair-user-action'], ['pas sûr', '?s=repair-low'], ['2 essais', '?s=repair-round2'],
          ['raté', '?s=repair-fail'], ['régression', '?s=repair-regression'], ['forfait', '?s=repair-quota'], ['reconnexion', '?s=repair-auth'],
          ['suspect', '?s=repair-suspect'], ['hors ligne', '?s=repair-offline'], ['Terminal', '?s=repair-terminal'],
          ['Codex répare', '?s=repair-ok&agents=codex'], ['Codex puis Claude', '?s=repair-ok&agents=codex,claude&secours=1'],
          ['Codex raté', '?s=repair-fail&agents=codex'], ['Codex sans compte', '?s=echec&agents=codex&repair=not_logged_in'],
          ['choix illisible', '?s=echec&repair=agents'],
          ['porte ouverte', '?s=manque&porte=1'], ['Codex installé', '?s=installe&porte=1&agents=codex'],
          ['Codex facturé', '?s=manque&porte=1&codex=billed'], ['Codex d’entreprise', '?s=manque&porte=1&after=managed'],
          ['PC aux réglages ouverts', '?s=manque&porte=1&os=windows&codex=system'], ['Codex avant le cerveau', '?s=echec&porte=1&choix=codex'],
          ['les deux', '?s=installe&porte=1&agents=claude,codex'],
          ['conseil ChatGPT + Hermes', '?s=manque&conseil=chatgpt_bientot&hermes=1'], ['importer', '?s=installe&go=import&at=.choices&click=import'],
          ['import : à jour', '?s=installe&imp=a_jour&go=import-error&click=import'], ['import : forfait', '?s=installe&imp=quota&go=import-plan&click=import'],
          ['import partiel', '?s=installe&imp=partiel&go=import-plan&click=import']]) {
          const a = document.createElement('a');
          a.href = qs;
          a.textContent = label;
          bar.append(a);
        }
        document.documentElement.append(bar);
      });
    }
  })();
  </script>
