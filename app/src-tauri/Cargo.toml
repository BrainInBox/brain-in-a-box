[package]
name = "brain-in-a-box"
version = "0.1.0"
description = "Installs brain-in-a-box, a second brain for Claude Code, without a terminal"
license = "MIT"
edition = "2021"
rust-version = "1.85"
resolver = "3"

[lib]
name = "biab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
