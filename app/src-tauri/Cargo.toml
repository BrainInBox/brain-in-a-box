[package]
name = "brain-in-a-box"
version = "0.1.0"
description = "Installs brain-in-a-box, a second brain for Claude Code, without a terminal"
license = "MIT"
edition = "2021"
rust-version = "1.85"
resolver = "3"

[lib]
name = "biab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["repair-in-app"]
# Claude analyzes a failed step from inside the app. Off, the window offers no in-app repair.
repair-in-app = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the build through tauri-utils: masking the dossier sent to Claude.
regex = "1"

[dev-dependencies]
tempfile = "3"
