# Throwaway (spike/guide-v2-capture-calque): W3's overlay as the guide would make it, a Tauri window (the
# app's own tauri, tao and wry, Cargo.lock copied from app/src-tauri), driven by the desk test through
# its stdin: « none » / « exclude » set its display affinity (the witness), its end closes it.
[package]
name = "calque-tauri"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
